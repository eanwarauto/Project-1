<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&display=swap">
<style>
/* Layout: full-screen first-person 3D lab (space) + a time layer (time-lapse, molecular zoom with a time bar) = 4D. Single deliberate bright-lab look. */
:root{--ink:#13232B;--veil:rgba(11,20,24,.74);--hot:#E8691E;--cold:#1C7FC4;--zero:#7A3FC4;--ok:#1E9E57;--paper:#FFFFFF;--muted:#5B6E77;--deep:#0B1E2D;
  --font:"Readex Pro","Geeza Pro",Tahoma,sans-serif;color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#0B1418;color:var(--ink);font-family:var(--font)}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.veil{position:fixed;inset:0;display:grid;place-items:center;background:var(--veil);z-index:8;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--paper);border-radius:26px;padding:26px 28px;width:min(760px,100%);box-sizing:border-box;text-align:center;display:grid;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.card h1{margin:0;font-size:clamp(28px,4.6vw,46px);line-height:1.2;text-wrap:balance}
.card h1 span{color:var(--hot)}
.card p{margin:0;color:var(--muted);font-size:18px;line-height:1.7}
.exps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.exp{font:700 21px var(--font);border:3px solid var(--c);border-radius:20px;background:#fff;color:var(--ink);padding:16px 14px;cursor:pointer;display:grid;gap:6px;text-align:center}
.exp small{font-weight:500;font-size:15px;color:var(--muted)}
.exp:focus-visible{outline:4px solid var(--hot);outline-offset:3px}
.credit{font-weight:700;font-size:16px}
.stepbar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:5;max-width:calc(100% - 32px);
  background:rgba(255,255,255,.95);border:3px solid var(--hot);border-radius:18px;padding:10px 20px;font-size:clamp(17px,2.1vw,24px);font-weight:700;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18);box-sizing:border-box}
.stepbar b{color:var(--hot)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;background:rgba(19,35,43,.88);color:#fff;border-radius:999px;
  padding:10px 22px;font-size:18px;font-weight:700;pointer-events:none;max-width:calc(100% - 32px);text-align:center;transition:opacity .4s}
.toast.off{opacity:0}
.goggles{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .8s;
  background:radial-gradient(ellipse 78% 88% at 50% 52%,transparent 78%,rgba(28,127,196,.22) 90%,rgba(19,35,43,.55) 100%)}
.goggles.on{opacity:1}
.chip{position:fixed;top:calc(84px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:5;background:var(--zero);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:18px}
/* molecular (time) layer */
.micro{position:fixed;inset:0;z-index:6;pointer-events:none;display:grid;grid-template-rows:auto 1fr auto;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.micro > *{pointer-events:auto}
.mtop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.mtop h2{margin:0;color:#fff;font-size:clamp(20px,2.6vw,30px)}
.mbtn{font:700 18px var(--font);border:2px solid #fff;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;padding:9px 16px;cursor:pointer}
.mbtn[aria-pressed="true"]{background:#fff;color:var(--deep)}
.mbtn:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.mside{justify-self:start;align-self:center;background:rgba(255,255,255,.94);border-radius:18px;padding:14px 16px;width:min(330px,80vw);font-size:16px;line-height:1.7;display:grid;gap:6px;box-sizing:border-box}
.mside h3{margin:0;font-size:19px}
.lg{display:flex;align-items:center;gap:8px}.lg i{width:16px;height:16px;border-radius:50%;flex:none}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.mbar{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.94);border-radius:18px;padding:10px 14px;flex-wrap:wrap}
.mbar button{font:700 17px var(--font);border:2px solid var(--deep);border-radius:12px;background:#fff;color:var(--deep);padding:7px 12px;cursor:pointer}
.mbar button[aria-pressed="true"]{background:var(--deep);color:#fff}
.mbar input{flex:1;min-width:140px;accent-color:var(--hot)}
.mbar .tl{font-weight:700;min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
.joy{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;z-index:5;
  background:rgba(19,35,43,.35);border:3px solid rgba(255,255,255,.85);display:grid;place-items:center;touch-action:none}
.joy span{position:absolute;bottom:-28px;color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 3px #000}
.knob{width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3);pointer-events:none}
@media (max-width:620px){.exps{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.toast,.goggles{transition:none}}
</style>

<canvas id="gl" aria-label="مختبر رباعي الأبعاد: اسحب للنظر حولك، والمس الأدوات لتنفيذ التجربة"></canvas>
<div class="goggles" id="gog"></div>
<div class="stepbar" id="stepbar" dir="rtl" hidden></div>
<div class="chip" id="chip" dir="rtl" hidden></div>
<div class="toast off" id="toast" dir="rtl"></div>
<div class="joy" id="joy" aria-label="التحرّك في المختبر" role="application"><div class="knob" id="knob"></div><span>تحرّك</span></div>

<div class="micro" id="micro" dir="rtl" hidden>
  <div class="mtop"><h2 id="mTitle">داخل المحلول</h2><div class="tabs" id="mTabs"></div><button class="mbtn" id="mBack" type="button">العودة إلى المختبر</button></div>
  <div class="mside" id="mSide"></div>
  <div class="mbar"><button type="button" id="mRew" aria-label="إعادة من البداية">⏮ من البداية</button><button type="button" id="mPlay" aria-pressed="true">⏸ إيقاف</button>
    <button type="button" id="mSlow" aria-pressed="false">🐢 عرض بطيء</button><span class="tl" id="mTime"></span><input type="range" id="mRange" min="0" max="1000" value="0" aria-label="شريط الزمن"></div>
</div>

<div class="veil" id="veil" dir="rtl">
  <div class="card">
    <h1>المختبر <span>رباعي الأبعاد</span></h1>
    <p>ادخل المختبر بالمعطف والقفّازات، ونفّذ التجربة خطوة بخطوة بيدك، ثمّ ادخل إلى داخل المحلول وتحكّم في الزمن.</p>
    <div class="exps">
      <button class="exp" id="e1" type="button" style="--c:#E8691E">تحضير محلول<small>حساب المولالية · كربونات الصوديوم</small></button>
      <button class="exp" id="e2" type="button" style="--c:#1C7FC4">الإلكتروليتات<small>تصنيف المحاليل A ، B ، C ، D</small></button>
    </div>
    <p style="font-size:15px">اسحب الأدوات بإصبعك لتنفّذ التجربة بيدك · اسحب الشاشة للنظر حولك · استخدم دائرة «تحرّك» للمشي في المختبر</p>
    <p class="credit">إعداد: م. انوار الفضلي</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
const AF='"Readex Pro","Geeza Pro",Tahoma,Arial,sans-serif';
const COL=['#E8691E','#1C7FC4','#7A3FC4'];

try{await Promise.race([document.fonts.load('700 40px "Readex Pro"'),new Promise(r=>setTimeout(r,2500))])}catch(e){}

/* ================= renderer / scene ================= */
const cv=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xDDE8EC);
scene.fog=new THREE.Fog(0xDDE8EC,9,18);
const camera=new THREE.PerspectiveCamera(68,1,0.03,40);
const player=new THREE.Group();player.position.set(0,0,-0.05);scene.add(player);
const head=new THREE.Group();head.position.y=1.6;player.add(head);head.add(camera);
let yaw=0,pitch=-0.16;
function applyView(){player.rotation.y=yaw;head.rotation.x=pitch}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<1?84:66;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0xffffff,0x8FA3AD,0.95));
const sun=new THREE.DirectionalLight(0xffffff,0.55);sun.position.set(2,5,3);scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff,0.18));

/* ================= canvas helpers ================= */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function rr(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath()}
function fit(x,t,maxW,size,w='700'){let s=size;do{x.font=`${w} ${s}px ${AF}`;s-=2}while(x.measureText(t).width>maxW&&s>12);return s+2}
function wrap(x,t,maxW){const words=t.split(' ');const lines=[];let cur='';words.forEach(w=>{const tr=cur?cur+' '+w:w;if(x.measureText(tr).width>maxW&&cur){lines.push(cur);cur=w}else cur=tr});if(cur)lines.push(cur);return lines}
function para(x,t,cx,y,maxW,size,color,lh=1.45,align='center',w='700'){x.font=`${w} ${size}px ${AF}`;x.fillStyle=color;x.textAlign=align;x.textBaseline='alphabetic';const L=wrap(x,t,maxW);L.forEach((l,i)=>x.fillText(l,cx,y+i*size*lh));return L.length*size*lh}
function tex(c){const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
function plane(c,w,h){return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex(c)}))}
/* chemistry markup: CH_{4(g)} -> subscripts */
function segs(s){const o=[];s.replace(/([^_]+)|_\{([^}]*)\}/g,(m,a,b)=>{o.push(a!==undefined?{t:a,sub:0}:{t:b,sub:1})});return o}
function chemW(x,s,size){let w=0;segs(s).forEach(g=>{x.font=`700 ${g.sub?size*.62:size}px ${AF}`;w+=x.measureText(g.t).width});return w}
function chemDraw(x,s,X,Y,size,color){x.textAlign='left';x.textBaseline='alphabetic';x.fillStyle=color;let cx=X;segs(s).forEach(g=>{const sz=g.sub?size*.62:size;x.font=`700 ${sz}px ${AF}`;x.fillText(g.t,cx,Y+(g.sub?size*.26:0));cx+=x.measureText(g.t).width});return cx}

/* ================= room ================= */
const W=4,FRONT=-2.4,BACK=4,HGT=3.2;
(function room(){
  const fc=mkCanvas(512,512),fx=fc.getContext('2d');for(let i=0;i<8;i++)for(let j=0;j<8;j++){fx.fillStyle=(i+j)%2?'#E6EDF0':'#F7FAFB';fx.fillRect(i*64,j*64,64,64)}
  const ft=tex(fc);ft.wrapS=ft.wrapT=THREE.RepeatWrapping;ft.repeat.set(5,4);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(2*W,BACK-FRONT),new THREE.MeshStandardMaterial({map:ft,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.z=(BACK+FRONT)/2;scene.add(floor);
  const wallM=new THREE.MeshStandardMaterial({color:0xEAF2F4,roughness:.95});
  const band=new THREE.MeshStandardMaterial({color:0x0E8F9E,roughness:.8});
  function wall(w,px,pz,ry){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,HGT),wallM);m.position.set(px,HGT/2,pz);m.rotation.y=ry;scene.add(m);
    const b=new THREE.Mesh(new THREE.PlaneGeometry(w,.9),band);b.position.set(px,.45,pz);b.rotation.y=ry;b.translateZ(.005);scene.add(b);
    const s=new THREE.Mesh(new THREE.PlaneGeometry(w,.06),new THREE.MeshStandardMaterial({color:0xE8691E}));s.position.set(px,.93,pz);s.rotation.y=ry;s.translateZ(.006);scene.add(s)}
  wall(2*W,0,FRONT,0);wall(2*W,0,BACK,Math.PI);wall(BACK-FRONT,-W,(BACK+FRONT)/2,Math.PI/2);wall(BACK-FRONT,W,(BACK+FRONT)/2,-Math.PI/2);
  const ceil=new THREE.Mesh(new THREE.PlaneGeometry(2*W,BACK-FRONT),new THREE.MeshStandardMaterial({color:0xF7FAFB}));ceil.rotation.x=Math.PI/2;ceil.position.set(0,HGT,(BACK+FRONT)/2);scene.add(ceil);
  for(let i=-1;i<=1;i++)for(let j=0;j<3;j++){const l=new THREE.Mesh(new THREE.PlaneGeometry(1.2,.35),new THREE.MeshBasicMaterial({color:0xFFFFFF}));l.rotation.x=Math.PI/2;l.position.set(i*2.4,HGT-.01,-1.5+j*2);scene.add(l)}
})();

/* ---------- posters ---------- */
function poster(draw,w,h,pw,ph,pos,ry){const c=mkCanvas(w,h),x=c.getContext('2d');draw(x,w,h);const m=plane(c,pw,ph);m.position.copy(pos);m.rotation.y=ry;scene.add(m);
  const fr=new THREE.Mesh(new THREE.PlaneGeometry(pw+.06,ph+.06),new THREE.MeshStandardMaterial({color:0x13232B}));fr.position.copy(pos);fr.rotation.y=ry;fr.translateZ(-.004);scene.add(fr);return m}
function grad(x,w,h,a,b){const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,w,h)}
function flame(x,cx,cy,s){x.save();x.translate(cx,cy);x.scale(s,s);x.fillStyle='#FFD25A';x.beginPath();x.moveTo(0,-200);x.bezierCurveTo(120,-60,110,90,0,120);x.bezierCurveTo(-110,90,-120,-60,0,-200);x.fill();
  x.fillStyle='#FFF4C2';x.beginPath();x.moveTo(0,-80);x.bezierCurveTo(60,0,55,80,0,100);x.bezierCurveTo(-55,80,-60,0,0,-80);x.fill();x.restore()}
function flake(x,cx,cy,r,col){x.save();x.translate(cx,cy);x.strokeStyle=col;x.lineWidth=r*.09;x.lineCap='round';for(let i=0;i<6;i++){x.rotate(Math.PI/3);x.beginPath();x.moveTo(0,0);x.lineTo(0,-r);x.moveTo(0,-r*.55);x.lineTo(r*.22,-r*.75);x.moveTo(0,-r*.55);x.lineTo(-r*.22,-r*.75);x.stroke()}x.restore()}
const P=Math.PI;
/* general-chemistry wall art */
poster((x,w,h)=>{x.fillStyle='#fff';x.fillRect(0,0,w,h);para(x,'رموز الأمان في المختبر',w/2,120,w-60,70,'#C62828');
  const S=[['قابل للاشتعال','#E8691E','f'],['أكّال','#13232B','c'],['سام','#13232B','t'],['مهيّج','#13232B','!']];
  S.forEach(([t,c,k],i)=>{const cx=w/4+(i%2)*w/2,cy=330+Math.floor(i/2)*470;x.save();x.translate(cx,cy);x.rotate(P/4);x.fillStyle='#fff';x.strokeStyle='#D32F2F';x.lineWidth=22;x.fillRect(-120,-120,240,240);x.strokeRect(-120,-120,240,240);x.restore();
    x.fillStyle='#13232B';if(k==='f')flame(x,cx,cy+20,.42);else if(k==='c'){x.fillRect(cx-70,cy-40,50,14);x.fillRect(cx+20,cy-40,50,14);x.beginPath();x.arc(cx-45,cy,10,0,7);x.arc(cx+45,cy,10,0,7);x.fill();x.fillRect(cx-80,cy+40,160,18)}
    else if(k==='t'){x.beginPath();x.arc(cx,cy-15,55,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(cx-20,cy-20,14,0,7);x.arc(cx+20,cy-20,14,0,7);x.fill();x.fillStyle='#13232B';x.fillRect(cx-25,cy+30,50,30)}
    else{x.font=`700 190px ${AF}`;x.textAlign='center';x.textBaseline='middle';x.fillText('!',cx,cy+10)}
    para(x,t,cx,cy+215,w/2-40,50,'#13232B')})},1024,1300,1.0,1.27,new THREE.Vector3(2.75,1.75,FRONT+.01),0);
poster((x,w,h)=>{grad(x,w,h,'#E3F2FD','#BBDEFB');para(x,'حالات المادة',w/2,120,w-60,80,'#0D47A1');
  const st=[['صلب','#1C7FC4',0],['سائل','#0E8F9E',1],['غاز','#7A3FC4',2]];
  st.forEach(([t,c,k],i)=>{const X=60+i*(w-120)/3,Y=220,BW2=(w-120)/3-30,BH2=760;x.fillStyle='#fff';rr(x,X,Y,BW2,BH2,30);x.fill();x.lineWidth=8;x.strokeStyle=c;x.stroke();x.fillStyle=c;
    for(let n=0;n<16;n++){let px,py;if(k===0){px=X+50+(n%4)*55;py=Y+BH2-300+Math.floor(n/4)*55}else if(k===1){px=X+40+((n*53)%(BW2-80));py=Y+BH2-260+((n*71)%200)}else{px=X+30+((n*97)%(BW2-60));py=Y+60+((n*131)%(BH2-140))}
      x.beginPath();x.arc(px,py,22,0,7);x.fill()}
    para(x,t,X+BW2/2,Y+BH2+90,BW2,64,c)})},1024,1300,1.0,1.27,new THREE.Vector3(-2.75,1.75,FRONT+.01),0);
poster((x,w,h)=>{grad(x,w,h,'#1B2A41','#0B1E2D');para(x,'تركيب الذرّة',w/2,120,w-60,84,'#fff');const cx=w/2,cy=640;
  x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=6;[170,290,400].forEach(r=>{x.beginPath();x.arc(cx,cy,r,0,7);x.stroke()});
  for(let i=0;i<6;i++){x.fillStyle=i%2?'#E8691E':'#90A4AE';x.beginPath();x.arc(cx+Math.cos(i)*34,cy+Math.sin(i*1.7)*34,40,0,7);x.fill()}
  [[170,.3],[170,3.4],[290,1],[290,2.6],[290,4.2],[290,5.6],[400,.7],[400,3.9]].forEach(([r,a])=>{x.fillStyle='#4FC3F7';x.beginPath();x.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,22,0,7);x.fill()});
  para(x,'نواة: بروتونات ونيوترونات · إلكترونات في مستويات الطاقة',w/2,1150,w-120,46,'#CFE8F5')},1024,1300,1.0,1.27,new THREE.Vector3(-W+.01,1.75,-.6),P/2);
poster((x,w,h)=>{x.fillStyle='#FFFDF5';x.fillRect(0,0,w,h);para(x,'أدوات المختبر',w/2,110,w-60,72,'#13232B');x.lineWidth=10;x.strokeStyle='#0E8F9E';x.fillStyle='#BFE6F5';
  const T=[['كأس زجاجية',170],['دورق مخروطي',420],['دورق قياسي',660],['مخبار مدرّج',880]];
  x.beginPath();x.moveTo(110,300);x.lineTo(110,560);x.lineTo(230,560);x.lineTo(230,300);x.stroke();x.fillRect(116,450,108,104);
  x.beginPath();x.moveTo(400,290);x.lineTo(400,370);x.lineTo(330,560);x.lineTo(510,560);x.lineTo(440,370);x.lineTo(440,290);x.stroke();
  x.beginPath();x.moveTo(645,250);x.lineTo(645,430);x.stroke();x.beginPath();x.moveTo(675,250);x.lineTo(675,430);x.stroke();x.beginPath();x.arc(660,490,75,0,7);x.stroke();
  x.beginPath();x.moveTo(850,260);x.lineTo(850,560);x.lineTo(910,560);x.lineTo(910,260);x.stroke();x.fillRect(856,420,48,134);
  T.forEach(([t,X])=>para(x,t,X,660,230,40,'#13232B'));para(x,'اختر الأداة المناسبة لكل قياس',w/2,820,w-120,44,'#5B6E77')},1024,920,1.3,1.17,new THREE.Vector3(W-.01,1.8,-.4),-P/2);

  NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const hum=AC.createOscillator(),hg=AC.createGain();hum.frequency.value=110;hg.gain.value=.012;hum.connect(hg).connect(MG);hum.start()}catch(e){AC=null}}
function tone(f,d,type='sine',v=.14,w=0,f2){if(!AC)return;const t=AC.currentTime+w,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(MG);o.start(t);o.stop(t+d+.02)}

  g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(v,t+d*.2);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(g).connect(MG);s.start(t);s.stop(t+d+.05)}

const anims=[];
function tw3(o,{pos,rot,dur=.8,done,upd}){anims.push({o,p0:o?o.position.clone():null,p1:pos?pos.clone():null,r0:o?o.rotation.clone():null,r1:rot||null,t:0,d:dur,done,upd})}
function wait(d,done,upd){anims.push({o:null,t:0,d,done,upd})}
function stepAnims(dt){for(let i=anims.length-1;i>=0;i--){const a=anims[i];a.t+=dt;const p=Math.min(1,a.t/a.d),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  if(a.o&&a.p1)a.o.position.lerpVectors(a.p0,a.p1,e);
  if(a.o&&a.r1){a.o.rotation.x=a.r0.x+(a.r1[0]-a.r0.x)*e;a.o.rotation.y=a.r0.y+(a.r1[1]-a.r0.y)*e;a.o.rotation.z=a.r0.z+(a.r1[2]-a.r0.z)*e}
  if(a.upd)a.upd(p,e);if(p>=1){anims.splice(i,1);a.done&&a.done()}}}

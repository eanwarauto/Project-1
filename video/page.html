<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Amiri;font-weight:400;src:url(fonts/amiri-arabic-400-normal.woff2)}
@font-face{font-family:Amiri;font-weight:700;src:url(fonts/amiri-arabic-700-normal.woff2)}
@font-face{font-family:"Reem Kufi";font-weight:700;src:url(fonts/reem-kufi-arabic-700-normal.woff2)}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo-arabic-700-normal.woff2)}
@font-face{font-family:"Aref Ruqaa";font-weight:700;src:url(fonts/aref-ruqaa-arabic-700-normal.woff2)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="engine.js"></script>
<script>
const film = new URLSearchParams(location.search).get('film');
const s = document.createElement('script');
s.src = 'films/' + film + '.js';
s.onload = async () => {
  await Promise.all([
    document.fonts.load('700 40px Amiri'), document.fonts.load('400 40px Amiri'),
    document.fonts.load('700 40px "Reem Kufi"'), document.fonts.load('700 40px Cairo'),
    document.fonts.load('700 40px "Aref Ruqaa"'),
  ]);
  const ctx = document.getElementById('c').getContext('2d');
  window.renderFrame = (t) => { ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; ctx.filter = 'none'; FILM.render(ctx, t); };
  window.READY = true;
};
document.body.appendChild(s);
</script></body></html>

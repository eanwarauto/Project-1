<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Reem+Kufi:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
.ic{width:1024px;height:1024px;border-radius:220px;overflow:hidden;position:relative;
 background:radial-gradient(circle at 50% -5%,rgba(255,59,71,.55),transparent 45%),radial-gradient(circle at 50% 70%,rgba(63,224,197,.28),transparent 55%),linear-gradient(#0e1c33,#04070c)}

.hero{position:absolute;left:50%;top:40px;width:760px;transform:translateX(-50%);filter:drop-shadow(0 0 40px rgba(63,224,197,.45))}
.band{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(transparent,#04070c 45%)}
.t{position:absolute;left:0;right:0;bottom:70px;text-align:center;font:900 210px/1 'Share Tech Mono',monospace;color:#fff;letter-spacing:8px;text-shadow:0 0 30px rgba(63,224,197,.8)}
.t b{color:#ff3b47;text-shadow:0 0 30px rgba(255,59,71,.8)}
.ring{position:absolute;inset:14px;border-radius:206px;border:6px solid rgba(63,224,197,.55)}
</style></head><body><div class="ic"><div class="grid"></div><img class="hero" src="hero.png"><div class="band"></div><div class="t">X<b>-</b>21</div><div class="ring"></div></div></body></html>

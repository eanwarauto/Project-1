<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Poppins:wght@600;700&display=swap">
<style id="page-style">
/* Layout: wavy header band like the lesson decks, then one card per lesson with big tap targets, QR panel at the end */
:root{
  --bg:#f2f8fd; --surface:#ffffff; --ink:#15305a; --muted:#5b7393; --line:#cfe0f0;
  --wave1:#1f6fb2; --wave2:#3fa7d6; --wave3:#2bb3a3; --soft:#e4f1fb;
  --slides:#e8335f; --video:#1f6fb2; --game:#0f9d8e; --link:#6c4fe0; --off:#a9b8ca;
  --display:"Cairo",Tahoma,Arial,sans-serif; --latin:"Poppins","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1c2e; --surface:#16283f; --ink:#e7f0fb; --muted:#9db3cd; --line:#2a4262;
  --wave1:#1a5c96; --wave2:#2b86b3; --wave3:#1f8f83; --soft:#1b3250;
  --slides:#ff6b8a; --video:#5aa7ef; --game:#3ccbb9; --link:#a18cff; --off:#4b6282; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1c2e; --surface:#16283f; --ink:#e7f0fb; --muted:#9db3cd; --line:#2a4262;
  --wave1:#1a5c96; --wave2:#2b86b3; --wave3:#1f8f83; --soft:#1b3250;
  --slides:#ff6b8a; --video:#5aa7ef; --game:#3ccbb9; --link:#a18cff; --off:#4b6282; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-weight:700;direction:rtl;margin:0}
.band{background:linear-gradient(120deg,var(--wave1),var(--wave2) 55%,var(--wave3));color:#fff;position:relative;overflow:hidden}
.band .in{max-width:1080px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.band svg.w{position:absolute;bottom:-1px;left:0;width:100%;height:56px}
.band .w path{fill:var(--bg)}
.tag{display:inline-block;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 16px;font-size:15px}
h1{font-size:clamp(30px,6vw,52px);font-weight:900;margin:10px 0 4px;line-height:1.15;text-wrap:balance}
.sub{font-size:clamp(16px,2.6vw,20px);opacity:.92;margin:0}
.hero{width:clamp(110px,22vw,210px);filter:drop-shadow(0 14px 24px rgba(0,0,0,.25))}
main{max-width:1080px;margin:0 auto;padding-block:8px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.lesson{background:var(--surface);border:1.5px solid var(--line);border-radius:26px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;box-shadow:0 10px 28px rgba(31,80,140,.10)}
.lesson img.pic{width:110px;height:110px;object-fit:contain}
.lesson .body{min-width:0;display:grid;gap:12px}
.lesson .code{font-family:var(--latin);font-size:14px;color:var(--muted)}
.lesson h2{margin:0;font-size:clamp(22px,4vw,30px);font-weight:900;text-wrap:balance}
.res{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:8px 18px 8px 22px;border-radius:999px;text-decoration:none;color:#fff;font-size:18px;font-weight:800;background:var(--c);box-shadow:0 6px 0 rgba(0,0,0,.14);transition:transform .15s}
.btn img{width:34px;height:34px}
.btn:hover{transform:translateY(-2px)} .btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn.off{background:var(--off);box-shadow:none;cursor:default}
.btn.off small{font-size:13px;opacity:.9}
.qr{background:var(--surface);border:1.5px solid var(--line);border-radius:26px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
#qrbox{background:#fff;padding:12px;border-radius:16px;width:224px;height:224px;display:grid;place-items:center}
#qrbox img,#qrbox canvas{max-width:100%}
.qr p{margin:6px 0;color:var(--muted);font-size:16px}
.qr h3{margin:0;font-size:24px}
.sig{font-family:var(--latin);font-weight:700;font-size:14px;color:var(--ink);text-align:left;direction:ltr;padding:0 0 8px}
.ownerbar{display:flex;justify-content:flex-start;gap:10px;flex-wrap:wrap}
.tool{font:inherit;font-size:16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 20px;cursor:pointer}
.tool.primary{background:var(--game);border-color:var(--game);color:#fff}
.tool:focus-visible{outline:3px solid var(--video);outline-offset:2px}
.status{font-size:15px;color:var(--muted);align-self:center}
.ed{display:grid;gap:10px}
.ed input,.ed select{font:inherit;font-size:16px;font-weight:600;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:100%}
.ed .row{display:grid;grid-template-columns:150px 1fr 2fr auto;gap:8px;align-items:center}
.ed .url{direction:ltr;font-family:var(--latin);font-size:14px}
.ed label{font-size:14px;color:var(--muted)}
.x{font:inherit;border:0;background:var(--soft);color:var(--slides);border-radius:10px;padding:8px 12px;cursor:pointer}
@media (max-width:640px){
  .band .in{grid-template-columns:1fr}.hero{display:none}
  .lesson,.qr{grid-template-columns:1fr}.lesson img.pic{width:84px;height:84px}
  .btn{width:100%;justify-content:flex-start}
  .ed .row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

const TYPES = { slides: ['عرض تقديمي', 'sp_coral', '--slides'], video: ['فيديو', 'sp_blue', '--video'], game: ['لعبة / نشاط', 'sp_teal', '--game'], link: ['رابط', 'sp_purple', '--link'] };
const PICS = ['octet', 'ion_pair', 'lattice_big', 'nacl_lattice', 'hero_atom'];
let state = JSON.parse(document.getElementById('state').textContent);
let editing = false, draft = null, canEdit = false, art = null;
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const okUrl = u => /^https?:\/\//i.test(u || '');

function view(s) {
  const lessons = s.lessons.map((l, i) => `
    <section class="lesson">
      <img class="pic" alt="" src="${IMG[l.pic] || IMG[PICS[i % PICS.length]]}">
      <div class="body">
        <div class="code">${esc(l.code)}</div>
        <h2>${esc(l.title)}</h2>
        <div class="res">${l.items.map(it => {
          const [lab, ic, col] = TYPES[it.type] || TYPES.link;
          return okUrl(it.url)
            ? `<a class="btn" style="--c:var(${col})" href="${esc(it.url)}" target="_blank" rel="noopener"><img alt="" src="${IMG[ic]}">${esc(it.label || lab)}</a>`
            : `<span class="btn off" aria-disabled="true"><img alt="" src="${IMG[ic]}">${esc(it.label || lab)} <small>(قريبًا)</small></span>`;
        }).join('')}</div>
      </div>
    </section>`).join('');
  return `
  <header class="band"><div class="in">
    <div><span class="tag">${esc(s.tag)}</span><h1>${esc(s.heading)}</h1><p class="sub">${esc(s.sub)}</p></div>
    <img class="hero" alt="" src="${IMG.hero_atom}">
  </div><svg class="w" viewBox="0 0 1200 56" preserveAspectRatio="none"><path d="M0 40 C200 10 400 60 600 34 S1000 4 1200 30 V56 H0Z"/></svg></header>
  <main>
    ${canEdit ? `<div class="ownerbar"><button class="tool primary" id="edit">تعديل الروابط</button><span class="status">هذا الزر يظهر لك وحدك، الطلاب يشوفون الصفحة بدونه.</span></div>` : ''}
    ${lessons}
    <section class="qr"><div id="qrbox" aria-label="باركود الصفحة"></div>
      <div><h3>امسح الباركود</h3><p>صوّر الباركود بكاميرا الجوال وتنفتح لك هذه الصفحة بكل الدروس.</p>
      ${!okUrl(s.pageUrl) && canEdit ? '<p>أضف رابط الصفحة من «تعديل الروابط» ليظهر الباركود.</p>' : ''}</div></section>
    <div class="sig">Eng.7IKAYA</div>
  </main>`;
}

function editor(d) {
  const sel = t => Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${k === t ? 'selected' : ''}>${v[0]}</option>`).join('');
  return `
  <header class="band"><div class="in"><div><span class="tag">وضع التعديل</span><h1>تعديل الصفحة</h1><p class="sub">الصق الروابط ثم اضغط «حفظ». الزر يكون رمادي (قريبًا) إذا الرابط فاضي.</p></div></div>
  <svg class="w" viewBox="0 0 1200 56" preserveAspectRatio="none"><path d="M0 40 C200 10 400 60 600 34 S1000 4 1200 30 V56 H0Z"/></svg></header>
  <main>
    <div class="ownerbar"><button class="tool primary" id="save">حفظ</button><button class="tool" id="cancel">إلغاء</button><span class="status" id="st"></span></div>
    <section class="lesson ed" style="grid-template-columns:1fr">
      <label for="f-heading">عنوان الصفحة</label><input id="f-heading" data-k="heading" value="${esc(d.heading)}">
      <label for="f-sub">السطر تحت العنوان</label><input id="f-sub" data-k="sub" value="${esc(d.sub)}">
      <label for="f-tag">الشارة</label><input id="f-tag" data-k="tag" value="${esc(d.tag)}">
      <label for="f-url">رابط هذه الصفحة (للباركود)</label><input id="f-url" class="url" data-k="pageUrl" value="${esc(d.pageUrl)}" placeholder="https://claude.ai/...">
    </section>
    ${d.lessons.map((l, i) => `
    <section class="lesson ed" style="grid-template-columns:1fr">
      <div class="row" style="grid-template-columns:150px 1fr auto">
        <input id="l${i}-code" data-l="${i}" data-f="code" value="${esc(l.code)}" aria-label="رقم الدرس">
        <input id="l${i}-title" data-l="${i}" data-f="title" value="${esc(l.title)}" aria-label="عنوان الدرس">
        <button class="x" data-del-lesson="${i}">حذف الدرس</button>
      </div>
      ${l.items.map((it, j) => `
      <div class="row">
        <select id="i${i}-${j}-type" data-l="${i}" data-i="${j}" data-f="type" aria-label="النوع">${sel(it.type)}</select>
        <input id="i${i}-${j}-label" data-l="${i}" data-i="${j}" data-f="label" value="${esc(it.label)}" placeholder="اسم الزر" aria-label="اسم الزر">
        <input id="i${i}-${j}-url" class="url" data-l="${i}" data-i="${j}" data-f="url" value="${esc(it.url)}" placeholder="https://" aria-label="الرابط">
        <button class="x" data-del-item="${i}-${j}">حذف</button>
      </div>`).join('')}
      <div><button class="tool" data-add-item="${i}">+ إضافة زر</button></div>
    </section>`).join('')}
    <div><button class="tool" id="addl">+ إضافة درس</button></div>
    <div class="sig">Eng.7IKAYA</div>
  </main>`;
}

function drawQR() {
  const box = document.getElementById('qrbox'); if (!box) return;
  box.innerHTML = '';
  if (!okUrl(state.pageUrl) || typeof QRCode === 'undefined') { box.textContent = 'الباركود يظهر هنا'; box.style.color = '#5b7393'; return; }
  new QRCode(box, { text: state.pageUrl, width: 200, height: 200, colorDark: '#15305a', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
}

function render() {
  app.innerHTML = editing ? editor(draft) : view(state);
  if (!editing) { drawQR(); const e = document.getElementById('edit'); if (e) e.onclick = () => { draft = JSON.parse(JSON.stringify(state)); editing = true; render(); }; return; }
  app.querySelectorAll('input,select').forEach(el => el.addEventListener('input', () => {
    const v = el.value;
    if (el.dataset.k) draft[el.dataset.k] = v;
    else if (el.dataset.i !== undefined) draft.lessons[+el.dataset.l].items[+el.dataset.i][el.dataset.f] = v;
    else draft.lessons[+el.dataset.l][el.dataset.f] = v;
  }));
  app.querySelectorAll('[data-del-item]').forEach(b => b.onclick = () => { const [i, j] = b.dataset.delItem.split('-').map(Number); draft.lessons[i].items.splice(j, 1); render(); });
  app.querySelectorAll('[data-add-item]').forEach(b => b.onclick = () => { draft.lessons[+b.dataset.addItem].items.push({ type: 'link', label: '', url: '' }); render(); });
  app.querySelectorAll('[data-del-lesson]').forEach(b => b.onclick = () => { draft.lessons.splice(+b.dataset.delLesson, 1); render(); });
  document.getElementById('addl').onclick = () => { draft.lessons.push({ code: 'الدرس', title: 'درس جديد', pic: PICS[draft.lessons.length % PICS.length], items: [{ type: 'slides', label: 'العرض التقديمي', url: '' }] }); render(); };
  document.getElementById('cancel').onclick = () => { editing = false; render(); };
  document.getElementById('save').onclick = save;
}

function documentFor(s) {
  const reset = document.head.querySelector('style')?.textContent || '';
  const json = JSON.stringify(s, null, 1).replace(/</g, '\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>'
    + '<title>' + esc(document.title) + '</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
    + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Poppins:wght@600;700&display=swap">\n'
    + '<style id="page-style">' + document.getElementById('page-style').textContent + '</style>\n<div id="app"></div>\n'
    + '<script type="application/json" id="state">' + json + '<\/script>\n'
    + '<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>\n'
    + '<script id="main">' + document.getElementById('main').textContent + '<\/script></body></html>';
}

async function save() {
  const st = document.getElementById('st');
  if (!art) { st.textContent = 'الحفظ غير متاح في هذا العرض. افتح الصفحة من حسابك في Claude.'; return; }
  st.textContent = 'جاري الحفظ…';
  try { await art.publish(documentFor(draft)); state = draft; editing = false; render(); }
  catch (e) { st.textContent = e && e.code === 'conflict' ? 'تم تحديث الصفحة من مكان آخر، أعد التعديل.' : 'ما انحفظ التعديل، حاول مرة ثانية.'; }
}

render();
(async () => {
  if (!window.claude?.use) return;
  const [user, a] = await Promise.all([claude.use('user'), claude.use('artifact')]);
  art = a;
  try { canEdit = !!(user && (await user.canEdit())) && !!a; } catch { canEdit = false; }
  if (canEdit && !editing) render();
})();
</script>

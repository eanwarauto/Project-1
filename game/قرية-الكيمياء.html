<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قرية الكيمياء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Lalezar&display=swap">
</head><body>
<style>
/* Layout: full-screen village map on canvas; resource HUD floats at the top; panels open as centred sheets.
   Single daytime look (a deliberate one-world game), so colours are set explicitly for both host themes. */
:root{
  --ink:#1c2a4a; --ink-soft:#52607e; --panel:#ffffff; --panel-2:#eef3fa; --line:#d3dcea;
  --gold:#e3a72f; --gold-deep:#b9811a; --leaf:#3f8f3a; --ok:#2f8a4a; --ok-bg:#e2f4e7; --bad:#c8443b; --bad-bg:#fbe8e6;
  --navy:#22355f; --ground:#2f5b31; --veil:rgba(14,24,44,.5);
  --f-display:'Lalezar','Cairo',system-ui,sans-serif;
  --f-body:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;
  color-scheme: light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* HUD */
.hud{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;justify-content:space-between;align-items:flex-start;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.hud>*{pointer-events:auto}
.res,.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools{flex-wrap:nowrap}
.chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.95);border:0;border-radius:999px;padding-block:4px;padding-inline:8px 12px;
  font-weight:800;font-size:15px;line-height:1.4;box-shadow:0 2px 0 rgba(0,0,0,.18);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:22px;height:22px;flex:none}
.chip .lbl{font-weight:600;font-size:13px;color:var(--ink-soft)}
.chip.pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.18)}}
button.chip{cursor:pointer}
.stage{background:var(--navy);color:#fff}
.stage .lbl{color:#c9d6f2}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.95);box-shadow:0 2px 0 rgba(0,0,0,.18);
  display:grid;place-items:center;cursor:pointer;font-weight:800;font-size:19px;color:var(--navy)}
.iconbtn svg{width:22px;height:22px}
@media (max-width:560px){.chip .lbl{display:none}.chip{font-size:14px;padding-inline:6px 10px}.chip svg{width:20px;height:20px}}

/* toast */
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:8px 18px;border-radius:999px;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center;
  transition:opacity .25s, transform .25s;pointer-events:none}
#toast.hide{opacity:0;transform:translate(-50%,10px)}

/* sheets */
#ov{position:absolute;inset:0;background:var(--veil);display:grid;place-items:center;grid-template-columns:minmax(0,1fr);
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-user-select:text;user-select:text}
.sheet{background:var(--panel);border-radius:20px;width:100%;min-width:0;box-sizing:border-box;max-width:600px;max-height:100%;overflow:auto;padding:20px 22px 22px;
  box-shadow:0 18px 50px rgba(0,0,0,.35);animation:rise .22s ease}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.25;margin:0 0 4px;color:var(--navy);text-wrap:balance}
.sheet h3{font-size:16px;margin:18px 0 8px;color:var(--navy)}
.sheet p{margin:6px 0;line-height:1.75;font-size:16px}
.sub{color:var(--ink-soft)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.primary,.ghost,.danger{border:0;border-radius:12px;padding:10px 20px;font-size:16px;font-weight:800;cursor:pointer}
.primary{background:var(--gold);color:#2b1d00;box-shadow:0 3px 0 var(--gold-deep)}
.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-deep)}
.primary:disabled{background:#d9dee7;color:#7d879a;box-shadow:none;cursor:not-allowed}
.ghost{background:var(--panel-2);color:var(--navy)}
.danger{background:var(--bad);color:#fff}

/* question */
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.act{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border-radius:999px;padding:4px 12px 4px 10px;font-weight:800;color:var(--navy)}
.act svg{width:22px;height:22px}
.tag{font-size:13px;font-weight:700;color:var(--ink-soft);display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.diff{font-size:12px;font-weight:800;border-radius:999px;padding:0 10px}
.diff.d1{background:var(--ok-bg);color:var(--ok)}.diff.d2{background:#fff3d6;color:var(--gold-deep)}
.qtext{font-size:20px!important;font-weight:800;line-height:1.7!important;margin:4px 0 14px!important;text-wrap:pretty}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;text-align:start;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px;
  font-size:17px;font-weight:700;line-height:1.6;cursor:pointer;min-width:0}
.opt:hover:not(:disabled){background:var(--panel-2);border-color:#aebbd3}
.opt:disabled{cursor:default}
.opt .key{flex:none;width:28px;height:28px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--navy)}
.opt .otext{min-width:0}
.opt.correct{background:var(--ok-bg);border-color:var(--ok)}
.opt.correct .key{background:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:14px;border-top:2px dashed var(--line);padding-top:12px}
.fbh{font-family:var(--f-display);font-size:24px}
.fbh.ok{color:var(--ok)}.fbh.bad{color:var(--bad)}
.exp{color:var(--ink-soft)}
.reward{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:#fff6df;border:1px solid #f0d58f;border-radius:10px;padding:4px 12px;font-weight:800}
.reward svg{width:22px;height:22px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
sup,sub{font-size:.68em;line-height:0}
.orb{display:inline-flex;direction:ltr;gap:0;vertical-align:middle}
.orb>span{display:flex;flex-direction:column;align-items:center}
.orb b{width:38px;height:30px;border:2px solid var(--ink);margin-left:-2px;display:grid;place-items:center;font-size:17px;letter-spacing:-2px;background:#fff}
.orb i{font-style:normal;font-size:12px;color:var(--ink-soft)}

/* build */
.build{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:8px}
.build canvas{width:240px;height:210px;max-width:100%;background:linear-gradient(#cfe8ff,#e9f6ff 55%,#9fd27c 55%);border-radius:14px;flex:none}
.cost{list-style:none;margin:0;padding:0;display:grid;gap:8px;flex:1;min-width:180px}
.cost li{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;background:var(--panel-2);border-radius:10px;padding:6px 10px}
.cost li svg{width:24px;height:24px}
.cost .num{margin-inline-start:auto;font-variant-numeric:tabular-nums}
.cost .have{color:var(--ok)}
.goods li{flex-wrap:wrap}
.price{display:block;font-size:12px;font-weight:600;color:var(--ink-soft)}
.mini{padding:4px 12px;font-size:14px;border-radius:10px}
.mini:disabled{opacity:.5;cursor:not-allowed}.cost .need{color:var(--bad)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.steps span{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--panel-2);color:var(--ink-soft)}
.steps span.done{background:var(--ok-bg);color:var(--ok)}
.steps span.next{background:#fff3d6;color:var(--gold-deep)}

/* lists */
.help{margin:8px 0 0;padding-inline-start:22px;line-height:1.85;font-size:16px}
.help li{margin-bottom:4px}
.lessons{display:grid;gap:8px}
.lessons label{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.lessons input{width:20px;height:20px;accent-color:var(--navy);flex:none}
.lessons .st{margin-inline-start:auto;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.warn{color:var(--bad);font-weight:700}
.stat-big{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.stat-big div{flex:1;min-width:120px;background:var(--panel-2);border-radius:14px;padding:10px 14px}
.stat-big b{display:block;font-family:var(--f-display);font-size:30px;font-weight:400;color:var(--navy);font-variant-numeric:tabular-nums}
.stat-big span{font-size:13px;color:var(--ink-soft);font-weight:700}
/* credit */
.credit-tag{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  background:rgba(255,255,255,.85);color:var(--navy);border-radius:999px;padding:2px 12px;font-size:12px;font-weight:700;pointer-events:none}
.credit{margin-top:14px!important;font-size:14px!important;color:var(--ink-soft);font-weight:700}
#app.reel .credit,#app.reel .credit-tag{display:none}
@media (prefers-reduced-motion: reduce){.sheet,.chip.pop{animation:none}}
</style>

<div id="app" dir="rtl" lang="ar">
  <canvas id="cv" aria-label="خريطة القرية"></canvas>
  <div class="hud">
    <div class="res">
      <div class="chip" id="c-wood"><span data-i="wood"></span><b id="n-wood">0</b><span class="lbl">حطب</span></div>
      <div class="chip" id="c-stone"><span data-i="stone"></span><b id="n-stone">0</b><span class="lbl">حجارة</span></div>
      <div class="chip" id="c-fruit"><span data-i="fruit"></span><b id="n-fruit">0</b><span class="lbl">ثمار</span></div>
      <div class="chip" id="c-egg"><span data-i="egg"></span><b id="n-egg">0</b><span class="lbl">بيض</span></div>
      <div class="chip" id="c-milk"><span data-i="milk"></span><b id="n-milk">0</b><span class="lbl">حليب</span></div>
      <div class="chip" id="c-coin"><span data-i="coin"></span><b id="n-coin">0</b><span class="lbl">عملات</span></div>
      <button class="chip stage" id="stageBtn" type="button"><span data-i="house"></span><span id="stageName">أرض البناء</span></button>
    </div>
    <div class="tools">
      <div class="chip" title="الإجابات الصحيحة من مجموع الأسئلة"><span data-i="check"></span><b id="n-score" class="ltr">0 / 0</b></div>
      <button class="iconbtn" id="sndBtn" type="button" aria-label="الصوت"></button>
      <button class="iconbtn" id="helpBtn" type="button" aria-label="طريقة اللعب">؟</button>
      <button class="iconbtn" id="setBtn" type="button" aria-label="الإعدادات"><span data-i="gear"></span></button>
    </div>
  </div>
  <div id="toast" class="hide" role="status" aria-live="polite"></div>
  <div id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
</div>

<script>
(() => {
'use strict';
/* ---------------- icons ---------------- */
const ICON = {
  wood:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="12" width="17" height="6.5" rx="3.2" fill="#9a5f33"/><ellipse cx="19" cy="15.2" rx="2.7" ry="3.2" fill="#ecc28c" stroke="#9a5f33" stroke-width="1.2"/><rect x="4" y="5.5" width="15" height="6.5" rx="3.2" fill="#b4723f"/><ellipse cx="19" cy="8.7" rx="2.7" ry="3.2" fill="#f3cf9c" stroke="#b4723f" stroke-width="1.2"/></svg>',
  stone:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17 6 9.5 12 6 18 8 21 15 17 20H7Z" fill="#9aa1a8" stroke="#69707a" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 10.5 12 8.3 15 9.2" stroke="#dde1e4" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>',
  fruit:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14" r="7.5" fill="#e0473c"/><circle cx="9.4" cy="11.4" r="2" fill="#f68f86"/><path d="M12 7 9.8 4.2M12 7l2.6-2.6M12 7V3.6" stroke="#3f8f3a" stroke-width="2" stroke-linecap="round"/></svg>',
  coin:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#f2b632" stroke="#c78a12" stroke-width="1.5"/><circle cx="12" cy="12" r="5.4" fill="none" stroke="#c78a12" stroke-width="1.3"/></svg>',
  house:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 11.5 12 4l9.5 7.5Z" fill="#e0603f"/><rect x="5.5" y="11" width="13" height="9" fill="#f6e2bd"/><rect x="10.5" y="14" width="3" height="6" fill="#9a5f33"/></svg>',
  check:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#2f8a4a"/><path d="m7 12.5 3.5 3.5L17 9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  gear:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.2" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="3.1 2.55"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>',
  sound:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
  mute:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Z" fill="currentColor"/><path d="m16 9 5 6m0-6-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  egg:'<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="13.5" rx="6.5" ry="8" fill="#fff8ea" stroke="#cdb995" stroke-width="1.3"/><ellipse cx="9.8" cy="10.5" rx="1.5" ry="2.3" fill="#fff"/></svg>',
  milk:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6v2.5l2 3V20a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 20V9.5l2-3Z" fill="#fff" stroke="#9fb4cf" stroke-width="1.3" stroke-linejoin="round"/><rect x="7.7" y="12" width="8.6" height="5" fill="#5f9fe0"/><rect x="8.8" y="2.5" width="6.4" height="2.2" rx=".7" fill="#3d6fd0"/></svg>',
  broom:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 2.5 12 12" stroke="#9a5f33" stroke-width="2.3" stroke-linecap="round"/><path d="M8.5 11.5h7l2.5 9.5H5.5Z" fill="#e6c15a" stroke="#c49b35" stroke-width="1.2" stroke-linejoin="round"/><path d="M9 15l-1 6M12 15v6M15 15l1 6" stroke="#c49b35" stroke-width="1"/></svg>',
  hammer:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="10.5" y="9" width="3" height="13" rx="1.3" fill="#9a5f33"/><rect x="4.5" y="3.5" width="15" height="6.5" rx="1.6" fill="#6e7680"/></svg>',
  seed:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V11" stroke="#3f8f3a" stroke-width="2.4" stroke-linecap="round"/><path d="M12 13C7 13 5 9 5 6c4 0 7 2 7 7Zm0-1c0-4 3-6 7-6 0 3-2 6-7 6Z" fill="#5fb04f"/></svg>',
  market:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h18l-2-5H5Z" fill="#d9534f"/><rect x="4" y="9" width="16" height="11" fill="#c08a52"/><circle cx="9" cy="14" r="2.5" fill="#e0473c"/><circle cx="15" cy="14" r="2.5" fill="#f2b632"/></svg>'
};
document.querySelectorAll('[data-i]').forEach(e => { e.outerHTML = ICON[e.dataset.i]; });

/* ---------------- question bank (book wording, enrichment boxes excluded) ---------------- */
const L = s => `<span class="ltr">${s}</span>`;
const cfg = s => s.replace(/(\d[spdf])(\d+)/g, '$1<sup>$2</sup>');
const el = (z, sym) => L(`<sub>${z}</sub>${sym}`);
const ML = 'm<sub>ℓ</sub>', MS = 'm<sub>s</sub>';
const orb = (...a) => `<span class="orb">${a.map((x, i) => `<span><b>${x || '&nbsp;'}</b><i>p<sub>${'xyz'[i]}</sub></i></span>`).join('')}</span>`;
const BR = ['الكيمياء العضوية', 'الكيمياء غير العضوية', 'الكيمياء الفيزيائية', 'الكيمياء التحليلية', 'الكيمياء الحيوية'];
const br = (c, ...w) => [BR[c], ...w.map(i => BR[i])];

const LESSONS = {
  1: `الدرس ${L('[1-1]')}: علم الكيمياء`,
  2: `الدرس ${L('[2-1]')}: تطوّر النماذج الذرّية`,
  3: `الدرس ${L('[3-1]')}: أعداد الكَمّ`,
  4: `الدرس ${L('[4-1]')}: قواعد الترتيب الإلكتروني في الذرّات`
};
/* first option is always the correct one; options are shuffled on screen */
const QB = [
/* ---- 1-1 ---- */
{l:1,q:'فرع الكيمياء الذي يدرس المواد التي تحتوي غالبًا على روابط بين الكربون والهيدروجين هو:',o:br(0,1,3,4),e:`الكيمياء العضوية ${L('Organic Chemistry')} مجال دراستها المواد التي تحتوي غالبًا على روابط بين الكربون والهيدروجين.`},
{l:1,q:'فرع الكيمياء الذي يدرس الفلزات واللافلزات ومركباتها، والأحماض والقواعد والأملاح والأكاسيد هو:',o:br(1,0,2,4),e:`الكيمياء غير العضوية ${L('Inorganic Chemistry')} مجال دراستها الفلزات واللافلزات ومركباتها، والأحماض والقواعد والأملاح والأكاسيد.`},
{l:1,q:'فرع الكيمياء الذي يدرس سلوك المادة وتغيّراتها والطاقة المصاحبة لها هو:',o:br(2,3,0,1),e:`الكيمياء الفيزيائية ${L('Physical Chemistry')} مجال دراستها سلوك المادة وتغيّراتها والطاقة المصاحبة لها.`},
{l:1,q:'فرع الكيمياء الذي يختص بتحليل مكوّنات المادة وتحديد كمية كل مكوّن هو:',o:br(3,2,4,0),e:`الكيمياء التحليلية ${L('Analytical Chemistry')} مجال دراستها تحليل مكوّنات المادة وتحديد كمية كل مكوّن.`},
{l:1,q:'فرع الكيمياء الذي يدرس المواد والتفاعلات الكيميائية التي تحدث داخل الكائنات الحية هو:',o:br(4,0,3,2),e:`الكيمياء الحيوية ${L('Biochemistry')} مجال دراستها المواد والتفاعلات الكيميائية التي تحدث داخل الكائنات الحية.`},
{l:1,q:'الأدوية والبلاستيكات والوقود والمنظفات من استخدامات:',o:br(0,3,2,1),e:'من استخدامات الكيمياء العضوية: الأدوية، البلاستيكات، الوقود، المنظفات، المبيدات الحشرية، الأصباغ.'},
{l:1,q:'المبيدات الحشرية والأصباغ من استخدامات:',o:br(0,1,3,2),e:'من استخدامات الكيمياء العضوية: الأدوية، البلاستيكات، الوقود، المنظفات، المبيدات الحشرية، الأصباغ.'},
{l:1,q:'مواد البناء والسبائك الإلكترونية من استخدامات:',o:br(1,4,0,3),e:'من استخدامات الكيمياء غير العضوية: مواد البناء والسبائك الإلكترونية.'},
{l:1,q:'تطوير البطاريات وتبريد المحركات من استخدامات:',o:br(2,1,4,3),e:'من استخدامات الكيمياء الفيزيائية: تطوير البطاريات وتبريد المحركات.'},
{l:1,q:'فحص جودة مياه الشرب ومراقبة تلوث الهواء وكشف الغش التجاري من استخدامات:',o:br(3,2,0,4),e:'من استخدامات الكيمياء التحليلية: فحص جودة مياه الشرب، مراقبة تلوث الهواء، كشف الغش التجاري.'},
{l:1,q:'دراسة عملية الهضم وعمل الإنزيمات وتحاليل الدم والسموم من استخدامات:',o:br(4,3,0,2),e:'من استخدامات الكيمياء الحيوية: دراسة عملية الهضم، عمل الإنزيمات، تحاليل الدم والسموم.'},
{l:1,q:'الاسم الإنجليزي لفرع الكيمياء التحليلية هو:',o:['Analytical Chemistry','Physical Chemistry','Inorganic Chemistry','Biochemistry']},
{l:1,q:`${L('Physical Chemistry')} هو الاسم الإنجليزي لفرع:`,o:br(2,4,3,1)},
{l:1,q:'أسهمت فروع الكيمياء في تقدم:',o:['الطب والصناعة والتقنية والبيئة','الطب فقط','الصناعة فقط','البيئة فقط'],e:'لأن علم المادة واسع ومليء بالأسرار، انقسم علم الكيمياء إلى فروع متعددة أسهمت في تقدم الطب والصناعة والتقنية والبيئة.'},

/* ---- 1-2 ---- */
{l:2,q:'تتكون نواة الذرّة من:',o:['بروتونات ونيوترونات','بروتونات وإلكترونات','نيوترونات وإلكترونات','إلكترونات فقط'],e:'تتكون الذرّة من نواة تحتوي على البروتونات (موجبة الشحنة) والنيوترونات (متعادلة الشحنة)، وحول النواة تدور الإلكترونات (سالبة الشحنة).'},
{l:2,q:'شحنة النيوترون:',o:['متعادلة','موجبة','سالبة'],e:'البروتونات موجبة الشحنة، والنيوترونات متعادلة الشحنة، والإلكترونات سالبة الشحنة.'},
{l:2,q:'الجسيمات التي تدور حول النواة هي:',o:['الإلكترونات','البروتونات','النيوترونات'],e:'حول النواة تدور الإلكترونات (سالبة الشحنة).'},
{d:2,l:2,q:'في تجربة رذرفورد سُمح لجسيمات ألفا الموجبة أن تصطدم بلوح معدني مبطّن بطبقة من:',o:['كبريتيد الخارصين','الذهب','النحاس','الحديد'],e:'سُمح لجسيمات ألفا الموجبة (α) أن تصطدم بلوح معدني مبطّن بطبقة من كبريتيد الخارصين، وتم تحديد موضع وعدد جسيمات ألفا بدلالة الومضات التي ظهرت على اللوح.'},
{l:2,q:'الرقاقة التي وُضعت في مسار جسيمات ألفا قبل اصطدامها باللوح المعدني في تجربة رذرفورد هي رقاقة:',o:['الذهب','الفضة','النحاس','الألومنيوم']},
{l:2,q:'نفاذ معظم جسيمات ألفا خلال رقاقة الذهب دون أي انحراف في مسارها يدل على أن:',o:['الذرّة معظمها فراغ','الذرّة تحوي جسيمًا موجب الشحنة','معظم كتلة الذرّة في الإلكترونات','الإلكترونات سالبة الشحنة'],e:'المشاهدة: نفاذ معظم جسيمات ألفا دون انحراف. الاستنتاج: الذرّة معظمها فراغ.'},
{d:2,l:2,q:'انحراف عدد قليل من جسيمات ألفا عن مسارها بعد اصطدامها برقاقة الذهب يدل على أن الذرّة:',o:['تحوي جسيمًا مشحونًا بشحنة موجبة (النواة) مشابهة لشحنة جسيمات ألفا','معظمها فراغ','تحوي جسيمًا سالب الشحنة يجذب جسيمات ألفا','لا تحتوي على نواة'],e:'انحراف عدد قليل من جسيمات ألفا يدل على أن الذرّة تحوي جسيمًا مشحونًا بشحنة موجبة (النواة) مشابهة لشحنة جسيمات ألفا، لذلك تنافرت معها.'},
{d:2,l:2,q:'ارتداد عدد قليل جدًا من جسيمات ألفا في اتجاه مصدرها بعد اصطدامها برقاقة الذهب يدل على أن:',o:['بالذرّة جزءًا يشغل حيزًا صغيرًا جدًا يتركز فيه معظم كتلة الذرّة (النواة)','الذرّة معظمها فراغ','الإلكترونات تتحرك في مسار حلزوني','جسيمات ألفا سالبة الشحنة']},
{d:2,l:2,q:'أجرى العالمان جيجر ومارسدن بحثهما تحت إشراف رذرفورد عام:',o:['1909','1913','1923','1900']},
{d:2,l:2,q:'اعترض العلماء على تشبيه رذرفورد دوران الإلكترونات حول النواة بدوران الكواكب حول الشمس، لأن:',o:['الإلكترونات جسيمات تحمل شحنة كهربائية أما الكواكب فهي متعادلة الشحنة','الكواكب أصغر من الإلكترونات','الإلكترونات لا تتحرك حول النواة','النواة سالبة الشحنة']},
{d:2,l:2,q:'وفق قوانين الفيزياء، عند حركة الإلكترونات حول النواة في مدار دائري تفقد طاقة باستمرار، فتتحرك في:',o:['مسار حلزوني حتى تلتصق بالنواة وتنهار الذرّة','مسار مستقيم مبتعدة عن النواة','المدار نفسه دون تغيّر','مستوى طاقة أعلى'],e:'مع فقدان الطاقة تقل سرعة دوران الإلكترونات تدريجيًا، فتقل قوة الطرد المركزي، وتتغلب قوة جذب النواة، فتتحرك في مسار حلزوني حتى تلتصق بالنواة. وهذا لا يحدث، إذ أن الذرّة في الحقيقة لا تنهار.'},
{l:2,q:'اختار بور في نموذجه عام 1913 ذرّة:',o:['الهيدروجين','الهيليوم','الكربون','الذهب'],e:'اختار بور في نموذجه أبسط الذرّات وهي ذرّة الهيدروجين.'},
{d:2,l:2,q:'استعان بور في وضع نموذجه للذرّة بنتائج أبحاث العلماء عن:',o:['طيف الانبعاث الذري','الكيمياء الحيوية','رقاقة الذهب فقط','كتلة النيوترون']},
{l:2,q:'وفق نموذج بور، المستويات التي تدور فيها الإلكترونات حول النواة دون أن تكتسب أو تفقد طاقة تُسمى:',o:['مستويات الطاقة الرئيسية','الأفلاك الذرّية','السحابة الإلكترونية','تحت مستويات الطاقة']},
{d:2,l:2,q:'وفق نموذج بور، الذرّة متعادلة كهربائيًا لأن:',o:['عدد الإلكترونات يساوي عدد البروتونات','عدد النيوترونات يساوي عدد البروتونات','الإلكترونات متعادلة الشحنة','النواة متعادلة الشحنة'],e:'عدد الشحنات السالبة (الإلكترونات) التي تدور حول النواة يساوي عدد الشحنات الموجبة (البروتونات) داخل النواة.'},
{l:2,q:'وفق نموذج بور، كلما زاد بُعد مستوى الطاقة عن النواة:',o:['زادت طاقته','قلّت طاقته','بقيت طاقته ثابتة'],e:`كل مستوى طاقة رئيسي يعبّر عنه بعدد صحيح ويرمز له بالرمز ${L('n')}، وتزداد طاقة المستوى بزيادة بعده عن النواة.`},
{l:2,q:'عندما يكتسب (يمتص) الإلكترون طاقة معيّنة فإنه:',o:['ينتقل إلى المستوى الأعلى منه في الطاقة (الحالة المثارة)','ينتقل إلى مستوى طاقة أقل','يلتصق بالنواة','يبقى في مستواه دون تغيّر']},
{l:2,q:'عندما يعود الإلكترون من الحالة المثارة غير المستقرة إلى حالته المستقرة فإنه:',o:['يُطلق الطاقة التي اكتسبها','يكتسب طاقة إضافية','لا تتغيّر طاقته']},
{d:2,l:2,q:'الذرّة عندما تكون طاقة إلكتروناتها أقل ما يمكن، بحيث تترتب إلكتروناتها وفق الترتيب الإلكتروني الأكثر استقرارًا، هي:',o:['الذرّة المستقرة','الذرّة المثارة']},
{d:2,l:2,q:'الذرّة التي اكتسبت (امتصت) كمية معيّنة من الطاقة مما أدى إلى انتقال إلكترون أو أكثر من مستوى طاقة أقل إلى مستوى طاقة أعلى، هي:',o:['الذرّة المثارة','الذرّة المستقرة']},
{d:2,l:2,q:'من الاعتراضات التي واجهت نموذج بور أنه:',o:['فشل في تفسير طيف الانبعاث الذري للذرّات التي تحتوي على عدد أكبر من الإلكترونات','لم يُطبَّق على ذرّة الهيدروجين','افترض أن النواة سالبة الشحنة','افترض أن الذرّة معظمها فراغ']},
{l:2,q:'العالِم الذي أسهم في تأسيس النظرية الميكانيكية للذرّة ووضع المعادلة الموجية هو:',o:['شرودنغر','رذرفورد','بور','دالتون']},
{d:2,l:2,q:'دفعت أوجه القصور في نموذج بور العلماء إلى إجراء تعديلات عليه عام:',o:['1923','1909','1913']},
{d:2,l:2,q:'المعادلة الموجية التي تطبّق على حركة الإلكترون في الذرّة يمكن عن طريقها تحديد:',o:['السعة القصوى للإلكترونات في كل مستوى طاقة رئيسي','عدد النيوترونات في النواة','كتلة جسيمات ألفا','عدد البروتونات في النواة']},
{l:2,q:'مناطق الفراغ المحيط بالنواة، والتي يحتمل وجود الإلكترون فيها في كل الاتجاهات، هي:',o:['السحابة الإلكترونية','الأفلاك الذرّية','مستويات الطاقة الرئيسية','النواة']},
{l:2,q:'مناطق داخل السحابة الإلكترونية يزداد احتمال وجود الإلكترون فيها، هي:',o:['الأفلاك الذرّية','السحابة الإلكترونية','مستويات الطاقة الرئيسية','النواة']},

/* ---- 1-3 ---- */
{l:3,q:'الوصف الكامل لوضع الإلكترون داخل الذرّة من حيث الطاقة والموقع والاتجاه هو:',o:['حالة الإلكترون','السحابة الإلكترونية','الفلك الذرّي','مستوى الطاقة الرئيسي'],e:'حالة الإلكترون هي الوصف الكامل لوضع الإلكترون داخل الذرّة من حيث الطاقة والموقع والاتجاه، ويتم تحديدها باستخدام أعداد الكَمّ.'},
{l:3,q:'تُحدَّد حالة الإلكترون في أي ذرّة باستخدام:',o:['أعداد الكَمّ','العدد الذري فقط','عدد النيوترونات','مستويات الطاقة الرئيسية فقط']},
{l:3,q:'عدد أعداد الكَمّ التي تصف حالة الإلكترون:',o:['4','3','2','7'],e:'أعداد الكَمّ أربعة: الرئيسي، والزاوي، والمغناطيسي، والمغزلي.'},
{l:3,q:'«عدد يصف طاقة المستوى الرئيسي ويحدد بُعده عن النواة» هو:',o:[`عدد الكَمّ الرئيسي ${L('(n)')}`,`عدد الكَمّ الزاوي ${L('(ℓ)')}`,`عدد الكَمّ المغناطيسي ${L(`(${ML})`)}`,`عدد الكَمّ المغزلي ${L(`(${MS})`)}`]},
{l:3,q:`رمز مستوى الطاقة الرئيسي الذي قيمة عدد الكَمّ الرئيسي له ${L('n = 3')} هو:`,o:['M','L','K','N'],e:`${L('K = 1 , L = 2 , M = 3 , N = 4 , O = 5 , P = 6 , Q = 7')}`},
{l:3,q:'قيمة عدد الكَمّ الرئيسي لمستوى الطاقة L:',o:['2','1','3','4'],e:`${L('K = 1 , L = 2 , M = 3 , N = 4')}`},
{l:3,q:'عدد مستويات الطاقة الرئيسية المشغولة بالإلكترونات والمعروفة حتى الآن:',o:['7','4','5','8'],e:`هي سبعة مستويات رموزها ${L('K , L , M , N , O , P , Q')}.`},
{d:2,l:3,q:`بالمقارنة بين مستويي الطاقة ${L('n = 1')} و ${L('n = 7')}، فإن المستوى ${L('n = 1')}:`,o:['أقل طاقة وأصغر حجمًا','أعلى طاقة وأكبر حجمًا','أقل طاقة وأكبر حجمًا','أعلى طاقة وأصغر حجمًا'],e:`كلما ازدادت قيمة ${L('n')} زاد حجم المستوى وزادت طاقة الإلكترون فيه.`},
{l:3,q:'«عدد يحدد تحت مستوى الطاقة داخل مستوى الطاقة الرئيسي، كما يحدد شكل الفلك الذرّي الذي يشغله الإلكترون» هو:',o:[`عدد الكَمّ الزاوي ${L('(ℓ)')}`,`عدد الكَمّ الرئيسي ${L('(n)')}`,`عدد الكَمّ المغناطيسي ${L(`(${ML})`)}`,`عدد الكَمّ المغزلي ${L(`(${MS})`)}`]},
{d:2,l:3,q:`يأخذ عدد الكَمّ الزاوي ${L('(ℓ)')} قيمًا صحيحة تتراوح:`,o:[`من الصفر إلى القيمة ${L('(n − 1)')}`,`من 1 إلى ${L('n')}`,`من ${L('(−ℓ)')} إلى ${L('(+ℓ)')}`,`بين ${L('+½')} و ${L('−½')}`]},
{l:3,q:`تحت مستوى الطاقة الذي قيمة عدد الكَمّ الزاوي له ${L('ℓ = 2')} هو:`,o:['d','p','s','f'],e:`${L('s = 0 , p = 1 , d = 2 , f = 3')}`},
{l:3,q:'قيمة عدد الكَمّ الزاوي لتحت مستوى الطاقة p:',o:['1','0','2','3'],e:`${L('s = 0 , p = 1 , d = 2 , f = 3')}`},
{d:2,l:3,q:`إذا كانت ${L('n = 2')} و ${L('ℓ = 0')}، فإن تحت مستوى الطاقة هو:`,o:['2s','2p','1s','2d']},
{d:2,l:3,q:`في تحت مستوى الطاقة ${L('3p')} تكون قيمة ${L('ℓ')}:`,o:['1','3','0','2']},
{d:2,l:3,q:'قيم عدد الكَمّ الزاوي المحتملة في مستوى الطاقة الرئيسي M:',o:['0 , 1 , 2','0 , 1','1 , 2 , 3','0 , 1 , 2 , 3'],e:`في المستوى M تكون ${L('n = 3')}، فتتراوح ${L('ℓ')} من الصفر إلى ${L('n − 1 = 2')}.`},
{d:2,l:3,q:'عدد تحت مستويات الطاقة في مستوى الطاقة الرئيسي N:',o:['4','3','2','16'],e:`كل مستوى طاقة رئيسي يحتوي على عدد من تحت المستويات يساوي رقمه: المستوى N يحتوي على ${L('4s , 4p , 4d , 4f')}.`},
{l:3,q:'«عدد يحدد اتجاه الفلك الذرّي في الفراغ داخل تحت مستوى الطاقة» هو:',o:[`عدد الكَمّ المغناطيسي ${L(`(${ML})`)}`,`عدد الكَمّ الزاوي ${L('(ℓ)')}`,`عدد الكَمّ الرئيسي ${L('(n)')}`,`عدد الكَمّ المغزلي ${L(`(${MS})`)}`]},
{d:2,l:3,q:`قيم عدد الكَمّ المغناطيسي ${L(`(${ML})`)} لتحت مستوى الطاقة p:`,o:['−1 , 0 , +1','0','−2 , −1 , 0 , +1 , +2','+½ , −½'],e:`يأخذ ${L(ML)} قيمًا صحيحة تتراوح من ${L('(−ℓ)')} إلى ${L('(+ℓ)')} مرورًا بالصفر، وفي p تكون ${L('ℓ = 1')}.`},
{d:2,l:3,q:'عدد الأفلاك في تحت مستوى الطاقة d:',o:['5','3','7','10'],e:`قيم ${L(ML)} في d هي ${L('−2 , −1 , 0 , +1 , +2')}، أي خمسة أفلاك.`},
{d:2,l:3,q:'عدد الأفلاك في تحت مستوى الطاقة f:',o:['7','5','3','14']},
{d:2,l:3,q:'أقصى عدد من الإلكترونات في تحت مستوى الطاقة p:',o:['6','2','3','10'],e:'تحت المستوى p فيه ثلاثة أفلاك، وكل فلك يمتلئ بإلكترونين كحد أقصى.'},
{l:3,q:'كل فلك يمتلئ بـ:',o:['إلكترونين كحد أقصى','إلكترون واحد فقط','ستة إلكترونات كحد أقصى','ثمانية إلكترونات كحد أقصى']},
{l:3,q:'شكل فلك تحت مستوى الطاقة (s):',o:['كروي','فصّان متقابلان عند الرأس','حلزوني','مستطيل'],e:'فلك s فلك واحد، كروي الشكل، وتمثل سحابته الإلكترونية احتمال وجود الإلكترون حول النواة بشكل متساوٍ في جميع الاتجاهات.'},

/* ---------------- movement ---------------- */
const SPEED = 5.5;
let held = null, saveTimer = 0;
function update(dt){
  if (player.path.length){
    const [tx,ty] = player.path[0], dx = tx - player.x, dy = ty - player.y, d = Math.hypot(dx,dy), st = SPEED*dt;
    if (Math.abs(dx) > .01) player.face = dx > 0 ? 1 : -1;
    player.moving = true;
    if (d <= st){
      player.x = tx; player.y = ty; player.path.shift();
      if (!player.path.length && player.pending){ const o = player.pending; player.pending = null; player.moving = false; interact(o); }
    } else { player.x += dx/d*st; player.y += dy/d*st; }
  } else {
    player.moving = false;
    if (held && ov.hidden){
      const nx = player.x + held[0], ny = player.y + held[1];
      if (held[0]) player.face = held[0];
      if (!blocked(nx,ny)) player.path.push([nx,ny]);
    }
  }
  saveTimer += dt; if (saveTimer > 4){ saveTimer = 0; save(); }
}
function findPath(sx, sy, goal){
  const prev = new Int32Array(MW*MH).fill(-2), q = [sy*MW + sx]; prev[q[0]] = -1;
  for (let h = 0; h < q.length; h++){
    const k = q[h], x = k % MW, y = (k / MW) | 0;
    if (goal(x,y)){ const p = []; let c = k; while (prev[c] !== -1){ p.push([c % MW, (c / MW) | 0]); c = prev[c]; } return p.reverse(); }
    for (const [dx,dy] of DIRS){

      const nk = ny*MW + nx; if (prev[nk] !== -2 || blocked(nx,ny)) continue;
      prev[nk] = k; q.push(nk);
    }
  }

}
function adjGoal(o){

}
function walkTo(goal, pending){
  const mid = player.path.length ? player.path[0] : null;
  const sx = mid ? mid[0] : Math.round(player.x), sy = mid ? mid[1] : Math.round(player.y);
  const p = findPath(sx, sy, goal);
  if (!p){ toast('لا يمكن الوصول إلى هذا الموضع'); return; }

}
function onTap(clientX, clientY){
  if (!ov.hidden) return;
  const r = cv.getBoundingClientRect();
  const wx = (clientX - r.left + Math.round(cam.x)) / TS, wy = (clientY - r.top + Math.round(cam.y)) / TS;
  const tx = Math.floor(wx), ty = Math.floor(wy);
  let best = null, bd = .75;
  for (const a of ANIMALS){ const d = Math.hypot(wx - (a.x + .5), wy - (a.y + (a.k === 'cow' ? .45 : .6))); if (d < bd){ bd = d; best = a; } }
  if (best){ const o = {k:best.k, i:best.i}; marker = null; walkTo((x,y) => Math.hypot(x - best.x, y - best.y) <= 1.25, o); return; }
  if (DECOR.has(tx+','+ty) || DECOR.has(tx+','+(ty+1)) && DECOR.get(tx+','+(ty+1)) === 'windmill') return;
  let o = objAt(tx,ty);
  if (!o){ const b = objAt(tx, ty+1); if (b && (b.k === 'tree' || b.k === 'house' || b.k === 'market' || b.k === 'barn' || b.k === 'cow')) o = b; }
  if (!o){ const b = objAt(tx, ty+2); if (b && b.k === 'house' && state.level >= 3) o = b; }
  if (o){ marker = null; walkTo(adjGoal(o), o); }

}

const KEYS = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0]};

    ${any ? '' : '<p class="sub">لا توجد منتجات في المخزن. الثمار من الحقول، والبيض من الدجاج، والحليب من الأبقار.</p>'}
    <div class="row">
      <button class="primary" type="button" id="putAll" ${any ? '' : 'disabled'}>عرض كل المنتجات في البسطة</button>
      <button class="ghost" type="button" data-close>إغلاق</button>
    </div>`);
  const put = kinds => {
    let moved = 0;
    kinds.forEach(k => { moved += state.res[k]; state.stall[k] += state.res[k]; state.res[k] = 0; });
    if (!moved) return;
    updateHUD(); SFX.harvest(); save(); openMarket();
  };
  sheet.querySelectorAll('[data-put]').forEach(b => b.onclick = () => put([b.dataset.put]));
  $('#putAll').onclick = () => put(PRODUCTS);
}
function pct(a,b){ return b ? Math.round(a / b * 100) + '%' : '—'; }
function statsHTML(){
  const s = state.stats;
  return `<div class="stat-big"><div><b class="ltr">${s.ok} / ${s.total}</b><span>إجابات صحيحة</span></div><div><b class="ltr">${pct(s.ok, s.total)}</b><span>نسبة الإجابات الصحيحة</span></div></div>`;
}
function lessonsHTML(){
  return `<div class="lessons">${[1,2,3,4].map(l => {
    const [a,b] = state.stats.by[l];
    return `<label><input type="checkbox" id="les${l}" data-l="${l}" ${state.lessons.includes(l) ? 'checked' : ''}>${LESSONS[l]}<span class="st">${b ? `${a} من ${b} صحيحة` : 'لم تُطرح أسئلة بعد'}</span></label>`;
  }).join('')}</div>`;
}
function openSettings(){
  openSheet(`<h2>الإعدادات</h2>
    <h3>دروس الأسئلة</h3>${lessonsHTML()}<p class="warn" id="lesWarn" hidden>يلزم اختيار درس واحد على الأقل.</p>
    <h3>النتيجة</h3>${statsHTML()}
    <h3>التقدّم</h3>
    <div id="resetBox"><button class="danger" type="button" id="resetBtn">لعبة جديدة</button></div>
    <div class="row"><button class="primary" type="button" data-close>إغلاق</button></div>`);
  sheet.querySelectorAll('.lessons input').forEach(inp => inp.onchange = () => {
    const ls = [...sheet.querySelectorAll('.lessons input:checked')].map(i => +i.dataset.l);
    if (!ls.length){ inp.checked = true; $('#lesWarn').hidden = false; return; }
    $('#lesWarn').hidden = true; state.lessons = ls; state.decks = {1:[], 2:[]}; save();
  });
  $('#resetBtn').onclick = () => {
    $('#resetBox').innerHTML = `<p>سيُحذف التقدّم الحالي كله: الموارد والمباني والنتيجة.</p><div class="row"><button class="danger" type="button" id="resetYes">تأكيد البدء من جديد</button><button class="ghost" type="button" id="resetNo">إلغاء</button></div>`;
    $('#resetYes').onclick = () => { const ls = state.lessons, mu = state.mute; state = newState(); state.lessons = ls; state.mute = mu; state.seenHelp = true; player.x = 14; player.y = 12; player.path = []; player.pending = null; save(); updateHUD(); closeSheet(); toast('بدأت لعبة جديدة'); };
    $('#resetNo').onclick = openSettings;
  };
}
function openHelp(first){
  openSheet(`<h2>قرية الكيمياء</h2>
    <p class="sub">مزرعة تُبنى من البيت الحجري حتى قصر العلماء، بالإجابة عن أسئلة الفصل الأول.</p>
    <ul class="help">
      <li>يتحرك اللاعب بالنقر على أي موضع في الخريطة.</li>
      <li>النقر على <b>الشجرة</b> لقطع الحطب، وعلى <b>الصخرة</b> لتكسير الحجارة، وعلى <b>الحقل</b> لزراعته ثم حصاده بعد نضج الثمار.</li>
      <li>قبل الحصول على أي مورد يظهر سؤال علمي: الإجابة الصحيحة تمنح المورد كاملًا، والإجابة الخاطئة تمنح جزءًا منه مع عرض الإجابة الصحيحة.</li>
      <li>في <b>الحظيرة</b>: تنظيفها يمنح عملات، وبعد التنظيف يُجمع البيض من الدجاج والحليب من الأبقار.</li>
      <li>تُعرض الثمار والبيض والحليب في بسطة <b>السوق</b>، فيأتي أهل القرية لشرائها، وتُضاف العملات تلقائيًا.</li>
      <li>تبدأ الأسئلة سهلة، ثم تتدرج إلى المتوسطة كلما تقدّم البناء.</li>
      <li>في وسط القرية <b>أرض البناء</b>: لكل مرحلة بناء موارد مطلوبة وسؤال بناء، وكل مبنى جديد يفتح حقولًا إضافية.</li>
      <li>زر الصوت في أعلى الشاشة لتشغيل المؤثرات الصوتية أو إيقافها.</li>
      <li>في الحاسوب: مفاتيح الأسهم للحركة، ومفتاح المسافة للتفاعل مع الشيء المجاور، والأرقام 1 إلى 4 لاختيار الإجابة.</li>
    </ul>
    ${stepsHTML()}
    <div class="row"><button class="primary" type="button" data-close>${first ? 'بدء اللعب' : 'إغلاق'}</button></div>
    <p class="credit">إعداد المعلمة: م. أنوار الفضلي</p>`);
  if (first){ state.seenHelp = true; save(); }
}
function showWin(){
  openSheet(`<h2>اكتمل بناء قصر العلماء</h2>
    <p>اكتملت جميع مراحل البناء في قرية الكيمياء.</p>${statsHTML()}${lessonsHTML().replace(/<input[^>]*>/g, '')}
    <div class="row"><button class="primary" type="button" data-close>متابعة اللعب</button><button class="ghost" type="button" id="winNew">لعبة جديدة</button></div>`);
  $('#winNew').onclick = () => { openSettings(); $('#resetBtn').click(); };
}
$('#helpBtn').onclick = () => openHelp(false);
function updateSnd(){ const b = $('#sndBtn'); b.innerHTML = state.mute ? ICON.mute : ICON.sound; b.setAttribute('aria-pressed', String(!state.mute)); b.title = state.mute ? 'الصوت متوقف' : 'الصوت يعمل'; }
$('#sndBtn').onclick = () => { state.mute = !state.mute; if (state.mute){ if (AC) AC.suspend(); } else { audio(); SFX.tap(); } updateSnd(); save(); };
addEventListener('pointerdown', () => { if (!AC) audio(); });
addEventListener('keydown', () => { if (!AC) audio(); });
$('#setBtn').onclick = openSettings;
$('#stageBtn').onclick = openBuild;

/* ---------------- boot ---------------- */
addEventListener('resize', resize);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
resize(); updateHUD(); updateSnd();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
requestAnimationFrame(t => { last = t; loop(t); });
if (!state.seenHelp) openHelp(true);
if (location.hash === '#reel'){
  document.getElementById('app').classList.add('reel');
  window.__cv = {tile:(x,y) => [(x + .5)*TS - Math.round(cam.x), (y + .5)*TS - Math.round(cam.y)], walking:() => player.path.length > 0, animals:() => ANIMALS.map(a => [a.k, a.x, a.y])};
}
})();
</script>
</body></html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الروابط التساهمية والتناسقية · كتاب حي</title>
<style>
:root{--ink:#132a40;--acc:#1a5fa8;--acc2:#3b97cf;--paper:#fffdf8;--gold:#f2b134;--red:#e5484d;--green:#1f9d63;--mute:#6b7d91;--line:#d3e3ef}
.book.les1{--acc:#0e7c86;--acc2:#19a7b2}.book.les2{--acc:#5b4bd6;--acc2:#8a7cf0}.book.les3{--acc:#c2550f;--acc2:#f08a3c}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Naskh Arabic","Traditional Arabic",Tahoma,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 30% 0%,#2b5580,#0f2238 58%,#08111d);overflow:hidden}
.f{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-weight:700;white-space:nowrap}
sub,sup{font-size:.7em;line-height:0}
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:linear-gradient(90deg,#ffffff14,#ffffff08);border-bottom:1px solid #ffffff1c;flex-wrap:wrap;color:#fff}
.bar h1{font-size:16px;margin:0;flex:1;min-width:220px;letter-spacing:.2px}
.bar h1 small{opacity:.7;font-weight:400}
.bar .pos{font-weight:700;min-width:64px;text-align:center}
.btn{font:inherit;font-size:14px;border:0;border-radius:10px;padding:7px 14px;background:#fff;color:var(--acc);cursor:pointer;box-shadow:0 2px 0 #0002}
.btn:active{transform:translateY(1px)}
.btn.p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.btn.g{background:#eef6fc;color:var(--acc);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
select,input{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;color:var(--ink);max-width:100%}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;min-height:0}
.book{width:min(1240px,100%);height:100%;max-height:860px;position:relative;perspective:2400px;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.book select,.book input{-webkit-user-select:text;user-select:text}
.spread{display:flex;height:100%;border-radius:14px;box-shadow:0 30px 70px #000a,0 0 0 1px #ffffff14}
.pg{flex:1;min-width:0;background:var(--paper);padding:20px 22px 12px;overflow:auto;display:flex;flex-direction:column;gap:11px}
.pg>*{flex-shrink:0}
.pg.r{border-radius:0 14px 14px 0;box-shadow:inset 26px 0 28px -22px #0003}
.pg.l{border-radius:14px 0 0 14px;box-shadow:inset -26px 0 28px -22px #0003}
.spread.af .pg.r{animation:fF .75s cubic-bezier(.2,.7,.2,1) both;transform-origin:left center}
.spread.ab .pg.l{animation:fB .75s cubic-bezier(.2,.7,.2,1) both;transform-origin:right center}
@keyframes fF{from{transform:rotateY(-78deg);opacity:.15}to{transform:none;opacity:1}}
@keyframes fB{from{transform:rotateY(78deg);opacity:.15}to{transform:none;opacity:1}}
.leaf{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;z-index:5;will-change:transform}
.leaf.fw{right:0;transform-origin:left center}.leaf.bw{left:0;transform-origin:right center}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face>.pg{height:100%}
.face::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0008,#0000 70%);opacity:var(--sh,0);pointer-events:none}
.lh{align-self:flex-start;font-size:12.5px;color:#fff;background:linear-gradient(90deg,var(--acc),var(--acc2));padding:4px 12px;border-radius:999px;box-shadow:0 3px 10px #0002}
h2{margin:0;font-size:21px;color:var(--acc);line-height:1.5}
h2.huge{font-size:36px;line-height:1.45;background:linear-gradient(90deg,var(--acc),#6c4ad8);-webkit-background-clip:text;background-clip:text;color:transparent}
h3{margin:0;font-size:16px}
p{margin:0;line-height:1.9;font-size:15px}
ul{margin:4px 0;padding-right:20px;line-height:1.85;font-size:14.5px}
.note{font-size:13.5px;color:var(--mute)}
.box{border:1px solid var(--line);background:#f6fbff;border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.9;display:flex;flex-direction:column;gap:6px}
.ask{border-radius:14px;padding:10px 12px;background:linear-gradient(135deg,#fff8e6,#fffdf6);border:1px dashed #e7c46a;font-size:15px;line-height:1.85}
.def{border-radius:14px;padding:10px 12px;background:linear-gradient(135deg,#ffffff,#eef8fb);border:1px solid var(--acc);border-inline-start:6px solid var(--acc);line-height:1.9;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.foot{margin-top:auto;font-size:11px;color:var(--mute);display:flex;justify-content:space-between;padding-top:6px;border-top:1px dashed var(--line);opacity:.85}
.msg{font-size:14px;min-height:20px;font-weight:700;line-height:1.8}
.msg.ok{color:var(--green)}.msg.no{color:var(--red)}
.good{background:#e7f8ef!important;border-color:var(--green)!important}
.bad{background:#fde8e8!important;border-color:var(--red)!important}
.hint{display:none;background:#fff8e1;border-inline-start:4px solid var(--gold);padding:7px 10px;border-radius:8px;font-size:14px}
.hint.on{display:block}
.hide{display:none!important}
.reveal{display:none}.reveal.on{display:block;animation:pop .5s}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t td,table.t th{border:1px solid var(--line);padding:6px 5px;text-align:center}
table.t th{background:#eaf4fb}
.mcq{display:flex;flex-wrap:wrap;gap:7px}
.mcq button{font:inherit;font-size:14.5px;padding:7px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:transform .15s}
.mcq button:hover{transform:translateY(-1px)}
.mcq.col{flex-direction:column;align-items:stretch}
.tok small{font-size:11px;color:var(--mute)}
.mcq button.ok{background:#e7f8ef;border-color:var(--green)}
.mcq button.no{background:#fde8e8;border-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.col{flex-direction:column;align-items:stretch}
.chip{font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.stp{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px 6px;direction:ltr;vertical-align:middle}
.stp .btn{padding:2px 9px}
.stp .val{min-width:22px;text-align:center;font-weight:800;font-size:17px}
.cnt{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 8px;direction:ltr}
.cnt b{min-width:24px;text-align:center;font-size:19px}
.lbl{font-size:14px;font-weight:700}
.goals2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goals2>div{background:linear-gradient(160deg,#eef8fb,#fff);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.goals2 b{color:var(--acc)}
.eqline{text-align:center;font-size:18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px}
.tag{padding:1px 8px;border-radius:8px;color:#fff;font-size:13px}.tag.red{background:#e5484d}.tag.blue{background:#1c3550}
/* molecule viewer */
.mv{position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 36%,#27507a,#0e1d30 70%,#09121e);box-shadow:inset 0 0 50px #000a,0 8px 22px #0b1a2a40;flex-shrink:0}
.mvc{width:100%;height:250px;display:block;touch-action:none;cursor:grab}
.mvc:active{cursor:grabbing}
.mv.big .mvc{height:300px}
.mvlabel{position:absolute;top:10px;right:12px;color:#eaf4ff;font-weight:700;font-size:15px;text-shadow:0 1px 4px #000c;pointer-events:none}
.mvhelp{position:absolute;top:34px;right:12px;color:#9fc0de;font-size:11.5px;pointer-events:none}
.mvtools{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:5px}
.mvb{width:32px;height:32px;border-radius:50%;border:1px solid #ffffff3a;background:#ffffff1a;color:#fff;font-size:17px;cursor:pointer;line-height:1}
.mvbar{padding:6px 10px 10px;display:flex;flex-direction:column;gap:6px}
.mv .chip{background:#ffffff12;color:#dceaff;border-color:#ffffff2e}
.mv .chip.on{background:linear-gradient(135deg,var(--acc2),#6c4ad8);color:#fff}
/* builders */
.bb,.cb,.cob{border:1px solid var(--line);border-radius:18px;padding:10px;background:linear-gradient(180deg,#fbfeff,#eef7fd);display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 18px #0b1a2a12}
.bbsvg svg{width:100%;height:auto;display:block;direction:ltr;max-height:240px}
.bbctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.bbstat{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.bbstat .msg{flex-basis:100%;text-align:center}
.pill{padding:3px 10px;border-radius:999px;font-size:13px;border:1px solid}
.pill.ok{background:#e7f8ef;border-color:#9bd8b8;color:#126a42}
.pill.less{background:#fff6e0;border-color:#efd18a;color:#8a5a00}
.pill.over{background:#fde8e8;border-color:#f0a5a5;color:#a11}
.after{display:flex;flex-direction:column;gap:8px;animation:pop .5s;border-top:1px dashed var(--line);padding-top:8px}
.lsvg .en{fill:#1c3550}
.lsvg .es{fill:#e5484d}
.lsvg .ec{fill:#f2a900}
.lsvg .lb{stroke:#1d3b5a;stroke-width:3.4;stroke-linecap:round}
.lsvg .lco{stroke:#e0a100;stroke-width:3.8;stroke-linecap:round;stroke-dasharray:9 5;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.lsvg .lsym{font:800 17px "Segoe UI",Tahoma,sans-serif;text-anchor:middle;fill:#fff}
.lsvg .lsym.dk{fill:#1c3550}
.lsvg .ldl{font:800 14px "Segoe UI",Tahoma,sans-serif;text-anchor:middle}
.lsvg .ldl.neg{fill:#d6336c}.lsvg .ldl.pos{fill:#1c6fd1}
.lsvg .lbr{fill:none;stroke:#1d3b5a;stroke-width:2.6}
.lsvg .lchg{font:800 22px "Segoe UI",Tahoma,sans-serif;fill:#1d3b5a}
.cobstage{position:relative}
.proton{position:absolute;right:8px;top:6px;width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd3d3 40%,#e5484d);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:#5a0d10;cursor:grab;touch-action:none;box-shadow:0 0 0 6px #e5484d22,0 8px 16px #0003;animation:bob 2s ease-in-out infinite;z-index:3;direction:ltr}
.proton small{font-size:9px;font-weight:600;direction:rtl}
.proton.dg{animation:none;cursor:grabbing;box-shadow:0 0 0 10px #e5484d33,0 16px 26px #0005}
@keyframes bob{50%{transform:translateY(-6px)}}
.tug{display:flex;flex-direction:column;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.tg{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:8px;direction:ltr}
.tg span{font-weight:800}
.tg i{display:block;height:14px;border-radius:8px;background:linear-gradient(90deg,#1c6fd1,#d6336c);width:calc(var(--v)/4*100%)}
.tug small{color:var(--mute)}
/* tokens */
.tok{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;margin:4px;border-radius:12px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 0 #0001;cursor:grab;touch-action:none;font-size:16px;user-select:none}
.tok.drag{position:fixed;z-index:999;pointer-events:none;box-shadow:0 14px 26px #0004;transform:scale(1.06)}
.drop{min-height:52px;border:2px dashed #9ab;border-radius:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;padding:4px;background:#fbfdff;gap:2px}
.drop.slot{min-width:110px}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bin{flex-direction:column;min-height:110px;justify-content:flex-start}
.bin>b{font-size:13px;color:var(--acc)}
.mrow{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;font-size:14.5px;line-height:1.7}
/* pie */
.piewrap{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center}
.pie{width:100%;filter:drop-shadow(0 8px 14px #0b1a2a33)}
.pie .slice{cursor:pointer;stroke:#fff;stroke-width:2;transition:transform .25s;transform-origin:110px 110px}
.pie .slice:hover,.pie .slice.on{transform:scale(1.05)}
.pie .pl{font:800 15px "Segoe UI",Tahoma;fill:#fff;text-anchor:middle}
.pie .pl.dk{fill:#1d3b5a;font-size:12px}
/* pen */
.pensvg{width:100%;max-height:200px;display:block}
.pensvg .paper{fill:#fff;stroke:#c9d9e6;stroke-width:2}
.pensvg .kid circle{fill:#f2c9a5}.pensvg .kid rect{fill:#0e7c86}.pensvg .k2 rect{fill:#6c4ad8}
.pensvg .word{font:800 30px "Noto Naskh Arabic",Tahoma;text-anchor:middle;fill:#1d3b5a;direction:rtl}
.pensvg .cover{fill:#fff;transform-box:fill-box;transform-origin:left center}
.pensvg .penp{transform:translate(82px,128px)}
.pensvg .penp rect{fill:#222}
.pen.share .cover{animation:wr 2.6s .4s linear forwards}
.pen.share .penp{animation:penmv 3s ease-in-out forwards}
@keyframes wr{to{transform:scaleX(0)}}
@keyframes penmv{0%{transform:translate(82px,128px)}15%{transform:translate(236px,124px)}35%{transform:translate(205px,130px)}50%{transform:translate(180px,122px)}65%{transform:translate(150px,130px)}85%{transform:translate(128px,124px)}100%{transform:translate(272px,128px)}}
/* umbrella */
.umb{width:100%;display:block;border-radius:14px;touch-action:none}
.umb .sky{fill:#c9dbe9}.umb .gnd{fill:#8aa0b2}
.umb .drop{stroke:#5f97c9;stroke-width:2;animation:rain .8s linear infinite}
@keyframes rain{to{transform:translateY(250px)}}
.umb .dad circle,.umb .son circle{fill:#f2c9a5}
.umb .dad rect{fill:#e9edf1;stroke:#9aa9b6}.umb .son rect{fill:#24466e}
.umbw.wet .son rect{fill:#5d9ad6}
.umb .can{fill:#14263b;stroke:#0a1522;stroke-width:2}
.umb .hdl{stroke:#14263b;stroke-width:4}
.umb .ub{cursor:grab}
/* phones */
.phw{position:relative;height:210px;border-radius:14px;background:linear-gradient(180deg,#eef6fc,#dfecf7);overflow:hidden;direction:ltr}
.phone{position:absolute;top:18px;width:86px;height:150px;border-radius:16px;background:#14222f;box-shadow:0 10px 20px #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:4px}
.phone.pa{left:12%}.phone.pb{left:62%}
.phone b{font-size:20px}
.bat{width:30px;height:56px;border:3px solid #cfe0ee;border-radius:5px;position:relative;display:flex;align-items:flex-end;padding:2px}
.bat::before{content:"";position:absolute;top:-8px;left:8px;width:9px;height:5px;background:#cfe0ee;border-radius:2px 2px 0 0}
.bat i{display:block;width:100%;background:linear-gradient(#5be38e,#1f9d63);border-radius:2px;transition:height .2s}
.phone.pb .bat i.low{background:linear-gradient(#ff8a8a,#e5484d)}
.pct{font-size:12px;opacity:.9}
.plug{position:absolute;width:26px;height:34px;border-radius:6px;background:linear-gradient(#f2b134,#c4840a);cursor:grab;touch-action:none;box-shadow:0 4px 8px #0004;z-index:3}
.plug::after{content:"";position:absolute;top:-8px;left:7px;width:4px;height:9px;background:#888;box-shadow:8px 0 #888}
.cable{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cable path{fill:none;stroke:#27384a;stroke-width:5;stroke-linecap:round}
.dacc{display:flex;align-items:center;gap:8px;margin:8px 0}
.dcard{flex:1;border-radius:12px;padding:8px;font-size:13.5px;line-height:1.7;background:#fff;border:1px solid var(--line)}
.dcard b{display:block;color:var(--acc)}
.arw{font-size:26px;color:var(--gold);font-weight:800}
/* lab */
.labc{width:100%;height:270px;display:block;border-radius:14px;background:linear-gradient(180deg,#f4f9fd,#e3eef7)}
.rng{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.rng input{flex:1}
.bulb{width:34px;height:34px;border-radius:50%;background:#dfe6ee;box-shadow:inset 0 0 0 2px #9aa;transition:.35s;flex-shrink:0}
.bulb.lit{background:#ffe066;box-shadow:0 0 26px 10px #ffe06699}
.kit{display:flex;flex-wrap:wrap;gap:6px}
/* states */
.tx input[type=range]{width:100%}
.ph{position:relative;width:58px;height:34px;margin:0 auto;border-radius:6px;background:#eef6fc;overflow:hidden}
.ph i{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.ph i:nth-child(1){left:6px;top:6px}.ph i:nth-child(2){left:24px;top:6px}.ph i:nth-child(3){left:42px;top:6px}
.ph i:nth-child(4){left:6px;top:20px}.ph i:nth-child(5){left:24px;top:20px}.ph i:nth-child(6){left:42px;top:20px}
.ph.s i{animation:vib .25s ease-in-out infinite alternate}
.ph.l i{animation:slide 1.6s ease-in-out infinite alternate}
.ph.l i:nth-child(1),.ph.l i:nth-child(2),.ph.l i:nth-child(3){top:18px}
.ph.g i{animation:fly 1.3s ease-in-out infinite alternate}
.ph.g i:nth-child(2n){animation-duration:1.7s}.ph.g i:nth-child(3n){animation-direction:alternate-reverse}
@keyframes vib{to{transform:translate(1px,1px)}}
@keyframes slide{to{transform:translateX(9px)}}
@keyframes fly{0%{transform:translate(0,0)}50%{transform:translate(12px,-6px)}100%{transform:translate(-8px,10px)}}
.phn{font-size:12.5px;font-weight:700}
.states3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.states3>div{border-radius:12px;padding:6px;text-align:center;background:#fff;border:1px solid var(--line);font-size:13px;line-height:1.7}
/* conductivity */
.cvw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cvp{border-radius:14px;padding:8px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px}
.bk{position:relative;width:100%;height:96px;border:3px solid #7aa3c4;border-top:none;border-radius:0 0 18px 18px;background:linear-gradient(#e6f3fd,#bfe0f7);overflow:hidden}
.bk::before,.bk::after{content:"";position:absolute;top:-4px;width:6px;height:80px;background:#333;border-radius:3px}
.bk::before{left:22%}.bk::after{right:22%}
.io{position:absolute;width:15px;height:15px;border-radius:50%;font-size:11px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Tahoma}
.io.p{background:#1c6fd1;animation:toL 2.4s linear infinite}
.io.n{background:#d6336c;animation:toR 2.4s linear infinite}
@keyframes toL{from{transform:translateX(40px)}to{transform:translateX(-50px)}}
@keyframes toR{from{transform:translateX(-40px)}to{transform:translateX(50px)}}
.ml{position:absolute;width:20px;height:20px;border:2px solid #496b8a;border-radius:6px;transform:rotate(30deg);animation:vib .6s ease-in-out infinite alternate}
@media (max-width:860px){.pg{padding:14px 14px 10px}h2{font-size:18px}p{font-size:14px}.goals2,.piewrap{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}}
.bbsvg{touch-action:none}
.lsvg .ue{fill:#ffcc33;stroke:#e08a00;stroke-width:1.5;filter:drop-shadow(0 0 5px #ffb400);animation:uep 1.1s ease-in-out infinite}
@keyframes uep{50%{opacity:.55}}
.lsvg .ueh{fill:transparent;cursor:grab}
.lsvg .ueg:hover .ue{fill:#ffe27a}
.lsvg .pair{cursor:pointer}
.lsvg .es{filter:drop-shadow(0 0 4px #e5484d)}
.lsvg .zone{fill:rgba(31,157,99,.08);stroke:#1f9d63;stroke-width:2;stroke-dasharray:7 5;animation:dash 1.2s linear infinite}
.lsvg .ztxt{font:700 11px Tahoma,sans-serif;fill:#1f9d63;text-anchor:middle}
.lsvg .ring{fill:none;stroke-width:3}
.lsvg .ring.ok{stroke:#1f9d63;filter:drop-shadow(0 0 6px #1f9d63)}
.lsvg .ring.less{stroke:#efb63a;stroke-dasharray:4 4}
.lsvg .ghost{opacity:.35}
.lsvg .ghost.done{opacity:.12}
.lsvg .burst{fill:none;stroke:#ffcc33;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:burst .75s ease-out forwards}

.fe{position:fixed;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#ffcc33 50%,#e08a00);box-shadow:0 0 16px 6px #ffcc3399;pointer-events:none;z-index:999}

<body>
<div class="app">
  <header class="bar">
    <h1>الكتاب الحي · الروابط التساهمية والتناسقية <small>· الصف العاشر</small></h1>
    <button class="btn" id="snd" title="الصوت">🔊</button>
    <select id="toc" aria-label="الانتقال إلى"></select>
    <button class="btn" id="prev">→ السابق</button>
    <span class="pos" id="pos"></span>
    <button class="btn" id="next">التالي ←</button>
  </header>
  <main class="stage"><div class="book" id="book"></div></main>
</div>

<script>
/* ===================== أدوات عامة ===================== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const norm=s=>String(s).replace(/[\s‏‎]/g,'').replace(/[₀-₉]/g,c=>String(c.charCodeAt(0)-0x2080)).replace(/−/g,'-').toLowerCase();
const valOf=el=>el.classList.contains('stp')?el.dataset.val:el.value;
const foot=label=>`<div class="foot"><span>إعداد: م.انوار الفضلي</span><span>${label||''}</span></div>`;
function chem(s){return '<span class="f">'+s.replace(/\^([0-9]*[+\-])/g,(m,a)=>'<sup>'+a.replace('-','−')+'</sup>').replace(/([A-Za-z)])(\d+)/g,'$1<sub>$2</sub>')+'</span>'}
function sel(ans,opts){return `<select data-ans="${ans}"><option value="">اختر</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select>`}
function stpHTML(ans,max=8){return `<span class="stp" data-min="0" data-max="${max}" data-val="0" data-ans="${ans}"><button class="btn g" data-dn>−</button><b class="val">0</b><button class="btn g" data-up>+</button></span>`}
const len=v=>Math.hypot(v[0],v[1],v[2]);
const nrm=v=>{const L=len(v);return L<1e-9?[0,0,0]:[v[0]/L,v[1]/L,v[2]/L]};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];

/* ===================== بيانات الذرات والجزيئات ===================== */
const ATOM={H:{c:['#ffffff','#7d8b99'],r:.26,en:2.1},C:{c:['#b3bdcb','#2b323c'],r:.36,en:2.5},N:{c:['#a8c2ff','#1d3fb3'],r:.36,en:3.0},O:{c:['#ffa3a3','#b8141b'],r:.35,en:3.5},F:{c:['#d8ffc4','#4c9a2a'],r:.32,en:4.0},Cl:{c:['#bfffc7','#168a36'],r:.44,en:3.0}};
const ELB={H:{v:1,t:2,n:'الهيدروجين'},C:{v:4,t:8,n:'الكربون'},N:{v:5,t:8,n:'النيتروجين'},O:{v:6,t:8,n:'الأكسجين'},F:{v:7,t:8,n:'الفلور'},Cl:{v:7,t:8,n:'الكلور'}};
const T4=.62,Q4=.95;
const tetra=(e0,e1,d,co)=>({atoms:[[e0,0,0,0],[e1,d,d,d],[e1,d,-d,-d],[e1,-d,d,-d],[e1,-d,-d,d]],bonds:[[0,1,1],[0,2,1],[0,3,1],[0,4,1,co]]});
const pyr=(e0,y0)=>[[e0,0,y0,0],['H',0,y0-.47,.95],['H',-.82,y0-.47,-.475],['H',.82,y0-.47,-.475]];
const MOLS={
 H2:{f:'H2',n:'جزيء الهيدروجين',atoms:[['H',-.65,0,0],['H',.65,0,0]],bonds:[[0,1,1]],lp:[0,0]},
 O2:{f:'O2',n:'جزيء الأكسجين',atoms:[['O',-.7,0,0],['O',.7,0,0]],bonds:[[0,1,2]],lp:[2,2]},
 N2:{f:'N2',n:'جزيء النيتروجين',atoms:[['N',-.6,0,0],['N',.6,0,0]],bonds:[[0,1,3]],lp:[1,1]},
 F2:{f:'F2',n:'جزيء الفلور',atoms:[['F',-.75,0,0],['F',.75,0,0]],bonds:[[0,1,1]],lp:[3,3]},
 Cl2:{f:'Cl2',n:'جزيء الكلور',atoms:[['Cl',-.95,0,0],['Cl',.95,0,0]],bonds:[[0,1,1]],lp:[3,3]},
 HCl:{f:'HCl',n:'كلوريد الهيدروجين',atoms:[['H',-1.0,0,0],['Cl',.6,0,0]],bonds:[[0,1,1]],lp:[0,3]},
 HF:{f:'HF',n:'فلوريد الهيدروجين',atoms:[['H',-.85,0,0],['F',.5,0,0]],bonds:[[0,1,1]],lp:[0,3]},
 H2O:{f:'H2O',n:'جزيء الماء',atoms:[['O',0,.25,0],['H',-.9,-.4,0],['H',.9,-.4,0]],bonds:[[0,1,1],[0,2,1]],lp:[2,0,0]},
 NH3:{f:'NH3',n:'جزيء الأمونيا',atoms:pyr('N',.35),bonds:[[0,1,1],[0,2,1],[0,3,1]],lp:[1,0,0,0]},
 CH4:{f:'CH4',n:'الميثان',...tetra('C','H',T4),lp:[0,0,0,0,0]},
 CCl4:{f:'CCl4',n:'رابع كلوريد الكربون',...tetra('C','Cl',Q4),lp:[0,3,3,3,3],span:5.6},
 CO2:{f:'CO2',n:'ثاني أكسيد الكربون',atoms:[['C',0,0,0],['O',-1.2,0,0],['O',1.2,0,0]],bonds:[[0,1,2],[0,2,2]],lp:[0,2,2]},
 H3O:{f:'H3O^+',n:'كاتيون الهيدرونيوم',atoms:pyr('O',.3),bonds:[[0,1,1],[0,2,1],[0,3,1,0]],lp:[1,0,0,0],ion:true},
 NH4:{f:'NH4^+',n:'كاتيون الأمونيوم',...tetra('N','H',T4,0),lp:[0,0,0,0,0],ion:true},
};
MOLS.CH4.bonds[3]=[0,4,1];MOLS.CCl4.bonds[3]=[0,4,1];
function lpDirs(M,i){
  const n=M.lp[i];if(!n)return [];
  const a=M.atoms[i],ds=[];
  M.bonds.forEach(b=>{if(b[0]===i||b[1]===i){const o=M.atoms[b[0]===i?b[1]:b[0]];ds.push(nrm([o[1]-a[1],o[2]-a[2],o[3]-a[3]]))}});
  let away=nrm(ds.reduce((s,d)=>[s[0]-d[0],s[1]-d[1],s[2]-d[2]],[0,0,0]));
  if(len(away)<1e-6)away=[0,1,0];
  let p=ds.length>=2?nrm(cross(ds[0],ds[1])):nrm(cross(away,[0,0,1]));
  if(len(p)<1e-6)p=nrm(cross(away,[0,1,0]));
  const q=cross(away,p);
  if(n===1)return [away];
  const ang=n===2?.95:1.2,ca=Math.cos(ang),sa=Math.sin(ang);
  return Array.from({length:n},(_,j)=>{const ph=n===2?(j?Math.PI:0):j*2*Math.PI/3,cp=Math.cos(ph),sp=Math.sin(ph);
    return nrm([away[0]*ca+(p[0]*cp+q[0]*sp)*sa,away[1]*ca+(p[1]*cp+q[1]*sp)*sa,away[2]*ca+(p[2]*cp+q[2]*sp)*sa])});
}
function charges(M){
  if(M._q)return M._q;const q=M.atoms.map(()=>0);
  M.bonds.forEach(([i,j])=>{const ei=ATOM[M.atoms[i][0]].en,ej=ATOM[M.atoms[j][0]].en;if(ei>ej){q[i]--;q[j]++}else if(ej>ei){q[j]--;q[i]++}});
  return M._q=q;
}

/* ===================== محرك ثلاثي الأبعاد ===================== */
const scenes=[];
function makeScene(cv,frame,o={}){
  const s={cv,ctx:cv.getContext('2d'),rx:o.rx??-.3,ry:o.ry??.6,auto:o.auto??.005,span:o.span??4.2,zoom:1,frame,dragging:false,px:0,py:0,dpr:Math.min(2,window.devicePixelRatio||1)};
  const pts=new Map();
  cv.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1){s.dragging=true;s.px=e.clientX;s.py=e.clientY}cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    if(pts.size===2){const [a,b]=[...pts.values()],d0=Math.hypot(a.x-b.x,a.y-b.y);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const [c1,c2]=[...pts.values()],d1=Math.hypot(c1.x-c2.x,c1.y-c2.y);if(d0>0)s.zoom=Math.max(.5,Math.min(2.6,s.zoom*d1/d0));return}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(s.dragging){s.ry+=(e.clientX-s.px)*.01;s.rx+=(e.clientY-s.py)*.01;s.px=e.clientX;s.py=e.clientY}
  });
  const up=e=>{pts.delete(e.pointerId);if(!pts.size)s.dragging=false;else{const v=[...pts.values()][0];s.px=v.x;s.py=v.y}};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{e.preventDefault();s.zoom=Math.max(.5,Math.min(2.6,s.zoom*(e.deltaY<0?1.1:.9)))},{passive:false});
  scenes.push(s);return s;
}
function makeAnim(cv,frame){const s={cv,ctx:cv.getContext('2d'),auto:0,span:1,zoom:1,frame,dragging:false,dpr:Math.min(2,window.devicePixelRatio||1)};scenes.push(s);return s}
function P(s,x,y,z){
  const cy=Math.cos(s.ry),sy=Math.sin(s.ry),cx=Math.cos(s.rx),sx=Math.sin(s.rx);
  const x1=x*cy+z*sy,z1=-x*sy+z*cy,y1=y*cx-z1*sx,z2=y*sx+z1*cx,k=6/(6+z2);
  return{X:s.w/2+x1*s.sc*k,Y:s.h/2-y1*s.sc*k,z:z2,k};
}
function resize(s){
  const r=s.cv.getBoundingClientRect(),w=Math.max(10,Math.floor(r.width)),h=Math.max(10,Math.floor(r.height));
  if(s.cv.width!==Math.floor(w*s.dpr)||s.cv.height!==Math.floor(h*s.dpr)){s.cv.width=Math.floor(w*s.dpr);s.cv.height=Math.floor(h*s.dpr)}
  s.w=w;s.h=h;s.sc=Math.min(w,h)/s.span*s.zoom;
}
function loop(t){
  for(let i=scenes.length-1;i>=0;i--){
    const s=scenes[i];
    if(!s.cv.isConnected){scenes.splice(i,1);continue}
    if(!s.dragging)s.ry+=s.auto;
    resize(s);s.ctx.setTransform(s.dpr,0,0,s.dpr,0,0);s.ctx.clearRect(0,0,s.w,s.h);
    s.frame(s,t/1000);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function ball(c,X,Y,r,[a,b]){const g=c.createRadialGradient(X-r*.38,Y-r*.42,r*.08,X,Y,r);g.addColorStop(0,'#ffffff');g.addColorStop(.18,a);g.addColorStop(1,b);c.fillStyle=g;c.beginPath();c.arc(X,Y,Math.max(r,1),0,Math.PI*2);c.fill()}
function glowDot(c,x,y,r,col){c.save();c.shadowColor=col;c.shadowBlur=10;c.fillStyle=col;c.beginPath();c.arc(x,y,Math.max(1.5,r),0,7);c.fill();c.restore()}
function head(c,x,y,ux,uy,size,col){c.fillStyle=col;c.beginPath();c.moveTo(x,y);c.lineTo(x-ux*size-uy*size*.6,y-uy*size+ux*size*.6);c.lineTo(x-ux*size+uy*size*.6,y-uy*size-ux*size*.6);c.closePath();c.fill()}
function banner(c,s,text,col){c.save();c.font='bold 13px Tahoma,sans-serif';c.direction='rtl';c.textAlign='center';const w=c.measureText(text).width+24;c.fillStyle=col||'rgba(10,20,35,.75)';const x=s.w/2-w/2,y=s.h-30;c.beginPath();c.roundRect?c.roundRect(x,y,w,22,11):c.rect(x,y,w,22);c.fill();c.fillStyle='#fff';c.fillText(text,s.w/2,y+15);c.restore()}

function molFrame(s,t){
  const M=MOLS[s.mol];if(!M)return;
  const c=s.ctx;if(s.t0==null)s.t0=t;
  const age=Math.min(1,(t-s.t0)/.7),pop=1-Math.pow(1-age,3);
  const q=charges(M),lpd=M._lp||(M._lp=M.atoms.map((_,i)=>lpDirs(M,i)));
  const A=M.atoms.map(([e,x,y,z])=>{const p=P(s,x*pop,y*pop,z*pop);return{e,x,y,z,p,R:ATOM[e].r*s.sc*p.k}});
  if(s.on.cloud)A.forEach((a,i)=>{const col=q[i]<0&&!M.ion?'229,72,77':q[i]>0&&!M.ion?'70,150,255':'200,215,235',rr=a.R*3.4;const g=c.createRadialGradient(a.p.X,a.p.Y,0,a.p.X,a.p.Y,rr);g.addColorStop(0,`rgba(${col},.5)`);g.addColorStop(1,`rgba(${col},0)`);c.fillStyle=g;c.beginPath();c.arc(a.p.X,a.p.Y,rr,0,7);c.fill()});
  const items=[];
  M.bonds.forEach(b=>items.push({z:(A[b[0]].p.z+A[b[1]].p.z)/2+.05,d:()=>drawBond(s,c,A,b,t)}));
  A.forEach((a,i)=>{
    items.push({z:a.p.z,d:()=>drawAtom(c,a)});
    if(s.on.lp)lpd[i].forEach(d=>{const off=ATOM[a.e].r+.24,lp=P(s,a.x*pop+d[0]*off,a.y*pop+d[1]*off,a.z*pop+d[2]*off);items.push({z:lp.z,d:()=>drawLP(c,s,a.p,lp)})});
  });
  items.sort((u,v)=>v.z-u.z).forEach(it=>it.d());
  if(s.on.delta&&!M.ion){c.font='bold 16px Segoe UI,Tahoma';c.textAlign='center';A.forEach((a,i)=>{if(!q[i])return;c.fillStyle=q[i]<0?'#ff8fa3':'#8cc2ff';c.fillText(q[i]<0?'δ−':'δ+',a.p.X+a.R*.95,a.p.Y-a.R*1.2)})}
  if(s.on.dip&&!M.ion){
    let v=[0,0,0],any=false;
    M.bonds.forEach(([i,j])=>{const ai=M.atoms[i],aj=M.atoms[j],ei=ATOM[ai[0]].en,ej=ATOM[aj[0]].en;if(ei===ej)return;any=true;
      const [pl,ng]=ei<ej?[ai,aj]:[aj,ai],d=nrm([ng[1]-pl[1],ng[2]-pl[2],ng[3]-pl[3]]),m=Math.abs(ei-ej);v=[v[0]+d[0]*m,v[1]+d[1]*m,v[2]+d[2]*m];
      const P1=P(s,pl[1]*pop,pl[2]*pop,pl[3]*pop),P2=P(s,ng[1]*pop,ng[2]*pop,ng[3]*pop);
      const dx=P2.X-P1.X,dy=P2.Y-P1.Y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=-uy*15,ny=ux*15;
      const sx=P1.X+dx*.22+nx,sy=P1.Y+dy*.22+ny,ex=P1.X+dx*.78+nx,ey=P1.Y+dy*.78+ny;
      c.strokeStyle='#ffb3ec';c.lineWidth=2.4;c.beginPath();c.moveTo(sx,sy);c.lineTo(ex,ey);c.stroke();head(c,ex+ux*2,ey+uy*2,ux,uy,9,'#ffb3ec');
      c.beginPath();c.moveTo(sx-uy*6,sy+ux*6);c.lineTo(sx+uy*6,sy-ux*6);c.stroke();
    });
    const mag=len(v);
    if(!any)banner(c,s,'لا يوجد فرق في السالبية ← جزيء غير قطبي','rgba(40,90,140,.85)');
    else if(mag<.15)banner(c,s,'الروابط قطبية لكن محصلتها صفر ← جزيء غير قطبي','rgba(40,90,140,.85)');
    else{const cen=M.atoms.reduce((a,b)=>[a[0]+b[1]/M.atoms.length,a[1]+b[2]/M.atoms.length,a[2]+b[3]/M.atoms.length],[0,0,0]),u=nrm(v);
      const p0=P(s,cen[0]*pop,cen[1]*pop,cen[2]*pop),p1=P(s,(cen[0]+u[0]*1.55)*pop,(cen[1]+u[1]*1.55)*pop,(cen[2]+u[2]*1.55)*pop);
      const dx=p1.X-p0.X,dy=p1.Y-p0.Y,L=Math.hypot(dx,dy)||1;
      c.save();c.shadowColor='#ff4fd8';c.shadowBlur=14;c.strokeStyle='#ff4fd8';c.lineWidth=6;c.lineCap='round';c.beginPath();c.moveTo(p0.X,p0.Y);c.lineTo(p1.X,p1.Y);c.stroke();head(c,p1.X+dx/L*6,p1.Y+dy/L*6,dx/L,dy/L,16,'#ff4fd8');c.restore();
      banner(c,s,'محصلة القطبية لا تساوي صفرًا ← جزيء قطبي','rgba(150,30,120,.85)');}
  }
}
function drawAtom(c,a){
  ball(c,a.p.X,a.p.Y,a.R,ATOM[a.e].c);
  c.fillStyle=a.e==='H'?'#24364a':'#fff';c.font=`bold ${Math.max(10,a.R*.9)}px Segoe UI,Tahoma`;c.textAlign='center';c.textBaseline='middle';c.fillText(a.e,a.p.X,a.p.Y+1);c.textBaseline='alphabetic';
}
function drawLP(c,s,ap,lp){
  const dx=lp.X-ap.X,dy=lp.Y-ap.Y,L=Math.hypot(dx,dy)||1,px=-dy/L,py=dx/L,rr=.17*s.sc*lp.k;
  const g=c.createRadialGradient(lp.X,lp.Y,0,lp.X,lp.Y,rr*1.6);g.addColorStop(0,'rgba(140,190,255,.45)');g.addColorStop(1,'rgba(140,190,255,0)');c.fillStyle=g;c.beginPath();c.arc(lp.X,lp.Y,rr*1.6,0,7);c.fill();
  glowDot(c,lp.X+px*4*lp.k,lp.Y+py*4*lp.k,2.7*lp.k,'#dff0ff');glowDot(c,lp.X-px*4*lp.k,lp.Y-py*4*lp.k,2.7*lp.k,'#dff0ff');
}
function drawBond(s,c,A,b,t){
  const [i,j,k,co]=b,a1=A[i],a2=A[j];
  const x1=a1.p.X,y1=a1.p.Y,x2=a2.p.X,y2=a2.p.Y,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
  const kk=(a1.p.k+a2.p.k)/2,w=Math.max(2.5,.075*s.sc*kk),gap=w*1.8,isCo=co!=null&&s.on.co;
  for(let m=0;m<k;m++){
    const o=(m-(k-1)/2)*gap,X1=x1+nx*o,Y1=y1+ny*o,X2=x2+nx*o,Y2=y2+ny*o;
    let st;if(isCo)st='#f2b134';else{const g=c.createLinearGradient(x1,y1,x2,y2),c1=ATOM[a1.e].c[1],c2=ATOM[a2.e].c[1];g.addColorStop(0,c1);g.addColorStop(.5,c1);g.addColorStop(.5,c2);g.addColorStop(1,c2);st=g}
    c.lineCap='round';c.strokeStyle=st;c.lineWidth=w;c.beginPath();c.moveTo(X1,Y1);c.lineTo(X2,Y2);c.stroke();
    c.strokeStyle='rgba(255,255,255,.3)';c.lineWidth=w*.35;c.beginPath();c.moveTo(X1-nx*w*.2,Y1-ny*w*.2);c.lineTo(X2-nx*w*.2,Y2-ny*w*.2);c.stroke();
  }
  if(isCo){const don=co===i?a1:a2,acc=co===i?a2:a1,ax=acc.p.X-don.p.X,ay=acc.p.Y-don.p.Y,AL=Math.hypot(ax,ay)||1;
    c.save();c.setLineDash([5,7]);c.lineDashOffset=-t*40;c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=1.8;c.beginPath();c.moveTo(don.p.X,don.p.Y);c.lineTo(acc.p.X,acc.p.Y);c.stroke();c.restore();
    c.save();c.shadowColor='#ffd166';c.shadowBlur=12;head(c,don.p.X+ax*.7,don.p.Y+ay*.7,ax/AL,ay/AL,13,'#ffd166');c.restore();}
  if(s.on.sh){
    const e1=ATOM[a1.e].en,e2=ATOM[a2.e].en,sh=Math.max(-.2,Math.min(.2,(e2-e1)*.16));
    for(let m=0;m<k;m++){const o=(m-(k-1)/2)*gap,f=.5+sh+.035*Math.sin(t*3.2+m*1.7),cx=x1+dx*f+nx*o,cy=y1+dy*f+ny*o,col=isCo?'#ffd166':'#7ff6ff';
      glowDot(c,cx-ux*4.5,cy-uy*4.5,3*kk,col);glowDot(c,cx+ux*4.5,cy+uy*4.5,3*kk,col)}

function makeLeaf(dir){
  const t=cur+dir,side=dir>0?'r':'l',T=S[t],sp=book.querySelector('.spread'),live=sp.querySelector('.pg.'+side);
  const under=document.createElement('article');under.className='pg '+side;under.innerHTML=dir>0?T.r:T.l;live.replaceWith(under);
  const leaf=document.createElement('div');leaf.className='leaf '+(dir>0?'fw':'bw');
  const front=document.createElement('div');front.className='face front';const back=document.createElement('div');back.className='face back';
  const bp=document.createElement('article');bp.className='pg '+(dir>0?'l':'r');bp.innerHTML=dir>0?T.l:T.r;
  back.appendChild(bp);front.appendChild(live);leaf.append(front,back);book.appendChild(leaf);leaf.style.transform='rotateY(0deg)';
  return{leaf,under,live,t,dir};
}
const setAngle=(tn,a)=>{tn.leaf.style.transform=`rotateY(${tn.dir>0?-a:a}deg)`;tn.leaf.style.setProperty('--sh',(a/180*.45).toFixed(3))};
function settle(tn,target,then){busy=true;tn.leaf.style.transition='transform .6s cubic-bezier(.3,.6,.3,1)';requestAnimationFrame(()=>{setAngle(tn,target);setTimeout(then,620)})}
function commit(tn){settle(tn,180,()=>{show(tn.t,0);busy=false})}
function revert(tn){settle(tn,0,()=>{tn.under.replaceWith(tn.live);tn.leaf.remove();busy=false})}
function turn(dir){if(busy)return;const t=cur+dir;if(t<0||t>=S.length)return;const tn=makeLeaf(dir);requestAnimationFrame(()=>commit(tn))}
function jump(i){if(busy||i<0||i>=S.length||i===cur)return;show(i,i>cur?1:-1)}
const skip=e=>e.target.closest&&e.target.closest('input,select,textarea,button,canvas,a,svg,.tok,.stp,.cnt,.proton,.plug,.mv,.drop');
book.addEventListener('pointerdown',e=>{if(busy||e.button>0||skip(e))return;const r=book.getBoundingClientRect();drag={x:e.clientX,side:e.clientX>r.left+r.width/2?'r':'l',turn:null,p:0,W:r.width/2}});
window.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x;
  if(!drag.turn){if(Math.abs(dx)<12)return;const dir=drag.side==='r'&&dx<0?1:drag.side==='l'&&dx>0?-1:0,t=cur+dir;if(!dir||t<0||t>=S.length){drag=null;return}drag.turn=makeLeaf(dir);busy=true;drag.turn.leaf.style.transition='none'}
  drag.p=Math.min(1,Math.abs(dx)/drag.W);setAngle(drag.turn,drag.p*180);
});
const release=()=>{if(!drag)return;const d=drag;drag=null;if(!d.turn)return;if(d.p>.4)commit(d.turn);else revert(d.turn)};
window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);
(()=>{const h=parseInt(location.hash.slice(1),10);show(Number.isInteger(h)&&h>=0&&h<S.length?h:0,0)})();
</script>

<title>عروض دروس الكيمياء</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Poppins:wght@600;700&display=swap">
<style>
/* Layout: lesson tabs on top, the slide as the hero at full width, big step buttons under it (thumb-reachable on phones) */
:root{
  --bg:#eaf3fb; --surface:#ffffff; --ink:#15305a; --muted:#5b7393; --line:#cfe0f0;
  --l1:#0f9d8e; --l2:#6c4fe0; --l3:#e8335f; --go:#1f6fb2;
  --display:"Cairo",Tahoma,Arial,sans-serif; --latin:"Poppins","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c2e;--surface:#16283f;--ink:#e7f0fb;--muted:#9db3cd;--line:#2a4262;--l1:#3ccbb9;--l2:#a18cff;--l3:#ff6b8a;--go:#5aa7ef;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1c2e;--surface:#16283f;--ink:#e7f0fb;--muted:#9db3cd;--line:#2a4262;--l1:#3ccbb9;--l2:#a18cff;--l3:#ff6b8a;--go:#5aa7ef;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-weight:800;direction:rtl;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:inherit;font-size:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tab b{font-family:var(--latin);font-size:13px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tab[aria-selected="true"] b{color:#fff;opacity:.85}
.tab:focus-visible,.nav button:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.stage{position:relative;background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:0 12px 30px rgba(21,48,90,.16);aspect-ratio:16/9;max-width:100%}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .35s}
.stage img.hide{opacity:0}
.stage .tapL,.stage .tapR{position:absolute;top:0;bottom:0;width:38%;cursor:pointer;background:none;border:0}
.stage .tapL{left:0}.stage .tapR{right:0}
.nav{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.nav button{font:inherit;font-size:19px;border:0;border-radius:16px;min-height:56px;padding:0 18px;cursor:pointer;color:#fff;background:var(--go);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.nav button.prev{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.nav button.reveal{background:#0b8a5a}
.nav button:disabled{opacity:.4;cursor:default}
.count{font-family:var(--latin);font-size:16px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;min-width:90px}
.hint{color:var(--muted);font-size:15px;text-align:center;min-height:1.4em;margin:0}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--go)}
@media (max-width:560px){.nav button{font-size:16px;padding:0 10px}.tab{font-size:14px;padding:7px 12px}}
@media (prefers-reduced-motion:reduce){.stage img{transition:none}}
</style>
<div class="wrap">
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="stage" id="stage">
    <img id="imA" alt=""><img id="imB" alt="" class="hide">
    <button class="tapR" id="tapR" aria-label="الشريحة السابقة"></button>
    <button class="tapL" id="tapL" aria-label="التالي"></button>
  </div>
  <p class="hint" id="hint"></p>
  <div class="nav">
    <button class="prev" id="prev">→ السابق</button>
    <div class="count" id="count"></div>
    <button id="next">التالي ←</button>
  </div>
  <div class="dots" id="dots"></div>
</div>
<script>
const CLICKS = [[false, false, false, true, true, true, false, false, false, true, true, false, true, true, true, true, true, true, true, true, true, true, true, true, true], [false, false, false, true, true, true, true, true, true, false, true, true, false, true, true, true, true, false, true, true, true, true, true, true, true], [false, false, true, true, true, false, false, false, true, true, true, true, true, true, true, true, true, true]];
const LESSONS = [
  { id: 'l1', code: '[1-1]', title: 'الترتيب الإلكتروني', c: '--l1' },
  { id: 'l2', code: '[2-1]', title: 'الرابطة الأيونية', c: '--l2' },
  { id: 'l3', code: '[3-1]', title: 'خواص المركبات الأيونية', c: '--l3' },
];
let L = 0, S = 0, step = 0;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const src = (l, s, base) => `img/l${l + 1}_${base ? 'base' : 'full'}-${pad(s + 1)}.jpg`;
const hasStep = (l, s) => CLICKS[l][s];
let front = $('imA'), back = $('imB');
function show(url) {
  if (front.getAttribute('src') === url) return;
  back.onload = () => { back.classList.remove('hide'); front.classList.add('hide'); [front, back] = [back, front]; };
  back.src = url;
}
function preload(l, s) { if (s < CLICKS[l].length) { new Image().src = src(l, s, hasStep(l, s)); if (hasStep(l, s)) new Image().src = src(l, s, false); } }
function render() {
  const base = hasStep(L, S) && step === 0;
  show(src(L, S, base));
  $('count').textContent = `${S + 1} / ${CLICKS[L].length}`;
  const last = S === CLICKS[L].length - 1;
  const nx = $('next');
  nx.className = base ? 'reveal' : '';
  nx.textContent = base ? 'أظهر الإجابة ←' : (last ? 'النهاية' : 'التالي ←');
  nx.disabled = !base && last;
  $('prev').disabled = S === 0 && step === 0;
  $('hint').textContent = base ? 'فكّر أولًا، ثم اضغط «أظهر الإجابة»' : '';
  $('dots').innerHTML = CLICKS[L].map((_, i) => `<i class="${i === S ? 'on' : ''}"></i>`).join('');
  document.querySelectorAll('.tab').forEach((t, i) => t.setAttribute('aria-selected', i === L));
  preload(L, S + 1);
}
function next() { if (hasStep(L, S) && step === 0) step = 1; else if (S < CLICKS[L].length - 1) { S++; step = 0; } render(); }
function prev() { if (step === 1) step = 0; else if (S > 0) { S--; step = hasStep(L, S) ? 1 : 0; } render(); }
function open(i) { L = i; S = 0; step = 0; render(); }
$('tabs').innerHTML = LESSONS.map((l, i) => `<button class="tab" role="tab" style="--c:var(${l.c})" data-i="${i}">${l.title} <b>${l.code}</b></button>`).join('');
document.querySelectorAll('.tab').forEach(t => t.onclick = () => open(+t.dataset.i));
$('next').onclick = next; $('prev').onclick = prev; $('tapL').onclick = next; $('tapR').onclick = prev;
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === ' ') { e.preventDefault(); next(); } if (e.key === 'ArrowRight') prev(); });
let sx = null;
$('stage').addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
$('stage').addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) (dx > 0 ? next() : prev()); sx = null; });
const h = (location.hash || '').slice(1); const hi = LESSONS.findIndex(l => l.id === h);
open(hi >= 0 ? hi : 0);
</script>

<title>لغز قانون هس</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap">
<style>
/* Layout: a lab bench of "equation cards" — target card on top, the cards you flip/multiply in the middle, a live summing tray below. Single bright-lab look on purpose (projector + iPads). */
:root{
  --bg:#EEF3F5; --panel:#FFFFFF; --ink:#13232B; --muted:#5B6E77; --line:#C9D7DD; --soft:#F6FAFB;
  --hot:#E8691E; --cold:#1C7FC4; --teal:#0E8F9E; --ok:#1E9E57; --bad:#C62828; --gold:#F2B705;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",Tahoma,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1200px;margin:0 auto;padding-block:16px 28px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:clamp(26px,3.2vw,40px);margin:0;text-wrap:balance}
h1 span{color:var(--hot)}
.credit{color:var(--muted);font-weight:700;font-size:15px}
.dots{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
.dots button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font:700 16px var(--display);color:var(--ink);cursor:pointer;padding:0}
.dots button[aria-current="step"]{border-color:var(--ink);background:var(--ink);color:#fff}
.dots button.done{border-color:var(--ok);background:#E7F6EE;color:var(--ok)}
button{font-family:var(--display);font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.btn{font-size:18px;border-radius:12px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);padding:9px 18px}
.btn.primary{background:var(--ink);color:#fff}
.mission{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 20px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.mission .tag{background:var(--hot);color:#fff;border-radius:10px;padding:2px 12px;font-family:var(--display);font-weight:700;font-size:16px;flex:none}
.mission p{margin:0;font-size:20px;font-weight:700;flex:1;min-width:0}
.eq{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:var(--body);font-weight:700;white-space:nowrap}
.eq sub{font-size:.62em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.62em;line-height:1;text-align:center;margin:0 1px}
.fr i{font-style:normal;padding:0 2px}.fr i:first-child{border-bottom:2px solid currentColor}
.target{background:#FFF8E1;border:3px solid var(--gold);border-radius:18px;padding:14px 18px;display:grid;gap:6px;text-align:center}
.target small{font-family:var(--display);font-weight:700;color:#8A6200;font-size:16px}
.target .eq{font-size:clamp(20px,2.6vw,30px);white-space:normal}
.cards{display:grid;gap:12px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;transition:border-color .2s}
.card.rev{border-color:var(--cold);background:#F1F8FE}
.card.mul{box-shadow:inset 0 0 0 2px #F7C99E}
.card .no{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700}
.card .body{min-width:0;display:grid;gap:4px}
.card .eqw{overflow-x:auto}
.card .eq{font-size:clamp(17px,2.1vw,25px)}
.card .dh{font-size:clamp(17px,2vw,23px)}
.card .note{font-size:14px;color:var(--muted);font-weight:700;min-height:20px}
.flipin{animation:flip .45s ease}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ctrls .rv{direction:rtl;font-size:17px;border-radius:12px;border:2px solid var(--cold);background:#fff;color:var(--cold);padding:7px 12px}
.ctrls .rv[aria-pressed="true"]{background:var(--cold);color:#fff}
.seg{direction:ltr;display:flex;border:2px solid var(--hot);border-radius:12px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--hot);font-size:17px;padding:7px 11px;min-width:42px}
.seg button[aria-pressed="true"]{background:var(--hot);color:#fff}
.tray{background:var(--panel);border:2px dashed var(--teal);border-radius:18px;padding:16px 18px;display:grid;gap:10px}
.tray h2{margin:0;font-family:var(--display);font-size:20px;color:var(--teal)}
.sumline{font-size:clamp(17px,2.1vw,24px);overflow-x:auto}
.result .eq{font-size:clamp(18px,2.3vw,27px);white-space:normal}
.gone{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--muted);font-weight:700}
.gone .eq{text-decoration:line-through;text-decoration-thickness:2px;color:var(--bad);font-size:17px;background:#FDECEC;border-radius:8px;padding:0 8px}
.status{border-radius:14px;padding:12px 16px;font-weight:700;font-size:18px}
.status.no{background:#FFF4E6;color:#8A4A00}
.status.ok{background:#E7F6EE;color:#14663A}
.rule{border:3px solid var(--ok);border-radius:18px;background:#F0FAF4;padding:16px 20px;display:grid;gap:8px}
.rule b{font-family:var(--display);color:var(--ok);font-size:20px}
.rule p{margin:0;font-size:20px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{background:#FFF8E1;border-radius:12px;padding:10px 14px;font-weight:700}
/* intro */
.intro{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0}
.panel svg{width:100%;height:auto;display:block}
.q{font-size:20px;font-weight:700;margin:0 0 10px}
.choices{display:grid;gap:8px}
.choice{text-align:start;font-family:var(--body);font-size:18px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:10px 14px;color:var(--ink)}
.choice.right{border-color:var(--ok);background:#E7F6EE}.choice.wrong{border-color:var(--bad);background:#FDECEC}
.law{border:3px solid var(--teal);background:#F0F9FA;border-radius:18px;padding:16px 20px}
.law b{font-family:var(--display);color:var(--teal);font-size:22px;display:block;margin-bottom:6px}
.rules{display:grid;gap:10px}
.rules div{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:700;font-size:19px}
.rules div span{color:var(--hot)}
canvas#fx{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:20}
@media (max-width:820px){.intro{grid-template-columns:1fr}.card{grid-template-columns:auto 1fr}.ctrls{grid-column:1/-1;justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" dir="rtl">
  <header>
    <h1>لغز <span>قانون هس</span></h1>
    <span class="credit">إعداد المعلمة: م.انوار الفضلي</span>
    <nav class="dots" id="dots" aria-label="المراحل"></nav>
  </header>
  <main id="stage"></main>
</div>
<canvas id="fx"></canvas>

<script>
const $=id=>document.getElementById(id);
/* ---------- chemistry helpers ---------- */
function frac(c){for(const d of [1,2,3,4]){const n=Math.round(c*d);if(Math.abs(n/d-c)<1e-9){if(d===1)return String(n);return `<span class="fr"><i>${n}</i><i>${d}</i></span>`}}return String(+c.toFixed(2))}
function formula(f){return f.replace(/([A-Za-z)])(\d+)/g,'$1<sub>$2</sub>')}
function term([c,f,s]){return (Math.abs(c-1)<1e-9?'':frac(c))+formula(f)+`<sub>(${s})</sub>`}
function side(list){return list.map(term).join(' + ')}
function eqHTML(r,p){return `<span class="eq">${side(r)} → ${side(p)}</span>`}
function num(v){v=Math.round(v*100)/100;if(Object.is(v,-0))v=0;return (v>0?'+':v<0?'−':'')+Math.abs(v).toString()}
function dHHTML(v){return `<span class="eq">ΔH° = ${num(v)} kJ</span>`}
const key=(f,s)=>f+'|'+s;

/* ---------- levels ---------- */
const T=(r,p)=>({r,p});
const LEVELS=[
 {name:'من الألماس إلى الجرافيت',mission:'تحوّل الألماس إلى جرافيت بطيء جدًا ولا يمكن قياس حرارته مباشرة. استخدم معادلتي الاحتراق للوصول إلى المعادلة المطلوبة.',
  target:T([[1,'C','diamond']],[[1,'C','graphite']]),
  given:[{r:[[1,'C','diamond'],[1,'O2','g']],p:[[1,'CO2','g']],dH:-395.4},{r:[[1,'C','graphite'],[1,'O2','g']],p:[[1,'CO2','g']],dH:-393.5}],
  hint:'الجرافيت يجب أن يكون في جهة النواتج. أيّ معادلة تحتاج أن تعكسها؟',
  rule:['القاعدة 1','عند عكس المعادلة، نعكس إشارة ΔH.']},
 {name:'تكوين أول أكسيد الكربون',mission:'لا يمكن إنتاج CO وحده في المختبر لأنّ CO₂ يتكوّن معه. احسب حرارة تكوين CO باستخدام المعادلتين.',
  target:T([[1,'C','graphite'],[.5,'O2','g']],[[1,'CO','g']]),
  given:[{r:[[1,'C','graphite'],[1,'O2','g']],p:[[1,'CO2','g']],dH:-393.5},{r:[[1,'CO','g'],[.5,'O2','g']],p:[[1,'CO2','g']],dH:-283.0}],
  hint:'CO يجب أن يكون في جهة النواتج، ولاحظ أنّ CO₂ يجب أن يُحذف من الجهتين.',
  rule:['القاعدة 2','عند جمع المعادلات، نحذف المواد المتماثلة على جانبي السهم، ونجمع قيم ΔH.']},
 {name:'تكوين ثاني أكسيد النيتروجين',mission:'المعادلة الأولى تعطي 2NO، لكنّنا نحتاج NO واحدًا فقط. جرّب الضرب في عدد.',
  target:T([[.5,'N2','g'],[1,'O2','g']],[[1,'NO2','g']]),
  given:[{r:[[1,'N2','g'],[1,'O2','g']],p:[[2,'NO','g']],dH:180.6},{r:[[1,'NO2','g']],p:[[1,'NO','g'],[.5,'O2','g']],dH:58}],
  hint:'اضرب المعادلة الأولى في ½ حتى يصبح N₂ نصف مول، ثمّ اعكس الثانية.',
  rule:['القاعدة 3','عند ضرب المعادلة في عدد، نضرب ΔH في العدد نفسه.']},
 {name:'احتراق الإيثان',mission:'استخدم القواعد الثلاث معًا: العكس والضرب والجمع.',
  target:T([[1,'C2H6','g'],[3.5,'O2','g']],[[2,'CO2','g'],[3,'H2O','l']]),
  given:[{r:[[2,'C','s'],[3,'H2','g']],p:[[1,'C2H6','g']],dH:-86},{r:[[1,'C','s'],[1,'O2','g']],p:[[1,'CO2','g']],dH:-394},{r:[[1,'H2','g'],[.5,'O2','g']],p:[[1,'H2O','l']],dH:-286}],
  hint:'C₂H₆ في المتفاعلات (اعكس الأولى)، نحتاج 2CO₂ (اضرب الثانية في 2)، و3H₂O (اضرب الثالثة في 3).',
  rule:null},
 {name:'تكوين ثاني كبريتيد الكربون',mission:'المرحلة الأخيرة: احسب حرارة تكوين CS₂ من عناصره.',
  target:T([[1,'C','s'],[2,'S','s']],[[1,'CS2','l']]),
  given:[{r:[[1,'CS2','l'],[3,'O2','g']],p:[[1,'CO2','g'],[2,'SO2','g']],dH:-1075.2},{r:[[1,'C','s'],[1,'O2','g']],p:[[1,'CO2','g']],dH:-393.5},{r:[[1,'S','s'],[1,'O2','g']],p:[[1,'SO2','g']],dH:-294}],
  hint:'CS₂ يجب أن يكون في النواتج، ونحتاج 2S في المتفاعلات.',
  rule:null}];

let cur=-1;const done=new Set();let st=[];let hintOn=false;
function dots(){const d=$('dots');d.innerHTML=[`<button type="button" data-i="-1" aria-label="البداية" ${cur===-1?'aria-current="step"':''} class="${done.has(-1)?'done':''}">★</button>`]
  .concat(LEVELS.map((L,i)=>`<button type="button" data-i="${i}" aria-label="المرحلة ${i+1}" ${cur===i?'aria-current="step"':''} class="${done.has(i)?'done':''}">${i+1}</button>`))
  .concat([`<button type="button" data-i="99" aria-label="الخلاصة" ${cur===99?'aria-current="step"':''}>✓</button>`]).join('');
  d.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i))}
function go(i){cur=i;hintOn=false;dots();if(i===-1)intro();else if(i===99)summary();else level(i);scrollTo({top:0,behavior:'smooth'})}

/* ---------- intro: two paths ---------- */
function intro(){
  $('stage').innerHTML=`<div class="intro">
   <section class="panel"><svg viewBox="0 0 560 420" role="img" aria-label="مخطط طاقة: مسار مباشر ومسار غير مباشر">
    <defs><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C2185B"/></marker></defs>
    <line x1="40" y1="395" x2="40" y2="20" stroke="#13232B" stroke-width="3"/><text x="50" y="30" font-family="IBM Plex Sans Arabic" font-weight="700" font-size="18" fill="#13232B">ΔH</text>
    <line x1="80" y1="80" x2="270" y2="80" stroke="#13232B" stroke-width="4"/><text x="175" y="65" text-anchor="middle" font-family="IBM Plex Sans Arabic" font-weight="700" font-size="17" fill="#13232B" direction="ltr">C(diamond) + O₂</text>
    <line x1="300" y1="130" x2="520" y2="130" stroke="#13232B" stroke-width="4"/><text x="410" y="118" text-anchor="middle" font-family="IBM Plex Sans Arabic" font-weight="700" font-size="17" fill="#13232B" direction="ltr">C(graphite) + O₂</text>
    <line x1="120" y1="360" x2="460" y2="360" stroke="#13232B" stroke-width="4"/><text x="290" y="390" text-anchor="middle" font-family="IBM Plex Sans Arabic" font-weight="700" font-size="17" fill="#13232B">CO₂</text>
    <g id="pD" opacity=".25"><path d="M260 86 L310 124" stroke="#E8691E" stroke-width="6" fill="none" stroke-dasharray="8 6" marker-end="url(#a1)"/><text id="tD" x="300" y="98" font-family="IBM Plex Sans Arabic" font-weight="700" font-size="17" fill="#E8691E" direction="ltr">ΔH = ?</text></g>
    <g id="p1" opacity=".25"><line x1="150" y1="88" x2="150" y2="350" stroke="#C2185B" stroke-width="5" marker-end="url(#a1)"/><text x="160" y="230" font-family="IBM Plex Sans Arabic" font-weight="700" font-size="17" fill="#C2185B" direction="ltr">−395.4 kJ</text></g>
    <g id="p2" opacity=".25"><line x1="430" y1="352" x2="430" y2="140" stroke="#C2185B" stroke-width="5" marker-end="url(#a1)"/><text x="440" y="250" font-family="IBM Plex Sans Arabic" font-weight="700" font-size="17" fill="#C2185B" direction="ltr">+393.5 kJ</text></g>
   </svg>
   <div class="row" style="margin-top:10px"><button type="button" class="btn" id="bD">المسار المباشر</button><button type="button" class="btn" id="b1">المسار غير المباشر: الخطوة 1</button><button type="button" class="btn" id="b2" disabled>الخطوة 2</button></div>
   </section>
   <section class="panel" style="display:grid;gap:14px;align-content:start">
    <div class="mission" style="padding:12px 14px;border:0"><span class="tag">مهمّة</span><p>نريد تحويل الألماس إلى جرافيت. جرّب المسارين على المخطط، ولاحظ.</p></div>
    <div id="iq" hidden><p class="q">ما مجموع التغيّر في المسار غير المباشر؟</p><div class="choices" id="c1"></div></div>
    <div id="iq2" hidden><p class="q">هل يتغيّر مقدار ΔH الكلي إذا سلكنا طريقًا مختلفًا بين البداية والنهاية نفسيهما؟</p><div class="choices" id="c2"></div></div>
    <div class="law" id="law" hidden><b>قانون هس Hess's Law</b>تساوي حرارة تفاعل كيميائي ما قيمة ثابتة، سواء حدث هذا التفاعل مباشرة خلال خطوة واحدة أو خلال عدّة خطوات، بشرط ثبات الضغط ودرجة الحرارة.</div>
    <button type="button" class="btn primary" id="toL1" hidden>ابدأ المرحلة 1 ←</button>
   </section></div>`;
  let s1=false,s2=false;
  $('bD').onclick=()=>{$('pD').setAttribute('opacity',1);$('tD').textContent='ΔH = ? (بطيء جدًا!)'};
  $('b1').onclick=()=>{$('p1').setAttribute('opacity',1);s1=true;$('b2').disabled=false};
  $('b2').onclick=()=>{$('p2').setAttribute('opacity',1);s2=true;$('iq').hidden=false};
  mc('c1',['−789 kJ','−1.9 kJ','+1.9 kJ'],1,()=>{$('tD').textContent='ΔH = −1.9 kJ';$('iq2').hidden=false});
  mc('c2',['نعم، يتغيّر حسب الطريق','لا، يبقى ثابتًا لأنّ البداية والنهاية نفسهما'],1,()=>{$('law').hidden=false;$('toL1').hidden=false;done.add(-1);dots()});
  $('toL1').onclick=()=>go(0);
}
function mc(id,opts,right,ok){const b=$(id);b.innerHTML=opts.map((o,k)=>`<button type="button" class="choice" data-k="${k}">${o.replace(/([−+]?\d[\d.]* kJ)/,'<span class="eq">$1</span>')}</button>`).join('');
  b.querySelectorAll('.choice').forEach(x=>x.onclick=()=>{if(+x.dataset.k===right){x.classList.add('right');b.querySelectorAll('.choice').forEach(y=>y.disabled=true);ok()}else x.classList.add('wrong')})}

/* ---------- puzzle level ---------- */
function level(i){const L=LEVELS[i];st=L.given.map(()=>({rev:false,m:1}));
  $('stage').innerHTML=`<div style="display:grid;gap:14px">
   <div class="mission"><span class="tag">المرحلة ${i+1}</span><p>${L.name}: ${L.mission}</p></div>
   <div class="target"><small>المعادلة المطلوبة</small>${eqHTML(L.target.r,L.target.p)}<span class="eq" style="font-size:22px">ΔH° = ?</span></div>
   <div class="cards" id="cards"></div>
   <div class="tray" aria-live="polite"><h2>صينية الجمع</h2><div class="sumline" id="sumline"></div><div class="result" id="result"></div><div class="gone" id="gone"></div><div id="status"></div></div>
   <div class="row"><button type="button" class="btn" id="hintB">تلميح</button><span id="hintT"></span></div>
   <div id="after"></div></div>`;
  $('hintB').onclick=()=>{$('hintT').innerHTML=`<span class="hint">${L.hint}</span>`};
  renderCards(i,-1);update(i)}
function cardEq(g,s){const sgn=s.rev?-1:1;const r=(s.rev?g.p:g.r).map(([c,f,x])=>[c*s.m,f,x]);const p=(s.rev?g.r:g.p).map(([c,f,x])=>[c*s.m,f,x]);return {r,p,dH:g.dH*s.m*sgn}}
function renderCards(i,flipIdx){const L=LEVELS[i];$('cards').innerHTML=L.given.map((g,k)=>{const s=st[k],e=cardEq(g,s);
  const notes=[s.rev?'معكوسة: انعكست إشارة ΔH':'',s.m!==1?`مضروبة في ${s.m===.5?'½':s.m}`:''].filter(Boolean).join(' · ');
  return `<div class="card ${s.rev?'rev':''} ${s.m!==1?'mul':''}" id="cd${k}"><div class="no">${k+1}</div>
   <div class="body ${k===flipIdx?'flipin':''}"><div class="eqw">${eqHTML(e.r,e.p)}</div><div class="dh">${dHHTML(e.dH)}</div><div class="note">${notes}</div></div>
   <div class="ctrls"><button type="button" class="rv" data-k="${k}" aria-pressed="${s.rev}">⇄ اعكس</button>
    <div class="seg" role="group" aria-label="اضرب في">${[.5,1,2,3].map(m=>`<button type="button" data-k="${k}" data-m="${m}" aria-pressed="${s.m===m}">×${m===.5?'½':m}</button>`).join('')}</div></div></div>`}).join('');
  $('cards').querySelectorAll('.rv').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;st[k].rev=!st[k].rev;renderCards(i,k);update(i)});
  $('cards').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;st[k].m=+b.dataset.m;renderCards(i,k);update(i)})}
function update(i){const L=LEVELS[i];const net=new Map(),touched=new Map();let dH=0;const parts=[];
  L.given.forEach((g,k)=>{const e=cardEq(g,st[k]);dH+=e.dH;parts.push(e.dH);
    e.r.forEach(([c,f,s])=>{const K=key(f,s);net.set(K,(net.get(K)||0)-c);touched.set(K,[f,s])});
    e.p.forEach(([c,f,s])=>{const K=key(f,s);net.set(K,(net.get(K)||0)+c);touched.set(K,[f,s])})});
  const R=[],Pp=[],gone=[];touched.forEach(([f,s],K)=>{const n=net.get(K);if(Math.abs(n)<1e-9)gone.push([1,f,s]);else if(n<0)R.push([-n,f,s]);else Pp.push([n,f,s])});
  const tn=new Map();L.target.r.forEach(([c,f,s])=>tn.set(key(f,s),-c));L.target.p.forEach(([c,f,s])=>tn.set(key(f,s),c));
  const keys=new Set([...tn.keys(),...[...net.keys()].filter(k=>Math.abs(net.get(k))>1e-9)]);
  let ok=true;keys.forEach(k=>{if(Math.abs((net.get(k)||0)-(tn.get(k)||0))>1e-9)ok=false});
  $('sumline').innerHTML=`<span class="eq">ΔH° = ${parts.map(v=>'('+num(v)+')').join(' + ')} = ${num(dH)} kJ</span>`;
  $('result').innerHTML=`<div style="font-weight:700;color:var(--muted);font-size:15px">المعادلة الناتجة بعد الجمع:</div>${R.length||Pp.length?eqHTML(R,Pp):'—'}`;
  $('gone').innerHTML=gone.length?`حُذفت لأنّها متماثلة على الجانبين: ${gone.map(t=>`<span class="eq">${term(t)}</span>`).join('')}`:'';
  const s=$('status');
  if(ok){s.className='status ok';s.innerHTML=`أحسنت! وصلت إلى المعادلة المطلوبة: <span class="eq">ΔH° = ${num(dH)} kJ</span>`;
    if(!done.has(i)){done.add(i);dots();confetti()}
    $('after').innerHTML=(L.rule?`<div class="rule"><b>✓ اكتشفت ${L.rule[0]}</b><p>${L.rule[1]}</p></div>`:'')+`<div class="row" style="margin-top:12px"><button type="button" class="btn primary" id="nx">${i<LEVELS.length-1?'المرحلة التالية ←':'الخلاصة ←'}</button></div>`;
    $('nx').onclick=()=>go(i<LEVELS.length-1?i+1:99)}
  else{s.className='status no';s.textContent='المعادلة الناتجة لا تطابق المعادلة المطلوبة بعد. استخدم «اعكس» و«اضرب» حتى تتطابق.';$('after').innerHTML=''}}

/* ---------- summary ---------- */
function summary(){$('stage').innerHTML=`<div style="display:grid;gap:14px">
  <div class="law"><b>قانون هس للجمع الحراري</b>تساوي حرارة تفاعل كيميائي ما قيمة ثابتة، سواء حدث مباشرة خلال خطوة واحدة أو خلال عدّة خطوات. عندما نجمع المعادلات الكيميائية الحرارية لنحصل على المعادلة النهائية، نجمع أيضًا قيم ΔH لنحصل على حرارة التفاعل النهائية.</div>
  <div class="rules"><div><span>1.</span> رتّب المعادلات بحيث تكون المواد في الجهة نفسها التي هي فيها في المعادلة المطلوبة.</div>
   <div><span>2.</span> عند عكس المعادلة، نعكس إشارة ΔH.</div><div><span>3.</span> عند ضرب المعادلة في عدد، نضرب ΔH في العدد نفسه.</div>
   <div><span>4.</span> نجمع المعادلات، ونحذف المواد المتماثلة على جانبي السهم، ونجمع قيم ΔH.</div></div>
  <div class="mission"><span class="tag">الآن</span><p>طبّق القواعد بنفسك في ورقة العمل.</p></div></div>`;
  const all=LEVELS.every((_,i)=>done.has(i));if(all)confetti()}

/* ---------- confetti ---------- */
function confetti(){const c=$('fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const C=['#E8691E','#1C7FC4','#1E9E57','#F2B705','#0E8F9E'];const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,v:2+Math.random()*4,s:5+Math.random()*7,a:Math.random()*6,c:C[Math.floor(Math.random()*5)]}));
  let f=0;(function d(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x+Math.sin(p.a)*8,p.y);x.rotate(p.a);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<200)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})()}

go(-1);
</script>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الترتيب الإلكتروني والرابطة الأيونية · كتاب حي</title>
<style>
:root{--ink:#17324d;--sea:#1a6fa8;--sky:#cfeefc;--paper:#fffdf7;--gold:#f2b134;--red:#e5484d;--green:#2ea56b;--mute:#6c7f95;--line:#c9dceb}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Naskh Arabic","Traditional Arabic",Tahoma,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 30% 10%,#eaf7ff,#8cc4e8 60%,#3f7fb0);overflow:hidden}
.f{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-weight:600;white-space:nowrap}
sub,sup{font-size:.7em;line-height:0}
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,.22);flex-wrap:wrap;color:#fff}
.bar h1{font-size:16px;margin:0 4px 0 0;flex:1;min-width:200px;text-shadow:0 1px 3px #0006}
.bar .pos{font-weight:700;min-width:60px;text-align:center}
.btn{font:inherit;font-size:14px;border:0;border-radius:10px;padding:7px 14px;background:#fff;color:var(--sea);cursor:pointer;box-shadow:0 2px 0 #0002}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--sea);color:#fff}
.btn.g{background:#eef6fc;color:var(--sea);border:1px solid var(--line);box-shadow:none}
select,input,textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;color:var(--ink)}
input.inp{width:96px;text-align:center;direction:ltr}
.t input.inp{width:74px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;perspective:2200px;min-height:0;overflow:auto}
.book{width:min(1200px,100%);height:100%;max-height:840px;position:relative}
.spread{display:flex;height:100%;border-radius:12px;box-shadow:0 28px 60px #0a2a4a55,0 2px 0 #fff8;transform-style:preserve-3d}
.pg{flex:1;min-width:0;background:var(--paper);padding:20px 24px 12px;overflow:auto;display:flex;flex-direction:column;gap:11px}
.pg.r{border-radius:0 12px 12px 0;box-shadow:inset 26px 0 28px -22px #0003}
.pg.l{border-radius:12px 0 0 12px;box-shadow:inset -26px 0 28px -22px #0003}
.spread.af .pg.r{animation:fF .75s cubic-bezier(.2,.7,.2,1) both;transform-origin:left center}
.spread.ab .pg.l{animation:fB .75s cubic-bezier(.2,.7,.2,1) both;transform-origin:right center}
@keyframes fF{from{transform:rotateY(-78deg);opacity:.15}to{transform:none;opacity:1}}
@keyframes fB{from{transform:rotateY(78deg);opacity:.15}to{transform:none;opacity:1}}
.lh{align-self:flex-start;font-size:12.5px;color:#fff;background:linear-gradient(90deg,var(--sea),#3b97cf);padding:4px 12px;border-radius:8px}
h2{margin:2px 0;font-size:21px;color:var(--sea)}
h2.huge{font-size:34px;line-height:1.5}
h3{margin:2px 0;font-size:16px}
p{margin:2px 0;line-height:1.9;font-size:15.5px}
ul.goals{margin:0;padding-right:20px;line-height:1.9;font-size:15px}
.box{border:1px solid var(--line);background:#f4fbff;border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.8}
.box.info{background:#fffbea;border-color:#f3dd8a;min-height:52px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:13.5px;color:var(--mute)}
.foot{margin-top:auto;font-size:11px;color:var(--mute);display:flex;justify-content:space-between;padding-top:6px;border-top:1px dashed var(--line);opacity:.85}
.msg{font-size:14px;min-height:22px;font-weight:600}
.msg.ok{color:var(--green)}.msg.no{color:var(--red)}
.good{background:#e7f8ef!important;border-color:var(--green)!important}
.bad{background:#fde8e8!important;border-color:var(--red)!important}
.hint{display:none;background:#fff8e1;border-right:4px solid var(--gold);padding:7px 10px;border-radius:8px;font-size:14px;margin-top:6px}
.hint.on{display:block}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t td,table.t th{border:1px solid var(--line);padding:6px 4px;text-align:center}
table.t th{background:#e9f5fd;font-weight:700}
.pt{display:grid;grid-template-columns:repeat(18,1fr);gap:4px;direction:ltr}
.pt button{aspect-ratio:1;font:inherit;font-weight:700;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--sea);cursor:pointer;font-size:11.5px;padding:0;transition:transform .15s,box-shadow .15s}
.pt button:hover{transform:translateY(-3px);box-shadow:0 6px 12px #1a6fa833}
.pt button.sel{background:var(--gold);color:#222;border-color:#c98a00}
.mcq{display:flex;flex-wrap:wrap;gap:7px}
.mcq button{font:inherit;font-size:14.5px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
.mcq button.ok{background:#e7f8ef;border-color:var(--green)}
.mcq button.no{background:#fde8e8;border-color:var(--red)}
.dot{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#1c3f66 70%);box-shadow:0 2px 3px #0004;display:inline-block;margin:1px}
.lw{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;gap:6px;width:270px;margin:6px auto;align-items:center;justify-items:center}
.lw .sym{grid-area:2/2;font-size:40px;font-weight:800;color:var(--sea);direction:ltr}
.lw .side{min-height:38px;min-width:90px;display:flex;gap:6px;justify-content:center;align-items:center;cursor:pointer;border:1px dashed #9ab;border-radius:10px;padding:4px;background:#fff;flex-wrap:wrap}
.lw .side.l,.lw .side.r{flex-direction:column;min-width:44px;min-height:90px}
.lw .side.t{grid-area:1/2}.lw .side.b{grid-area:3/2}.lw .side.l{grid-area:2/1}.lw .side.r{grid-area:2/3}
.lwtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.shells{display:flex;gap:8px;flex-wrap:wrap}
.shl{display:flex;flex-direction:column;align-items:center;justify-content:center;width:70px;height:62px;border-radius:50%;border:2px solid var(--sea);background:#eef8ff;font-size:12px}
.shl b{font-size:20px;direction:ltr}
.bld-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bld{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;display:flex;flex-direction:column;gap:6px}
.bld .row{gap:4px;flex-direction:column;align-items:stretch}
.bld .row>span{font-size:12px;color:var(--mute)}
.stt{font-weight:700;font-size:14px}.stt.ok{color:var(--green)}.stt.no{color:var(--red)}
.c3{width:100%;height:250px;touch-action:none;cursor:grab;border-radius:14px;background:radial-gradient(circle at 50% 40%,#ffffff,#d8eefa);display:block}
.c3:active{cursor:grabbing}
.bar2{height:20px;border-radius:10px;background:linear-gradient(90deg,#2a8fd6,#1a6fa8);margin:3px 0;width:var(--w)}
.tr{position:relative;height:210px;border-radius:14px;background:linear-gradient(#f3fbff,#dff0fb);overflow:hidden}
.atom{position:absolute;top:50px;width:118px;height:118px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:left .9s ease;font-weight:800;color:#fff;text-shadow:0 1px 2px #0007;font-size:22px}
.atom small{font-size:12px;font-weight:600}
.atom.na{left:8%;background:radial-gradient(circle at 35% 30%,#fff3c4,#f2b134 55%,#b87500)}
.atom.cl{left:64%;background:radial-gradient(circle at 35% 30%,#dfffee,#2ea56b 55%,#136b43)}
.tr[data-s="3"] .atom.na{left:28%}
.tr[data-s="3"] .atom.cl{left:56%}
.atom .q{position:absolute;top:-6px;right:-4px;font-size:20px;color:#17324d;background:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .5s}
.tr[data-s="2"] .q,.tr[data-s="3"] .q{opacity:1}
.e{position:absolute;top:104px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#1a6fa8);box-shadow:0 0 10px #1a6fa8;transition:left 1s ease,opacity .4s;left:21%}
.tr[data-s="1"] .e{left:72%}
.tr[data-s="2"] .e,.tr[data-s="3"] .e{left:72%;opacity:0}
.tr .bond{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:17px;font-weight:700;opacity:0;transition:opacity .6s}
.tr[data-s="3"] .bond{opacity:1}
.ionlab{position:relative;height:150px;border-radius:14px;background:linear-gradient(#f3fbff,#dff0fb);overflow:hidden}
.ion{position:absolute;top:44px;width:82px;height:82px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;transition:left .15s linear}
.ion.na2{left:5%;background:radial-gradient(circle at 35% 30%,#fff3c4,#f2b134 55%,#b87500)}
.ion.cl2{left:40%;background:radial-gradient(circle at 35% 30%,#dfffee,#2ea56b 55%,#136b43)}
.meter{height:16px;border-radius:9px;background:#e6eef5;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f2b134,#e5484d);transition:width .2s}
.steps .st{display:none}.steps .st.on{display:block}
.stepcard{border-inline-start:4px solid var(--gold);padding:8px 12px;background:#fffdf3;border-radius:8px;font-size:15px;line-height:1.8}
.lab{display:flex;gap:10px;justify-content:space-between}
.beakerbox{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.beaker{width:118px;height:124px;border:3px solid #7aa;border-top:none;border-radius:6px 6px 26px 26px;position:relative;overflow:hidden;background:#fff}
.liquid{position:absolute;bottom:0;left:0;right:0;height:0;background:linear-gradient(#cdeeff,#7cc6ee);transition:height .9s}
.liquid.on{height:62%}
.solid{position:absolute;bottom:4px;left:22px;width:74px;height:34px;border-radius:8px;background:repeating-linear-gradient(45deg,#e9eef2 0 6px,#d3dbe3 6px 12px);box-shadow:inset 0 0 0 1px #aab}
.solid.gone{opacity:.15;transition:opacity .8s}
.circ{position:relative;height:150px;border:3px solid #6a7f95;border-radius:16px;margin:8px 6px;transition:border-color .4s}
.circ.live{border-color:var(--gold);border-style:dashed}
.circ .sw{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);background:#fff;padding:0 4px;font-size:12px}
.bulb{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;background:#dfe6ee;box-shadow:inset 0 0 0 2px #9aa;transition:.35s}
.bulb.lit{background:#ffe066;box-shadow:0 0 26px 10px #ffe06699}
.bat{position:absolute;right:-10px;top:52px;width:20px;height:44px;border-radius:4px;background:linear-gradient(#f4c35a,#c88a10);box-shadow:0 0 0 2px #666}
.track{position:absolute;left:0;right:0;height:0}
.run{position:absolute;top:64px;width:9px;height:9px;border-radius:50%;background:var(--gold);opacity:0;animation:run 1.4s linear infinite}
.circ.live .run{opacity:1}
.circ.live .run:nth-child(2){animation-delay:.45s}.circ.live .run:nth-child(3){animation-delay:.9s}
@keyframes run{from{left:6%}to{left:88%}}
.steps2 .cell{display:none}
@media (max-width:860px){
  .spread{flex-direction:column;height:auto}
  .book{height:auto}
  .pg.r{border-radius:12px 12px 0 0;box-shadow:none}
  .pg.l{border-radius:0 0 12px 12px;box-shadow:none}
  .pg{min-height:auto}
  .spread.af .pg.r,.spread.ab .pg.l{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>الكتاب الحي · الترتيب الإلكتروني والرابطة الأيونية</h1>
    <select id="toc" aria-label="الانتقال إلى"></select>
    <button class="btn" id="prev">→ السابق</button>
    <span class="pos" id="pos"></span>
    <button class="btn" id="next">التالي ←</button>
  </header>
  <main class="stage"><div class="book" id="book"></div></main>
</div>

<script>
/* ---------- بيانات وحسابات الكيمياء ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const EL=[
{z:1,s:'H',n:'هيدروجين',g:1,p:1},{z:2,s:'He',n:'هيليوم',g:18,p:1},
{z:3,s:'Li',n:'ليثيوم',g:1,p:2},{z:4,s:'Be',n:'بيريليوم',g:2,p:2},{z:5,s:'B',n:'بورون',g:13,p:2},{z:6,s:'C',n:'كربون',g:14,p:2},{z:7,s:'N',n:'نيتروجين',g:15,p:2},{z:8,s:'O',n:'أكسجين',g:16,p:2},{z:9,s:'F',n:'فلور',g:17,p:2},{z:10,s:'Ne',n:'نيون',g:18,p:2},
{z:11,s:'Na',n:'صوديوم',g:1,p:3},{z:12,s:'Mg',n:'مغنيسيوم',g:2,p:3},{z:13,s:'Al',n:'ألومنيوم',g:13,p:3},{z:14,s:'Si',n:'سيليكون',g:14,p:3},{z:15,s:'P',n:'فوسفور',g:15,p:3},{z:16,s:'S',n:'كبريت',g:16,p:3},{z:17,s:'Cl',n:'كلور',g:17,p:3},{z:18,s:'Ar',n:'أرجون',g:18,p:3},
{z:19,s:'K',n:'بوتاسيوم',g:1,p:4},{z:20,s:'Ca',n:'كالسيوم',g:2,p:4}];
const byS=Object.fromEntries(EL.map(e=>[e.s,e]));
const EN={Li:1.0,Na:0.9,K:0.8,Mg:1.2,Ca:1.0,F:4.0,O:3.5,Cl:3.0,N:3.0,S:2.5};
const METALS=['Li','Na','K','Mg','Ca','Al'];
const NONMET=['F','Cl','O','S','N'];
const ANION_AR={F:'فلوريد',Cl:'كلوريد',O:'أكسيد',S:'كبريتيد',N:'نيتريد'};
const METAL_AR={Li:'الليثيوم',Na:'الصوديوم',K:'البوتاسيوم',Mg:'المغنيسيوم',Ca:'الكالسيوم',Al:'الألومنيوم'};

function config(z){const cap=[2,8,8];let left=z;const out=[];for(let i=0;i<3&&left>0;i++){const k=Math.min(cap[i],left);out.push(k);left-=k}if(left>0)out.push(left);return out}
function valence(z){return config(z).at(-1)}
function valency(z){const v=valence(z);if(z===1)return 1;if(z===2||v===8)return 0;if(v===4)return 4;return v<=3?v:8-v}
function charge(z){const v=valence(z);if(z<=2||v===8||v===4)return 0;return v<=3?v:v-8}
const gcd=(a,b)=>b?gcd(b,a%b):a;
const subn=n=>n>1?`<sub>${n}</sub>`:'';
function formulaHTML(m,x){const a=charge(m.z),b=-charge(x.z),g=gcd(a,b);return `<span class="f">${m.s}${subn(b/g)}${x.s}${subn(a/g)}</span>`}
function formulaText(m,x){const a=charge(m.z),b=-charge(x.z),g=gcd(a,b);return `${m.s}${b/g>1?b/g:''}${x.s}${a/g>1?a/g:''}`}
function ionHTML(sym,q){return `<span class="f">${sym}<sup>${Math.abs(q)>1?Math.abs(q):''}${q>0?'+':'−'}</sup></span>`}
const norm=s=>String(s).replace(/[\s‏‎]/g,'').replace('،',',').replace(/[₀-₉]/g,c=>String(c.charCodeAt(0)-0x2080)).replace(/⁺/g,'+').replace(/⁻/g,'-').replace(/−/g,'-').toLowerCase();
const optsSym=sel=>EL.map(e=>`<option value="${e.s}" ${e.s===sel?'selected':''}>${e.s} — ${e.n}</option>`).join('');
const optsZ=sel=>EL.map(e=>`<option value="${e.z}" ${e.z===sel?'selected':''}>${e.z} · ${e.s} (${e.n})</option>`).join('');
const optsList=(list,sel)=>list.map(s=>`<option value="${s}" ${s===sel?'selected':''}>${s} — ${byS[s].n}</option>`).join('');
const ptHTML=()=>`<div class="pt">${EL.map(e=>`<button data-s="${e.s}" style="grid-column:${e.g};grid-row:${e.p}">${e.s}</button>`).join('')}</div>`;
const foot=label=>`<div class="foot"><span>إعداد: نقطتين ميم دوت · أنوار الفضلي</span><span>${label}</span></div>`;

/* ---------- محرك ثلاثي الأبعاد على Canvas ---------- */
const scenes=[];
function makeScene(cv,frame,o={}){
  const s={cv,ctx:cv.getContext('2d'),rx:o.rx??-.35,ry:o.ry??.5,auto:o.auto??.004,span:o.span??4.4,frame,dragging:false,px:0,py:0,dpr:Math.min(2,window.devicePixelRatio||1)};
  cv.addEventListener('pointerdown',e=>{s.dragging=true;s.px=e.clientX;s.py=e.clientY;cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{if(!s.dragging)return;s.ry+=(e.clientX-s.px)*.01;s.rx+=(e.clientY-s.py)*.01;s.px=e.clientX;s.py=e.clientY});
  const stop=()=>s.dragging=false;cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);
  scenes.push(s);return s;
}
function P(s,x,y,z){
  const cy=Math.cos(s.ry),sy=Math.sin(s.ry),cx=Math.cos(s.rx),sx=Math.sin(s.rx);
  const x1=x*cy+z*sy,z1=-x*sy+z*cy;
  const y1=y*cx-z1*sx,z2=y*sx+z1*cx;
  const k=6/(6+z2);
  return{X:s.w/2+x1*s.sc*k,Y:s.h/2+y1*s.sc*k,z:z2,k};
}
function ball(c,X,Y,r,[a,b]){const g=c.createRadialGradient(X-r*.35,Y-r*.35,r*.1,X,Y,r);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;c.beginPath();c.arc(X,Y,Math.max(r,1),0,Math.PI*2);c.fill()}
function resize(s){
  const r=s.cv.getBoundingClientRect();const w=Math.max(10,Math.floor(r.width)),h=Math.max(10,Math.floor(r.height));
  if(s.cv.width!==Math.floor(w*s.dpr)||s.cv.height!==Math.floor(h*s.dpr)){s.cv.width=Math.floor(w*s.dpr);s.cv.height=Math.floor(h*s.dpr)}
  s.w=w;s.h=h;s.sc=Math.min(w,h)/s.span;
}
function loop(t){
  for(let i=scenes.length-1;i>=0;i--){
    const s=scenes[i];
    if(!s.cv.isConnected){scenes.splice(i,1);continue}
    if(!s.dragging)s.ry+=s.auto;
    resize(s);
    s.ctx.setTransform(s.dpr,0,0,s.dpr,0,0);s.ctx.clearRect(0,0,s.w,s.h);
    s.frame(s,t/1000);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function atomFrame(s,t){
  const c=s.ctx,sh=config(s.Z),lines=[],items=[];
  sh.forEach((n,i)=>{
    const R=.55+i*.55,tilt=.5*i+.3,out=i===sh.length-1;
    const ring=[];for(let a=0;a<=72;a++){const th=a/72*Math.PI*2;ring.push(P(s,R*Math.cos(th),R*Math.sin(th)*Math.sin(tilt),R*Math.sin(th)*Math.cos(tilt)))}
    lines.push({pts:ring,col:out?'rgba(242,177,52,.95)':'rgba(26,111,168,.35)',w:out?2.6:1.2});
    for(let j=0;j<n;j++){
      const th=t*(2.4/(i+1))+j*2*Math.PI/n;
      items.push({p:P(s,R*Math.cos(th),R*Math.sin(th)*Math.sin(tilt),R*Math.sin(th)*Math.cos(tilt)),col:out?['#fff','#d98a00']:['#ffffff','#1a6fa8']});
    }
  });
  const nuc=[[.12,.12,.1],[-.12,-.12,.1],[.12,-.12,-.1],[-.12,.12,-.1]].map(([x,y,z])=>({p:P(s,x,y,z),col:['#ffb3b3','#c81e1e'],nuc:1}));
  lines.forEach(L=>{c.beginPath();c.strokeStyle=L.col;c.lineWidth=L.w;L.pts.forEach((p,i)=>i?c.lineTo(p.X,p.Y):c.moveTo(p.X,p.Y));c.stroke()});
  [...items,...nuc].sort((a,b)=>b.p.z-a.p.z).forEach(it=>{
    const r=(it.nuc?.2:.14)*s.sc*it.p.k;
    ball(c,it.p.X,it.p.Y,r,it.nuc?it.col:it.col);
  });
  c.fillStyle='#17324d';c.font='600 14px Segoe UI,Tahoma,sans-serif';
  c.fillText(`Z = ${s.Z}   ·   ${sh.join(' , ')}`,12,22);
}

function latFrame(s,t){
  const c=s.ctx;
  s.amp+=((s.mode==='solid'?.05:.7)-s.amp)*.06;
  s.bondA+=((s.mode==='solid'?1:0)-s.bondA)*.08;
  const pts=s.base.map((b,id)=>{
    const ph=id*1.7,a=s.amp;
    const x=b.i+a*Math.sin(t*2.3+ph),y=b.j+a*Math.cos(t*1.9+ph*1.3),z=b.k+a*Math.sin(t*2.7+ph*.7);
    return{p:P(s,x,y,z),cat:Math.abs(b.i+b.j+b.k)%2===0};
  });
  if(s.bondA>.02){
    c.strokeStyle=`rgba(70,90,120,${.55*s.bondA})`;c.lineWidth=2.2;
    s.pairs.forEach(([a,b])=>{c.beginPath();c.moveTo(pts[a].p.X,pts[a].p.Y);c.lineTo(pts[b].p.X,pts[b].p.Y);c.stroke()});
  }
  pts.map((q,i)=>({q,i})).sort((a,b)=>b.q.p.z-a.q.p.z).forEach(({q})=>{
    ball(c,q.p.X,q.p.Y,.34*s.sc*q.p.k,q.cat?['#fff6b0','#d89600']:['#c9ffe0','#1d8a57']);
  });
  c.font='600 13px Segoe UI,Tahoma,sans-serif';c.fillStyle='#8a5a00';c.fillText('● Na⁺',12,22);c.fillStyle='#1d8a57';c.fillText('● Cl⁻',80,22);
}

function mountScenes(root){
  const made=[];
  $$('canvas[data-scene]',root).forEach(cv=>{
    if(cv.dataset.scene==='atom'){
      const s=makeScene(cv,atomFrame,{span:4.4,ry:.5,rx:-.35,auto:.005});
      s.Z=+cv.dataset.z||6;
      const sel=root.querySelector('.atomsel');
      if(sel){s.Z=+sel.value;sel.onchange=()=>{s.Z=+sel.value}}
    }else if(cv.dataset.scene==='lattice'){
      const s=makeScene(cv,latFrame,{span:4.4,ry:.6,rx:-.3,auto:.004});
      s.mode=cv.dataset.mode||'solid';s.amp=s.mode==='solid'?.05:.7;s.bondA=s.mode==='solid'?1:0;
      s.base=[];for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)for(let k=-1;k<=1;k++)s.base.push({i,j,k});
      s.pairs=[];
      for(let a=0;a<27;a++)for(let b=a+1;b<27;b++){const A=s.base[a],B=s.base[b];if(Math.abs(A.i-B.i)+Math.abs(A.j-B.j)+Math.abs(A.k-B.k)===1)s.pairs.push([a,b])}
      made.push(s);
    }
  });
  $$('[data-latmode]',root).forEach(btn=>btn.onclick=()=>{
    const v=btn.dataset.latmode,lit=v!=='solid';
    made.forEach(s=>s.mode=lit?'molten':'solid');
    $$('[data-latmode]',root).forEach(b=>b.classList.toggle('p',b===btn));
    $$('.bulb',root).forEach(x=>x.classList.toggle('lit',lit));
    $$('.circ',root).forEach(x=>x.classList.toggle('live',lit));
    $$('[data-state]',root).forEach(x=>x.textContent=btn.dataset.desc);
  });
}

<p>الهدف: الكشف عن المركبات الأيونية عمليًا. <b>توقّع أولًا:</b> أي العينتين ستوصل التيار بعد إذابتها؟</p>

 <div class="beakerbox" data-bk="A"><div class="beaker"><div class="liquid"></div><div class="solid"></div></div><b>العينة A</b>
  <div class="row"><button class="btn g" data-water>أضف الماء</button><button class="btn g" data-pick>القطب هنا</button></div></div>
 <div class="beakerbox" data-bk="B"><div class="beaker"><div class="liquid"></div><div class="solid"></div></div><b>العينة B</b>

</div>

</div>
<p class="note">الخطوات: أضف الماء للعينة، ضع القطبين فيها، ثم أغلق الدائرة وسجّل ملاحظتك.</p>
${foot('')}`,
`<span class="lh">سجّل مشاهدتك</span>
<h2>جدول النتائج</h2>
<div class="box" data-box>
<table class="t"><tr><th>وجه المقارنة</th><th>الحالة الفيزيائية</th><th>الذوبان في الماء</th><th>التوصيل الكهربائي</th></tr>
<tr><th>A</th><td><select data-ans="صلبة"><option value="">اختر</option><option>صلبة</option><option>سائلة</option></select></td><td><select data-ans="يذوب"><option value="">اختر</option><option>يذوب</option><option>لا يذوب</option></select></td><td><select data-ans="يوصل"><option value="">اختر</option><option>يوصل</option><option>لا يوصل</option></select></td></tr>

<div class="row" style="margin-top:8px"><button class="btn p" data-check>تحقق</button><button class="btn g" data-hint>تلميح</button></div>
<div class="hint">المركب الأيوني يوصل التيار عندما يذوب ويتحرك أيوناته في المحلول.</div>
<div class="msg"></div></div>
<div class="box" data-box>
<b>الاستنتاج:</b>
<p>المركب الأيوني يوجد في الحالة <select data-ans="صلبة"><option value="">...</option><option>صلبة</option><option>سائلة</option></select>، ويكون محلولًا عند <select data-ans="الذوبان في الماء"><option value="">...</option><option>الذوبان في الماء</option><option>التبريد</option></select>، ومحلوله <select data-ans="يوصل"><option value="">...</option><option>يوصل</option><option>لا يوصل</option></select> التيار الكهربائي.</p>
<p>المركب الأيوني من العينتين هو المركب الذي له الرمز <select data-ans="A"><option value="">...</option><option>A</option><option>B</option></select>.</p>
<div class="row"><button class="btn p" data-check>تحقق</button></div><div class="msg"></div></div>
${foot('')}`,
(root)=>{bindLab(root)});

sp('الدرس 1-3 · الشبكة البلورية',
`<span class="lh">الحالة الفيزيائية</span>
<h2>الشبكة البلورية لكلوريد الصوديوم</h2>
<p class="note">اسحب المجسم لتدويره. اختر الحالة لترى كيف تتحرك الأيونات.</p>
<canvas class="c3" data-scene="lattice" data-mode="solid" style="height:300px"></canvas>
<div class="row"><button class="btn p" data-latmode="solid" data-desc="الحالة الصلبة: الأيونات مرتبة ومتماسكة في الشبكة، والروابط قوية.">صلب</button><button class="btn g" data-latmode="molten" data-desc="الحالة المصهورة: الأيونات حرة الحركة بعد تفكك الشبكة.">مصهور</button></div>
<div class="box" data-state>الحالة الصلبة: الأيونات مرتبة ومتماسكة في الشبكة، والروابط قوية.</div>
${foot('')}`,
`<span class="lh">درجة الانصهار والغليان</span>
<h2>لماذا ترتفع درجة الانصهار؟</h2>
<p>كلما زادت قوة التجاذب بين الأيونات ارتفعت درجة الانصهار والغليان.</p>
<table class="t"><tr><th>المركب</th><th>الانصهار (°C)</th><th>الغليان (°C)</th></tr>
<tr><td><span class="f">NaCl</span></td><td>801</td><td>1413</td></tr>
<tr><td><span class="f">MgO</span></td><td>2852</td><td>3600</td></tr></table>
<div class="box"><b>مقارنة بالأعمدة (الانصهار):</b>
<div style="direction:ltr;text-align:left"><span class="f">NaCl</span><div class="bar2" style="--w:22%"></div><span class="f">MgO</span><div class="bar2" style="--w:79%"></div></div></div>
<div class="box" data-box><p>أي المركبين له درجة انصهار أعلى؟</p>
<div class="mcq" data-ans="MgO" data-good="✓ MgO لأن الفرق في السالبية أكبر ⇒ تجاذب أقوى."><button data-v="NaCl">NaCl</button><button data-v="MgO">MgO</button></div><div class="msg"></div></div>
${foot('')}`,
(root)=>{});

sp('الدرس 1-3 · التوصيل الكهربائي',
`<span class="lh">التوصيل الكهربائي</span>
<h2>من يحمل التيار؟</h2>
<p>التوصيل يتطلب أيونات حرة الحركة. اختر حالة المادة وراقب المصباح وحركة الحاملات.</p>
<div class="row"><button class="btn p" data-latmode="solid" data-desc="صلب: الأيونات مقيدة في الشبكة، لذا لا يمر تيار.">صلب</button><button class="btn g" data-latmode="molten" data-desc="مصهور: الأيونات حرة فتحمل التيار.">مصهور</button><button class="btn g" data-latmode="solution" data-desc="محلول مائي: الأيونات تتحرك في الماء فتوصل التيار.">محلول</button></div>
<canvas class="c3" data-scene="lattice" data-mode="solid" style="height:200px"></canvas>
<div class="circ"><div class="bulb"></div><div class="bat"></div><span class="run"></span><span class="run"></span><span class="run"></span></div>
<div class="box" data-state>صلب: الأيونات مقيدة في الشبكة، لذا لا يمر تيار.</div>
${foot('')}`,
`<span class="lh">تمارين الدرس</span>
<h2>طبّق وحلّل</h2>
<div class="box" data-box>
<p><b>(1)</b> اكتب أكبر عدد من صيغ المركبات الأيونية الممكن تكوينها من: Na, Mg, F, Cl</p>
<div class="row"><input class="inp" placeholder="..."><input class="inp" placeholder="..."><input class="inp" placeholder="..."><input class="inp" placeholder="..."></div>
<div class="row"><button class="btn p" data-setcheck="NaF|NaCl|MgF2|MgCl2">تحقق</button><button class="btn g" data-hint>تلميح</button></div>
<div class="hint">كل فلز (Na أو Mg) يرتبط بكل لافلز (F أو Cl)، وتكتب الصيغة بالتبادل.</div>
<div class="msg"></div></div>
<div class="box" data-box>
<p><b>(2)</b> رتّب المركبات من الأقل إلى الأعلى من حيث الخاصية الأيونية (الفرق في السالبية):</p>
<div class="row"><input class="inp" data-ans="MgCl2" placeholder="1"><input class="inp" data-ans="NaCl" placeholder="2"><input class="inp" data-ans="MgF2" placeholder="3"><input class="inp" data-ans="NaF" placeholder="4"></div>
<div class="row"><button class="btn p" data-check>تحقق</button><button class="btn g" data-hint>تلميح</button></div>
<div class="hint">الفروق: MgCl₂ = 1.8، NaCl = 2.1، MgF₂ = 2.8، NaF = 3.1.</div>
<div class="msg"></div></div>
<div class="box" data-box><p><b>(3)</b> أي المركبات له أكبر خاصية أيونية؟</p>
<div class="mcq" data-ans="LiF" data-good="✓ LiF: 4.0 − 1.0 = 3.0 وهو الأكبر."><button data-v="LiF">LiF</button><button data-v="MgF2">MgF₂</button><button data-v="K2O">K₂O</button><button data-v="NaCl">NaCl</button></div><div class="msg"></div></div>
<div class="box" data-box><p><b>(4)</b> الصيغة الناتجة من ارتباط Mg مع N:</p>
<div class="mcq" data-ans="Mg3N2" data-good="✓ Mg²⁺ مع N³⁻ ⇒ Mg₃N₂."><button data-v="Mg2N3">Mg₂N₃</button><button data-v="MgO">MgO</button><button data-v="Mg3N2">Mg₃N₂</button><button data-v="MgCl2">MgCl₂</button></div><div class="msg"></div></div>
<div class="box" data-box><p><b>(5)</b> قارن بين F وK: الصيغة <input class="inp" data-ans="KF" placeholder="الصيغة"> · الاسم <input class="inp" style="width:170px" data-ans="فلوريد البوتاسيوم" placeholder="الاسم"></p>
<p>درجة الانصهار: <select data-ans="مرتفعة"><option value="">اختر</option><option>منخفضة</option><option>مرتفعة</option></select> · يوصل المصهور التيار: <select data-ans="نعم"><option value="">اختر</option><option>نعم</option><option>لا</option></select></p>
<div class="row"><button class="btn p" data-check>تحقق</button></div><div class="msg"></div></div>
${foot('')}`,
(root)=>{});

/* ---------- المحرك: التنقل وتقليب الصفحات ---------- */
let cur=0;
const book=$('#book'),posEl=$('#pos'),toc=$('#toc');
toc.innerHTML=S.map((s,i)=>`<option value="${i}">${i} · ${s.title}</option>`).join('');
toc.onchange=()=>go(+toc.value,1);
$('#next').onclick=()=>go(cur+1,1);
$('#prev').onclick=()=>go(cur-1,-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(cur+1,1);if(e.key==='ArrowRight')go(cur-1,-1)});

function initCommon(root){
  bindFill(root);bindSet(root);bindHints(root);bindMcq(root);bindSteps(root);
  mountScenes(root);bindPT(root);
  $$('[data-go]',root).forEach(b=>b.onclick=()=>go(+b.dataset.go,1));
}
function show(i,dir){
  const s=S[i];
  book.innerHTML=`<section class="spread ${dir>0?'af':'ab'}"><article class="pg r">${s.r}</article><article class="pg l">${s.l}</article></section>`;
  const root=book.firstElementChild;
  initCommon(root);
  s.init&&s.init(root);
  posEl.textContent=`${i+1} / ${S.length}`;
  toc.value=i;
  history.replaceState(null,'','#'+i);
}
function go(i,dir){
  if(i<0||i>=S.length)return;
  cur=i;show(i,dir);
  book.scrollTop=0;
}
(()=>{const h=parseInt(location.hash.slice(1),10);cur=Number.isInteger(h)&&h>=0&&h<S.length?h:0;show(cur,1)})();
</script>

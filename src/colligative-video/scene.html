<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الخواص المجمعة</title>
<style>
@font-face{font-family:Cairo;font-weight:700;src:url(../../assets/fonts/cairo-arabic-700-normal.woff2)}
@font-face{font-family:Cairo;font-weight:800;src:url(../../assets/fonts/cairo-arabic-800-normal.woff2)}
@font-face{font-family:Cairo;font-weight:900;src:url(../../assets/fonts/cairo-arabic-900-normal.woff2)}
@font-face{font-family:Lalezar;src:url(../../assets/fonts/lalezar-arabic-400-normal.woff2)}
@font-face{font-family:Lalezar;src:url(../../assets/fonts/lalezar-latin-400-normal.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:Pop;font-weight:800;src:url(../../assets/fonts/poppins-latin-800-normal.woff2)}
html,body{margin:0;background:#111}
canvas{display:block;width:100vw;height:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// فيديو كرتوني قصير عن «الخواص المجمعة».
// كل إطار يُرسم من الزمن t فقط (بدون عشوائية حقيقية)، فيمكن تصديره إطاراً إطاراً.
// التشغيل في المتصفح: يعرض الفيديو مباشرة. التصدير: node src/colligative-video/render.js
const W = 1280, H = 720, S = 1.5, FPS = 30, TAU = Math.PI * 2;
const cv = document.getElementById('c');
cv.width = W * S; cv.height = H * S;
const ctx = cv.getContext('2d');

// ---------- الجدول الزمني (بالثواني) ----------
const SCENES = [
  { name: 'intro', start: 0, end: 8 },
  { name: 'idea', start: 8, end: 19 },
  { name: 'vapor', start: 19, end: 38 },
  { name: 'boil', start: 38, end: 56 },
  { name: 'freeze', start: 56, end: 74 },
  { name: 'summary', start: 74, end: 92 },
];
const DURATION = 92;

// ---------- أدوات ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const back = t => { const c1 = 1.9, c3 = c1 + 1; return t <= 0 ? 0 : 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const pop = (t, a, d = .45) => back(seg(t, a, a + d));
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const INK = '#1d2b4f';
const PAL = {
  water: { light: '#bfe6ff', fill: '#4fb3ff', dark: '#1f72c9' },
  h: { light: '#ffffff', fill: '#e9f5ff', dark: '#a9c8e6' },
  solute: { light: '#ffe2a1', fill: '#ffb238', dark: '#e07000' },
  sugar: { light: '#ffffff', fill: '#ffd6ec', dark: '#e58bb8' },
  na: { light: '#e6d4ff', fill: '#b37cff', dark: '#7445d6' },
  cl: { light: '#d2ffd9', fill: '#4fd27a', dark: '#1f9a4a' },
  ice: { light: '#ffffff', fill: '#bfefff', dark: '#6cc3e8' },
};

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---------- الشخصيات (الجزيئات الكرتونية) ----------
function ball(x, y, r, p) {
  const g = ctx.createRadialGradient(x - r * .35, y - r * .45, r * .1, x, y, r * 1.05);
  g.addColorStop(0, p.light); g.addColorStop(.5, p.fill); g.addColorStop(1, p.dark);
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = Math.max(2, r * .13); ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x - r * .38, y - r * .45, r * .22, r * .12, -.6, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fill();
}

function face(x, y, r, t, seed, mood, look) {
  const lw = Math.max(1.5, r * .09);
  ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.lineCap = 'round';
  const blink = ((t * .45 + seed * .37) % 3.3) < .13 || mood === 'sleep';
  const ex = r * .33, ey = -r * .02, ew = r * .19, eh = r * .25;
  const lx = look ? look[0] : 0, ly = look ? look[1] : 0;
  for (const s of [-1, 1]) {
    const cx = x + s * ex, cy = y + ey;
    if (blink) {
      ctx.beginPath(); ctx.moveTo(cx - ew, cy); ctx.quadraticCurveTo(cx, cy + eh * .7, cx + ew, cy); ctx.stroke();
    } else if (mood === 'happy2') {
      ctx.beginPath(); ctx.moveTo(cx - ew, cy + eh * .3); ctx.quadraticCurveTo(cx, cy - eh * .9, cx + ew, cy + eh * .3); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.ellipse(cx, cy, ew, eh, 0, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + lx * ew * .35, cy + ly * eh * .35 + eh * .1, ew * .58, 0, TAU); ctx.fillStyle = INK; ctx.fill();
      ctx.beginPath(); ctx.arc(cx + lx * ew * .35 - ew * .2, cy + ly * eh * .35 - eh * .1, ew * .2, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill();
    }
    if (mood === 'angry') {
      ctx.beginPath(); ctx.moveTo(cx - s * ew * 1.1, cy - eh * 1.5); ctx.lineTo(cx + s * ew * .9, cy - eh * 1.0); ctx.stroke();
    }
  }
  ctx.fillStyle = 'rgba(255,105,140,.45)';
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(x + s * r * .58, y + r * .28, r * .14, r * .08, 0, 0, TAU); ctx.fill(); }
  const my = y + r * .38;
  ctx.beginPath();
  if (mood === 'excited' || mood === 'hot') {
    ctx.ellipse(x, my, r * .16, r * .14, 0, 0, TAU); ctx.fillStyle = '#7a1630'; ctx.fill(); ctx.stroke();
  } else if (mood === 'cold') {
    const n = 5, w = r * .4;
    for (let i = 0; i <= n; i++) { const px = x - w / 2 + w * i / n, py = my + (i % 2 ? -1 : 1) * r * .05 + Math.sin(t * 40 + seed) * r * .02; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.stroke();
  } else if (mood === 'angry') {
    ctx.moveTo(x - r * .18, my + r * .06); ctx.quadraticCurveTo(x, my - r * .08, x + r * .18, my + r * .06); ctx.stroke();
  } else {
    ctx.arc(x, my - r * .1, r * .2, .15 * Math.PI, .85 * Math.PI); ctx.stroke();
  }
  if (mood === 'hot') { // قطرة عرق
    ctx.beginPath(); ctx.moveTo(x + r * .75, y - r * .55); ctx.quadraticCurveTo(x + r * .95, y - r * .2, x + r * .75, y - r * .15);
    ctx.quadraticCurveTo(x + r * .55, y - r * .2, x + r * .75, y - r * .55); ctx.fillStyle = '#9fe0ff'; ctx.fill(); ctx.lineWidth = lw * .7; ctx.stroke();
  }
}

// type: water | solute | sugar | na | cl
function mol(x, y, r, o = {}) {
  const t = o.t || 0, seed = o.seed || 0, type = o.type || 'water';
  const sc = o.scale === undefined ? 1 : o.scale;
  if (sc <= .01) return;
  ctx.save();
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  const shiver = o.mood === 'cold' ? Math.sin(t * 50 + seed) * r * .05 : 0;
  ctx.translate(x + shiver, y);
  ctx.rotate((o.rot || 0) + Math.sin(t * 2.2 + seed) * .08);
  ctx.scale(sc, sc * (1 + Math.sin(t * 5 + seed * 3) * .03));
  if (type === 'water') {
    const hp = o.frozen ? PAL.ice : PAL.h;
    for (const s of [-1, 1]) { const a = -Math.PI / 2 + s * .95; ball(Math.cos(a) * r * .95, Math.sin(a) * r * .95, r * .46, hp); }
    ball(0, 0, r, o.frozen ? PAL.ice : PAL.water);
  } else if (type === 'sugar') {
    ctx.save(); ctx.rotate(.12); rr(-r, -r, r * 2, r * 2, r * .35);
    const g = ctx.createLinearGradient(-r, -r, r, r); g.addColorStop(0, '#fff'); g.addColorStop(1, PAL.sugar.dark);
    ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = r * .13; ctx.strokeStyle = INK; ctx.stroke(); ctx.restore();
  } else {
    ball(0, 0, r, PAL[type]);
  }
  face(0, type === 'water' ? r * .05 : 0, r, t, seed, o.mood || 'happy', o.look);
  if (type === 'na' || type === 'cl') {
    ctx.save(); ctx.translate(r * .72, -r * .72);
    ctx.beginPath(); ctx.arc(0, 0, r * .32, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = r * .08; ctx.strokeStyle = INK; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r * .16, 0); ctx.lineTo(r * .16, 0);
    if (type === 'na') { ctx.moveTo(0, -r * .16); ctx.lineTo(0, r * .16); }
    ctx.lineWidth = r * .09; ctx.stroke(); ctx.restore();
  }
  ctx.restore();
}

// جسيمات تتجول داخل صندوق بحركة ناعمة (مواضع أساسية موزعة + تذبذب)
function makeParts(n, seed, cols) {
  const R = rng(seed), out = [];
  cols = cols || Math.ceil(Math.sqrt(n * 1.6));
  const rows = Math.ceil(n / cols);
  for (let i = 0; i < n; i++) {
    const c = i % cols, rw = Math.floor(i / cols);
    out.push({
      u: (c + .5 + (R() - .5) * .5) / cols, v: (rw + .5 + (R() - .5) * .5) / rows,
      f1: .6 + R() * .9, f2: .5 + R() * .9, p1: R() * TAU, p2: R() * TAU, seed: R() * 100,
    });
  }
  return out;
}
function wpos(p, t, box, amp = 1) {
  const u = clamp(p.u + amp * (.09 * Math.sin(t * p.f1 + p.p1) + .05 * Math.sin(t * p.f2 * 1.7 + p.p2)));
  const v = clamp(p.v + amp * (.09 * Math.cos(t * p.f2 + p.p2) + .05 * Math.sin(t * p.f1 * 1.3 + p.p1)));
  return [box.x + u * box.w, box.y + v * box.h];
}

// ---------- النصوص ----------
function txt(s, x, y, size, o = {}) {
  const font = o.font || 'Lalezar', weight = o.weight || '';
  ctx.save();
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle'; ctx.direction = o.dir || 'rtl';
  ctx.lineJoin = 'round';
  const lines = String(s).split('\n'), lh = size * (o.lh || 1.25);
  lines.forEach((ln, i) => {
    const yy = y + (i - (lines.length - 1) / 2) * lh;
    if (o.stroke !== false) {
      ctx.lineWidth = o.sw || size * .16; ctx.strokeStyle = o.stroke || INK;
      if (o.shadow !== false) { ctx.fillStyle = o.stroke || INK; ctx.strokeText(ln, x, yy + size * .07); ctx.fillText(ln, x, yy + size * .07); }
      ctx.strokeText(ln, x, yy);
    }
    ctx.fillStyle = o.color || '#fff'; ctx.fillText(ln, x, yy);
  });
  ctx.restore();
}
function measure(s, size, font = 'Lalezar', weight = '') {
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`;
  const w = Math.max(...String(s).split('\n').map(l => ctx.measureText(l).width)); ctx.restore(); return w;
}

// بطاقة نص بأسلوب الكرتون
function card(s, x, y, size, o = {}) {
  const font = o.font || 'Cairo', weight = o.weight || '900';
  const lines = String(s).split('\n').length;
  const w = measure(s, size, font, weight) + size * 1.4, h = size * 1.35 * lines + size * .7;
  ctx.save();
  ctx.translate(x, y); const sc = o.scale === undefined ? 1 : o.scale; ctx.scale(sc, sc);
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  rr(-w / 2 + 5, -h / 2 + 7, w, h, h * .32 > 26 ? 26 : h * .32); ctx.fillStyle = INK; ctx.fill();
  rr(-w / 2, -h / 2, w, h, h * .32 > 26 ? 26 : h * .32); ctx.fillStyle = o.bg || '#fff'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  txt(s, 0, size * .02, size, { font, weight, color: o.color || INK, stroke: false, lh: 1.35 });
  ctx.restore();
}

// تعليق أسفل الشاشة يظهر بين a و b
function caption(s, t, a, b, o = {}) {
  const pin = seg(t, a, a + .35), pout = seg(t, b - .3, b);
  if (pin <= 0 || pout >= 1) return;
  card(s, W / 2, (o.y || 662) + (1 - eout(pin)) * 40 + eio(pout) * 40, o.size || 27,
    { alpha: pin * (1 - pout), bg: o.bg || '#fffdf3', color: o.color });
}

function heading(s, t, color, num) {
  const p = pop(t, .15, .55);
  ctx.save(); ctx.translate(W / 2, 58); ctx.scale(p, p);
  const nw = num ? 62 : 0, w = measure(s, 50) + 70 + nw;
  rr(-w / 2 + 6, -38, w, 80, 40); ctx.fillStyle = INK; ctx.fill();
  rr(-w / 2, -44, w, 80, 40); ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
  txt(s, -nw / 2, -2, 50, { color: '#fff' });
  if (num) {
    ctx.beginPath(); ctx.arc(w / 2 - 40, -4, 28, 0, TAU); ctx.fillStyle = '#ffd84a'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
    txt(String(num), w / 2 - 40, -2, 36, { font: 'Pop', weight: '800', dir: 'ltr', color: INK, stroke: false });
  }
  ctx.restore();
}

function arrow(x1, y1, x2, y2, color, w = 8, head = 22) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [c, lw] of [[INK, w + 6], [color, w]]) {
    ctx.strokeStyle = c; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * head * .5, y2 - Math.sin(a) * head * .5); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - Math.cos(a - .5) * head, y2 - Math.sin(a - .5) * head);
  ctx.lineTo(x2 - Math.cos(a + .5) * head, y2 - Math.sin(a + .5) * head); ctx.closePath();
  ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
  ctx.restore();
}

function burst(x, y, r, t, color = '#ffd84a') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(t * .8);
  ctx.beginPath();
  for (let i = 0; i < 24; i++) { const a = i / 24 * TAU, rr2 = i % 2 ? r * .72 : r; ctx.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); }
  ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  ctx.restore();
}

// ---------- الخلفيات ----------
function background(t, c1, c2, deco = 'bubbles') {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const R = rng(7);
  for (let i = 0; i < 22; i++) {
    const x = R() * W, sp = 12 + R() * 25, r = 6 + R() * 26, ph = R() * H;
    const y = H + 40 - ((t * sp + ph) % (H + 80));
    ctx.beginPath();
    if (deco === 'snow') {
      const sy = ((t * sp * 1.4 + ph) % (H + 80)) - 40, sx = x + Math.sin(t + i) * 20;
      ctx.arc(sx, sy, r * .25 + 2, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fill();
    } else {
      ctx.arc(x + Math.sin(t * .7 + i) * 12, y, r, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.stroke();
    }
  }
  // نقاط خفيفة بنمط الكرتون
  ctx.fillStyle = 'rgba(255,255,255,.06)';
  for (let y = 20; y < H; y += 40) for (let x = (y / 40 % 2) * 20; x < W; x += 40) { ctx.beginPath(); ctx.arc(x, y, 2.5, 0, TAU); ctx.fill(); }
}

// ---------- أدوات المختبر ----------
// كأس زجاجية: (x,y) أعلى المنتصف
function beakerBack(x, y, w, h) {
  rr(x - w / 2, y, w, h, 26); ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fill();
}
function beakerLiquid(x, y, w, h, level, t, color = 'rgba(79,179,255,.45)') {
  ctx.save(); rr(x - w / 2, y, w, h, 26); ctx.clip();
  const top = y + h * (1 - level);
  ctx.beginPath(); ctx.moveTo(x - w / 2 - 5, y + h + 5);
  for (let i = 0; i <= 30; i++) { const px = x - w / 2 + w * i / 30; ctx.lineTo(px, top + Math.sin(t * 3 + i * .7) * 3.5); }
  ctx.lineTo(x + w / 2 + 5, y + h + 5); ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.7)';
  ctx.beginPath(); for (let i = 0; i <= 30; i++) { const px = x - w / 2 + w * i / 30, py = top + Math.sin(t * 3 + i * .7) * 3.5; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.stroke();
  ctx.restore();
  return top;
}
function beakerFront(x, y, w, h) {
  rr(x - w / 2, y, w, h, 26); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
  // لمعة الزجاج
  ctx.beginPath(); ctx.moveTo(x - w / 2 + 18, y + 24); ctx.lineTo(x - w / 2 + 18, y + h - 30);
  ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineCap = 'round'; ctx.stroke();
  // تدريجات
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(29,43,79,.35)';
  for (let i = 1; i < 5; i++) { const yy = y + h * i / 5; ctx.beginPath(); ctx.moveTo(x + w / 2 - 26, yy); ctx.lineTo(x + w / 2 - 8, yy); ctx.stroke(); }
  // الحافة
  rr(x - w / 2 - 12, y - 10, w + 24, 18, 9); ctx.fillStyle = '#e8f3ff'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
}
function tag(s, x, y, color, sc = 1) {
  if (sc <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  const w = measure(s, 30, 'Cairo', '900') + 44;
  rr(-w / 2 + 4, -22, w, 48, 24); ctx.fillStyle = INK; ctx.fill();
  rr(-w / 2, -26, w, 48, 24); ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  txt(s, 0, -3, 30, { font: 'Cairo', weight: '900', color: '#fff', sw: 6, shadow: false });
  ctx.restore();
}

function gauge(x, y, r, val, label) {
  ctx.save();
  ctx.beginPath(); ctx.arc(x + 4, y + 6, r, 0, TAU); ctx.fillStyle = INK; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
  const a0 = Math.PI * .75, a1 = Math.PI * 2.25;
  const cols = ['#4fd27a', '#ffd84a', '#ff9f43', '#ff5d6c'];
  cols.forEach((c, i) => { ctx.beginPath(); ctx.arc(x, y, r * .74, lerp(a0, a1, i / 4), lerp(a0, a1, (i + 1) / 4)); ctx.lineWidth = r * .2; ctx.strokeStyle = c; ctx.stroke(); });
  const a = lerp(a0, a1, clamp(val));
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * r * .78, y + Math.sin(a) * r * .78);
  ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r * .14, 0, TAU); ctx.fillStyle = '#ff5d6c'; ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
  ctx.restore();
}

// ميزان حرارة: (x, yTop) ، الطول h ، المدى [lo,hi]
function thermo(x, y, h, T, lo, hi, marks = []) {
  ctx.save();
  const bulbY = y + h + 16, frac = clamp((T - lo) / (hi - lo));
  rr(x - 17 + 4, y + 4, 34, h + 10, 17); ctx.fillStyle = INK; ctx.fill();
  rr(x - 17, y, 34, h + 10, 17); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
  const colTop = y + 10 + (h - 10) * (1 - frac);
  rr(x - 8, colTop, 16, bulbY - colTop, 8); ctx.fillStyle = '#ff4d5e'; ctx.fill();
  ctx.beginPath(); ctx.arc(x, bulbY, 27, 0, TAU); ctx.fillStyle = '#ff4d5e'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath(); ctx.arc(x - 9, bulbY - 9, 7, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fill();
  for (const m of marks) {
    const yy = y + 10 + (h - 10) * (1 - (m.v - lo) / (hi - lo));
    ctx.beginPath(); ctx.moveTo(x + 17, yy); ctx.lineTo(x + 30, yy); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();

  const g = ctx.createLinearGradient(0, y0, 0, y0 + h);
  g.addColorStop(0, fz > .5 ? '#f2fbff' : (isSol ? '#ffe2b0' : '#bfe6ff')); g.addColorStop(1, fz > .5 ? '#bfe9ff' : (isSol ? '#ffc56b' : '#7cc8ff'));
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
  ctx.save(); rr(x0, y0, w, h, 30); ctx.clip();
  if (fz > 0) { // لمعان الجليد
    ctx.globalAlpha = fz * .5; ctx.strokeStyle = '#fff'; ctx.lineWidth = 10;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(x0 + 40 + i * 110, y0 - 10); ctx.lineTo(x0 - 60 + i * 110, y0 + h + 10); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  const box = { x: x0 + 40, y: y0 + 45, w: w - 80, h: h - 90 };
  const gx = (c, n) => x0 + w / 2 + (c - (n - 1) / 2) * 62, gy = (r, n) => y0 + h / 2 + (r - (n - 1) / 2) * 62;
  const waters = isSol ? frzParts.solW : frzParts.pure;
  const cols = 4, rows = isSol ? 3 : 4;
  // روابط البلورة
  if (fz > .6) {
    ctx.save(); ctx.globalAlpha = (fz - .6) / .4; ctx.setLineDash([6, 6]); ctx.lineWidth = 3; ctx.strokeStyle = '#2a7fd4';
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const yo = isSol ? 30 : 0;
      if (c < cols - 1) { ctx.beginPath(); ctx.moveTo(gx(c, cols), gy(r, rows) + yo); ctx.lineTo(gx(c + 1, cols), gy(r, rows) + yo); ctx.stroke(); }
      if (r < rows - 1) { ctx.beginPath(); ctx.moveTo(gx(c, cols), gy(r, rows) + yo); ctx.lineTo(gx(c, cols), gy(r + 1, rows) + yo); ctx.stroke(); }
    }
    ctx.restore();
  }
  // محاولة الترتيب عند الصفر في المحلول (تفشل)
  const attempt = isSol ? Math.sin(seg(t, 5.2, 9.2) * Math.PI) * .35 : 0;
  const mood = fz > .5 ? 'happy2' : (T < 8 ? 'cold' : 'happy');
  waters.forEach((p, i) => {
    const [wx, wy] = wpos(p, t, box, 1 - fz);
    const c = i % cols, r = Math.floor(i / cols);
    const tx = gx(c, cols), ty = gy(r, rows) + (isSol ? 30 : 0);
    const k = Math.max(fz, attempt);
    mol(lerp(wx, tx, k), lerp(wy, ty, k), 19, { t: fz > .9 ? 0 : t, seed: p.seed, mood, frozen: fz > .5 });
  });
  if (isSol) {
    frzParts.solS.forEach((p, i) => {
      let [x, y] = wpos(p, t, box, 1.2);
      // المذاب يُدفع إلى الأعلى عند التجمد
      x = lerp(x, x0 + 52 + i * 65, fz); y = lerp(y, y0 + 42, fz);
      if (attempt > .05) { ctx.beginPath(); ctx.arc(x, y, 26 + Math.sin(t * 10) * 3, 0, TAU); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,59,85,.8)'; ctx.stroke(); }
      mol(x, y, 18, { t, seed: p.seed, type: 'solute', mood: attempt > .05 ? 'angry' : 'happy' });
    });
  }
  ctx.restore();
  // ميزان الحرارة
  const tx = cx + 175;
  const toY = thermo(tx, 240, 260, T, -6, 22, [{ v: 0, label: '0' }]);
  tempLabel(T, tx, 198, '#2a7fd4');
  tag(label, cx - 15, 168, color);
  const fk = pop(t, fStart + 1.2, .4);
  if (fk > 0) card('تجمّد!', cx - 15, 548, 26, { scale: fk, bg: '#e2f6ff', color: '#1f72c9' });
  if (isSol) {
    const k = pop(t, 5.6, .4) * (1 - seg(t, 11.3, 11.6));
    if (k > 0) card('لم يتجمد بعد!', cx - 15, 548, 26, { scale: k, bg: '#ffe3e6', color: '#c81d3a' });
    const k2 = pop(t, 13.4, .5);
    if (k2 > 0) {
      ctx.save(); ctx.translate(tx + 72, toY(-3.5)); ctx.scale(k2, k2);
      burst(0, 0, 40, t, '#ffd84a'); txt('ΔTf', 0, 3, 26, { font: 'Pop', weight: '800', dir: 'ltr', color: '#1f72c9', sw: 6 });
      ctx.restore();
    }
  }
}
function sceneFreeze(t) {
  background(t, '#9fdcff', '#3a7bd5', 'snow');
  heading('انخفاض درجة التجمد', t, '#1f72c9', 3);
  freezeSide(t, 890, 'ماء نقي', '#3d8bfd', false);
  freezeSide(t, 390, 'محلول', '#ff9f1c', true);
  caption('عند التجمد تترتب جزيئات الماء في بلّورة منتظمة', t, .5, 5.4);
  caption('جسيمات المذاب تعرقل هذا الترتيب… فلا يتجمد المحلول عند الصفر المئوي', t, 5.4, 11.6);
  caption('يحتاج تبريداً أكثر ← درجة تجمد أقل\n(لهذا نرش الملح على الجليد في الطرق!)', t, 11.6, 18, { bg: '#fff0b8' });
}

// ---- 6) العلاقة بينها (مخطط الطور + سلسلة السبب والنتيجة) ----
const PH = { x0: 80, x1: 640, y0: 590, y1: 170 };
const px = T => lerp(PH.x0, PH.x1, T), py = P => lerp(PH.y0, PH.y1, P);
const VA = .0371, VK = 3.91, SB = .0147, SK = 7, ATM = .62, SOLF = .74;
const Pv = T => VA * Math.exp(VK * T), Ps = T => SB * Math.exp(SK * T);
const TRIP = .3, TRIP_S = Math.log(SOLF * VA / SB) / (SK - VK);
const fusT = (T0, P0, P) => T0 - .03 * (P - P0) / .88;
function drawCurve(f, a, b, prog, color, w, dash) {
  if (prog <= 0) return;
  ctx.save(); ctx.beginPath();
  const n = 60, end = lerp(a, b, prog);
  for (let i = 0; i <= n; i++) { const [x, y] = f(lerp(a, end, i / n)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = INK; ctx.lineWidth = w + 5; if (dash) ctx.setLineDash(dash); ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
  ctx.restore();
}
function sceneSummary(t) {
  background(t, '#ffd56b', '#ff9a3c');
  heading('العلاقة بين الخواص الثلاث', t, '#7445d6');
  // لوحة المخطط
  const k0 = eout(seg(t, .4, 1));
  ctx.save(); ctx.globalAlpha = k0;
  rr(40 + 6, 120 + 8, 640, 540, 30); ctx.fillStyle = INK; ctx.fill();
  rr(40, 120, 640, 540, 30); ctx.fillStyle = '#fffdf6'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
  // المحاور
  arrow(PH.x0, PH.y0, PH.x0, PH.y1 - 10, INK, 4, 18);
  arrow(PH.x0, PH.y0, PH.x1 + 15, PH.y0, INK, 4, 18);
  txt('الضغط', PH.x0 + 46, PH.y1 - 20, 22, { font: 'Cairo', weight: '900', color: INK, stroke: false });
  txt('درجة الحرارة', PH.x1 - 45, PH.y0 - 24, 22, { font: 'Cairo', weight: '900', color: INK, stroke: false });
  // مناطق الأطوار
  const rk = seg(t, 3.2, 3.8);
  txt('صلب', px(.07), py(.55), 32, { color: '#3db8f5', alpha: rk, sw: 6 });
  txt('سائل', px(.45), py(.7), 32, { color: '#3d8bfd', alpha: rk, sw: 6 });
  txt('غاز', px(.92), py(.32), 32, { color: '#9aa6b8', alpha: rk, sw: 6 });
  // منحنيات الماء النقي
  const p1 = eio(seg(t, 1, 3));
  drawCurve(T => [px(T), py(Ps(T))], .05, TRIP, p1, '#3d8bfd', 6);
  drawCurve(T => [px(T), py(Pv(T))], TRIP, Math.log(.85 / VA) / VK, p1, '#3d8bfd', 6);
  drawCurve(P => [px(fusT(TRIP, Pv(TRIP), P)), py(P)], Pv(TRIP), .85, p1, '#3d8bfd', 6);
  // منحنيات المحلول
  const p2 = eio(seg(t, 4.2, 6.2));
  drawCurve(T => [px(T), py(SOLF * Pv(T))], TRIP_S, Math.log(.85 / (SOLF * VA)) / VK, p2, '#ff7a00', 6, [14, 10]);
  drawCurve(P => [px(fusT(TRIP_S, Ps(TRIP_S), P)), py(P)], Ps(TRIP_S), .85, p2, '#ff7a00', 6, [14, 10]);
  // مفتاح الألوان
  const lk = seg(t, 2, 2.5);
  ctx.globalAlpha = k0 * lk;
  ctx.lineWidth = 6; ctx.strokeStyle = '#3d8bfd'; ctx.beginPath(); ctx.moveTo(650, 150); ctx.lineTo(610, 150); ctx.stroke();
  txt('ماء نقي', 600, 150, 22, { font: 'Cairo', weight: '900', color: INK, stroke: false, align: 'right' });
  ctx.globalAlpha = k0 * seg(t, 5, 5.5);
  ctx.setLineDash([12, 8]); ctx.strokeStyle = '#ff7a00'; ctx.beginPath(); ctx.moveTo(490, 150); ctx.lineTo(450, 150); ctx.stroke(); ctx.setLineDash([]);
  txt('محلول', 440, 150, 22, { font: 'Cairo', weight: '900', color: INK, stroke: false, align: 'right' });
  ctx.globalAlpha = k0;
  // سهم انخفاض الضغط البخاري
  const vk = pop(t, 6.4, .5);
  if (vk > 0) {
    const T = .6, a = py(Pv(T)), b = py(SOLF * Pv(T));
    ctx.save(); ctx.globalAlpha = k0 * clamp(vk); arrow(px(T) + 24, a, px(T) + 24, b + 4, '#ff7a59', 6, 18);
    txt('ضغط بخاري\nأقل', px(T) - 95, (a + b) / 2 - 40, 20, { font: 'Cairo', weight: '900', color: '#ff7a59', sw: 5, lh: 1.1 });
    ctx.restore();
  }
  // خط الضغط الجوي
  const ak = eio(seg(t, 7.4, 8.2));
  if (ak > 0) {
    ctx.save(); ctx.setLineDash([10, 8]); ctx.lineWidth = 4; ctx.strokeStyle = '#ff3b55';
    ctx.beginPath(); ctx.moveTo(PH.x0, py(ATM)); ctx.lineTo(lerp(PH.x0, PH.x1, ak), py(ATM)); ctx.stroke(); ctx.restore();
    txt('1 atm', PH.x0 + 40, py(ATM) - 18, 20, { font: 'Pop', weight: '800', dir: 'ltr', color: '#ff3b55', stroke: false, alpha: ak });
  }
  // ΔTb و ΔTf
  const Tb = Math.log(ATM / VA) / VK, Tb2 = Math.log(ATM / (SOLF * VA)) / VK;
  const Tf = fusT(TRIP, Pv(TRIP), ATM), Tf2 = fusT(TRIP_S, Ps(TRIP_S), ATM);
  for (const [a, b, s, c, at] of [[Tb, Tb2, 'ΔTb', '#ff4d6d', 8.4], [Tf, Tf2, 'ΔTf', '#1f72c9', 9.2]]) {
    const k = pop(t, at, .5);
    if (k <= 0) continue;
    ctx.save(); ctx.globalAlpha = k0 * clamp(k);
    for (const T of [a, b]) { ctx.setLineDash([5, 6]); ctx.beginPath(); ctx.moveTo(px(T), py(ATM)); ctx.lineTo(px(T), PH.y0 + 10); ctx.lineWidth = 3; ctx.strokeStyle = c; ctx.stroke(); ctx.setLineDash([]); }
    for (const T of [a, b]) { ctx.beginPath(); ctx.arc(px(T), py(ATM), 8, 0, TAU); ctx.fillStyle = c; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke(); }
    arrow(px(a), PH.y0 + 18, px(b), PH.y0 + 18, c, 5, 14);
    txt(s, (px(a) + px(b)) / 2, PH.y0 + 46, 24 * clamp(k, 0, 1.2), { font: 'Pop', weight: '800', dir: 'ltr', color: c, sw: 5 });
    ctx.restore();
  }
  ctx.restore();

  // سلسلة السبب والنتيجة
  const chain = [
    { s: 'نضيف جسيمات مذاب', c: '#ff9f1c', at: 1.6, y: 175 },
    { s: 'ينخفض الضغط البخاري', c: '#ff7a59', at: 6.4, y: 300 },
  ];
  chain.forEach((b, i) => {
    const k = pop(t, b.at, .5); if (k <= 0) return;
    ctx.save(); ctx.translate(960, b.y); ctx.scale(k, k);
    rr(-250 + 6, -42 + 7, 500, 84, 26); ctx.fillStyle = INK; ctx.fill();
    rr(-250, -42, 500, 84, 26); ctx.fillStyle = b.c; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
    txt(b.s, -35, -3, 34, { font: 'Cairo', weight: '900', sw: 7 });
    if (i === 0) { mol(200, 0, 24, { t, seed: 9, type: 'solute', mood: 'excited' }); }
    else gauge(200, 0, 28, .3);
    ctx.restore();
  });
  if (t > 6.2) arrow(960, 222, 960, 254, '#fff', 9, 24);
  const ends = [{ s: 'ترتفع درجة\nالغليان', c: '#ff4d6d', x: 1100, at: 8.4 }, { s: 'تنخفض درجة\nالتجمد', c: '#3db8f5', x: 820, at: 9.2 }];
  ends.forEach(b => {
    const k = pop(t, b.at, .5); if (k <= 0) return;
    arrow(960 + (b.x - 960) * .2, 346, 960 + (b.x - 960) * .75, 398, '#fff', 8, 22);
    ctx.save(); ctx.translate(b.x, 455); ctx.scale(k, k);
    rr(-125 + 6, -52 + 7, 250, 104, 26); ctx.fillStyle = INK; ctx.fill();
    rr(-125, -52, 250, 104, 26); ctx.fillStyle = b.c; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
    txt(b.s, 0, -2, 30, { font: 'Cairo', weight: '900', sw: 7, lh: 1.15 });
    ctx.restore();
  });
  // الخلاصة
  const fk = pop(t, 11, .6);
  if (fk > 0) {
    ctx.save(); ctx.translate(960, 590); ctx.scale(fk, fk); ctx.rotate(Math.sin(t * 2) * .02);
    rr(-250 + 6, -62 + 7, 500, 124, 30); ctx.fillStyle = INK; ctx.fill();
    rr(-250, -62, 500, 124, 30); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
    txt('كلما زاد عدد جسيمات المذاب\nزاد التأثير!', 0, -2, 32, { color: '#7445d6', sw: 6, lh: 1.2 });
    ctx.restore();
  }
  // مشهد الختام
  const ek = eio(seg(t, 14.6, 15.2));
  if (ek > 0) {
    ctx.save(); ctx.globalAlpha = ek;
    background(t, '#58c4ff', '#2b6fd6');
    ctx.restore();
    const k = pop(t, 15, .6);
    ctx.save(); ctx.translate(W / 2, 300); ctx.scale(k, k);
    burst(0, 0, 230, t * .3, '#8fd4ff');
    txt('أحسنتم!', 0, -20, 120, { color: '#ffd84a', sw: 18 });
    txt('الخواص المجمعة = عدد الجسيمات', 0, 95, 40, { font: 'Cairo', weight: '900', sw: 8 });
    ctx.restore();
    for (let i = 0; i < 7; i++) {
      const kk = back(seg(t, 15.2 + i * .1, 15.8 + i * .1));
      mol(140 + i * 166, lerp(H + 80, 600 - Math.abs(Math.sin(t * 4 + i)) * 40, kk), 34, { t, seed: i * 7, type: i % 3 === 1 ? 'solute' : 'water', mood: 'happy2' });
    }
  }
}

// ---------- الانتقالات ----------
const SCENE_FN = { intro: sceneIntro, idea: sceneIdea, vapor: sceneVapor, boil: sceneBoil, freeze: sceneFreeze, summary: sceneSummary };
const IRIS = .38;
function renderFrame(t) {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const sc = SCENES.find(s => t < s.end) || SCENES[SCENES.length - 1];
  SCENE_FN[sc.name](t - sc.start);
  // ستارة دائرية بين المشاهد
  const maxR = Math.hypot(W, H) / 2 + 20;
  for (const s of SCENES) {
    if (s.start === 0) continue;
    const d = t - s.start;
    if (Math.abs(d) < IRIS) {
      ctx.save(); ctx.fillStyle = INK;
      if (d < 0) { ctx.beginPath(); ctx.arc(W / 2, H / 2, maxR * eio(1 + d / IRIS), 0, TAU); ctx.fill(); }
      else { ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(W / 2, H / 2, maxR * eio(d / IRIS), 0, TAU, true); ctx.fill('evenodd'); }
      ctx.restore();
    }
  }
  // اسم صاحبة الحساب أسفل اليسار
  txt('eng.7ikaya', 14, H - 12, 12, { font: 'Pop', weight: '800', dir: 'ltr', align: 'left', color: '#fff', sw: 3, shadow: false });
  const fade = Math.max(1 - seg(t, 0, .4), seg(t, DURATION - .6, DURATION));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- المؤثرات الصوتية (يقرؤها audio.py) ----------
const SFX = [];
(function () {
  const add = (t, type, o = {}) => SFX.push({ t: +t.toFixed(3), type, ...o });
  for (let i = 0; i < 9; i++) add(.1 + i * .12 + .3, 'pop', { pitch: 1 + i * .06 });
  add(.75, 'boing'); add(2.4, 'pop', { pitch: 1.3 });
  [3.6, 4.2, 4.8].forEach((x, i) => add(x, 'pop', { pitch: 1.1 + i * .15 }));
  for (const s of SCENES.slice(1)) add(s.start - IRIS, 'whoosh');
  const I = 8; SOLUTE_DROPS.forEach((d, i) => add(I + d + .2, 'plop', { pitch: 1 + i * .1 }));
  add(I + 6.9, 'fall'); add(I + 7.6, 'plop'); add(I + 7.65, 'pop', { pitch: 1.4 });
  add(I + 8.1, 'pop', { pitch: 1.2 }); add(I + 9.1, 'ding');
  const V = 19; VAP.pure.spawns.forEach(s => add(V + s, 'blip', { pitch: 1.2 })); VAP.sol.spawns.forEach(s => add(V + s, 'blip', { pitch: .9 }));
  add(V + 7, 'alert'); add(V + 13, 'ding');
  const B = 38; add(B + .3, 'flame');
  add(B + 6.5, 'bubbles', { dur: 11.5, gain: .5 }); add(B + 6.6, 'ding'); add(B + 7, 'alert');
  add(B + 11, 'bubbles', { dur: 7, gain: .5 }); add(B + 11.1, 'ding', { pitch: 1.12 }); add(B + 12.6, 'pop', { pitch: 1.3 });
  const F = 56; add(F + 5, 'freeze'); add(F + 6.2, 'ding'); add(F + 5.6, 'alert'); add(F + 11.6, 'freeze'); add(F + 12.8, 'ding', { pitch: 1.12 }); add(F + 13.4, 'pop', { pitch: 1.3 });
  const M = 74; add(M + 1, 'swish'); add(M + 4.2, 'swish'); add(M + 1.6, 'pop'); add(M + 6.4, 'pop', { pitch: 1.15 });
  add(M + 8.4, 'pop', { pitch: 1.3 }); add(M + 9.2, 'pop', { pitch: 1.45 }); add(M + 11, 'ding');
  add(M + 15, 'tada');
})();

// ---------- واجهة التصدير / التشغيل ----------
window.DURATION = DURATION; window.FPS = FPS; window.SFX = SFX; window.renderFrame = renderFrame;
window.ready = Promise.all(['40px Lalezar', '700 40px Cairo', '800 40px Cairo', '900 40px Cairo', '800 40px Pop']
  .map(f => document.fonts.load(f, 'ابجد abc 123'))).then(() => document.fonts.ready);
if (!/[?&]export/.test(location.search)) {
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = () => { renderFrame(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  });
}
</script>

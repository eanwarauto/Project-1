<title>المنشأة X-21</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Reem+Kufi:wght@500;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one-screen escape room — fixed HUD strip on top, a single specimen-terminal panel centred below, ambient lab atmosphere behind. Single dark look by design. */
:root{
  --void:#05080a;
  --panel:#0b1215;
  --panel-2:#101b20;
  --line:#1f3138;
  --fluid:#3fe0c5;      /* specimen fluid */
  --fluid-dim:#1d6e62;
  --alarm:#ff3b47;      /* emergency light */
  --amber:#ffb53a;      /* warnings */
  --ink:#d9e6ea;
  --mute:#80969e;
  --ok:#5cf0a0;
  --display:'Reem Kufi','Cairo',system-ui,sans-serif;
  --body:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;
  --mono:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.75;overflow-x:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* atmosphere */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.85) 100%)}
.emergency{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.0;
  background:radial-gradient(ellipse at 50% -10%,var(--alarm),transparent 60%);animation:siren 3.2s ease-in-out infinite}
body.playing .emergency{opacity:.16}
body.critical .emergency{opacity:.32;animation-duration:1.1s}
@keyframes siren{0%,100%{filter:brightness(.4)}50%{filter:brightness(1.4)}}
body.flicker #app{animation:flick .5s steps(2) 1}
@keyframes flick{0%{opacity:1}20%{opacity:.25}40%{opacity:1}60%{opacity:.5}100%{opacity:1}}
.flash{position:fixed;inset:0;z-index:50;pointer-events:none;background:var(--alarm);opacity:0}
.flash.on{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}

/* creature */
.eyes{position:fixed;z-index:3;pointer-events:none;display:flex;gap:22px;opacity:0;transition:opacity 1.2s}
.eyes.on{opacity:.9}
.eyes i{width:22px;height:9px;border-radius:50%;background:radial-gradient(circle,#fff6b0 0 18%,var(--amber) 35%,rgba(255,80,0,.0) 72%);
  box-shadow:0 0 18px 4px rgba(255,150,40,.45);animation:blink 2.6s infinite}
@keyframes blink{0%,44%,52%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}

#app{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin-inline:auto;width:100%;max-width:820px;padding-block:12px;background:linear-gradient(var(--void) 70%,transparent)}
.hud[hidden]{display:none!important}
.timer{font-family:var(--mono);font-size:30px;letter-spacing:2px;color:var(--fluid);direction:ltr;
  padding:2px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-shadow:0 0 12px rgba(63,224,197,.5);
  font-variant-numeric:tabular-nums;position:relative}
body.critical .timer{color:var(--alarm);text-shadow:0 0 14px rgba(255,59,71,.7);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.pen{position:absolute;top:-6px;left:50%;font-size:16px;color:var(--alarm);animation:rise 1.1s ease-out forwards;pointer-events:none}
@keyframes rise{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-34px);opacity:0}}
.wing{display:flex;flex-direction:column;line-height:1.3;min-width:0;flex:1}
.wing b{font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wing small{color:var(--mute);font-size:12px;letter-spacing:.5px}
.contam{display:flex;flex-direction:column;gap:3px;width:120px}
.contam small{color:var(--mute);font-size:11px}
.bar{height:7px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--alarm));transition:width .5s}
.icon-btn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2}
@media (max-width:520px){.contam{width:84px}.timer{font-size:24px}.wing b{font-size:15px}}

/* stage */
#stage{width:100%;max-width:820px;margin-inline:auto;flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:12px}
.panel{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,32px);
  box-shadow:0 0 0 1px rgba(63,224,197,.05),0 30px 80px rgba(0,0,0,.6);position:relative;overflow:hidden;animation:enter .5s ease-out}
.panel::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,transparent,var(--fluid),transparent);opacity:.6}
@keyframes enter{from{opacity:.35;transform:translateY(14px)}to{opacity:1;transform:none}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

.tag{font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--alarm);direction:ltr;display:inline-block}
h1,h2{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:clamp(46px,11vw,92px);line-height:1.05;letter-spacing:1px}
h2{font-size:clamp(22px,5vw,30px);line-height:1.35}
p{margin:0}
.lead{color:var(--mute);font-size:17px;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.glitch{position:relative;display:inline-block;color:var(--ink)}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;inset:0;overflow:hidden}
.glitch::before{color:var(--alarm);transform:translate(3px,0);clip-path:inset(0 0 55% 0);animation:g1 2.8s infinite steps(1)}
.glitch::after{color:var(--fluid);transform:translate(-3px,0);clip-path:inset(55% 0 0 0);animation:g2 3.3s infinite steps(1)}
@keyframes g1{0%,90%{transform:translate(0)}92%{transform:translate(5px,-2px)}95%{transform:translate(-4px,1px)}}
@keyframes g2{0%,86%{transform:translate(0)}88%{transform:translate(-6px,2px)}93%{transform:translate(4px,0)}}

.btn{border:1px solid var(--fluid);background:rgba(63,224,197,.1);color:var(--fluid);padding:12px 26px;border-radius:8px;
  font-weight:700;font-size:17px;transition:background .2s,transform .1s}
.btn:hover{background:rgba(63,224,197,.2)}
.btn:active{transform:scale(.97)}
.btn.danger{border-color:var(--alarm);color:#fff;background:var(--alarm);box-shadow:0 0 30px rgba(255,59,71,.35)}
.btn.danger:hover{background:#ff5560}
.btn.ghost{border-color:var(--line);color:var(--mute);background:transparent;font-weight:600;font-size:15px;padding:8px 16px}
.btn.ghost.free{border-color:var(--amber);color:var(--amber);animation:pulse 1.2s infinite}
.btn small{font-weight:400;opacity:.8}
input.name{width:100%;max-width:360px;padding:12px 16px;border-radius:8px;border:1px solid var(--line);background:var(--void);color:var(--ink);font:inherit;font-size:18px}

.f{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);color:var(--fluid);white-space:nowrap}

/* terminal text */
.term{font-size:18px;line-height:1.95;white-space:pre-line;min-height:6em}
.term .cur{display:inline-block;width:9px;height:1.1em;background:var(--fluid);vertical-align:-3px;margin-inline-start:2px;animation:pulse .8s infinite}
.note{background:#e9e1cf;color:#2a2018;border-radius:4px;padding:24px 26px;transform:rotate(-1.2deg);font-size:18px;line-height:1.9;
  box-shadow:0 18px 50px rgba(0,0,0,.7);position:relative;max-width:620px;margin-inline:auto}
.note::after{content:"";position:absolute;width:90px;height:60px;left:22px;bottom:16px;border-radius:50%;
  background:radial-gradient(circle,rgba(120,10,10,.5),rgba(120,10,10,.15) 55%,transparent 70%);filter:blur(1px)}
.note .glitch{color:#7a0d12}
.note .glitch::before,.note .glitch::after{display:none}
.note h3{font-family:var(--display);margin:0 0 8px;font-size:20px}

/* puzzle */
.pz-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.locks{display:flex;gap:6px;flex-wrap:wrap}
.lk{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);background:var(--void)}
.lk.done{background:var(--fluid);border-color:var(--fluid);box-shadow:0 0 8px var(--fluid)}
.lk.cur{border-color:var(--alarm);background:rgba(255,59,71,.25);animation:pulse 1s infinite}
.pz-count{font-family:var(--mono);font-size:13px;color:var(--mute);white-space:nowrap}
.pz-title{color:var(--amber);font-size:15px;font-family:var(--body);font-weight:700;letter-spacing:.5px;margin-bottom:6px}
.pz-prompt{font-size:19px;font-weight:600;line-height:1.85;margin-bottom:18px}
.widget{display:flex;flex-direction:column;gap:12px}
.widget.locked{pointer-events:none}
.fb{min-height:0;margin-top:14px}
.fb .bad{color:var(--alarm);font-weight:700}
.fb .good{border:1px solid rgba(92,240,160,.4);background:rgba(92,240,160,.07);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;animation:enter .4s}
.fb .good b{color:var(--ok);font-family:var(--display);font-size:20px}
.pz-foot{display:flex;justify-content:flex-start;margin-top:16px}
.hint{margin-top:12px;border-inline-start:3px solid var(--amber);padding:8px 14px;background:rgba(255,181,58,.07);color:#ffe2b0;border-radius:4px}

.opt{display:flex;gap:12px;align-items:center;text-align:start;padding:13px 16px;border-radius:10px;border:1px solid var(--line);background:var(--void);font-size:17px;line-height:1.6;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--fluid-dim)}
.opt .k{flex:none;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line);font-family:var(--mono);color:var(--mute);font-size:14px}
.opt.ok{border-color:var(--ok);background:rgba(92,240,160,.1)}
.opt.ok .k{background:var(--ok);color:#03210f;border-color:var(--ok)}
.opt.bad{border-color:var(--alarm);background:rgba(255,59,71,.08);opacity:.55;text-decoration:line-through;text-decoration-color:var(--alarm)}

/* keypad */
.kp{display:flex;flex-direction:column;align-items:center;gap:14px}
.kp-screen{display:flex;gap:8px;direction:ltr}
.kp-screen span{width:46px;height:58px;border:1px solid var(--line);border-radius:8px;background:#020405;display:grid;place-items:center;font-family:var(--mono);font-size:32px;color:var(--fluid);text-shadow:0 0 10px var(--fluid)}
.kp-keys{display:grid;grid-template-columns:repeat(3,72px);gap:9px;direction:ltr}
.kp-keys button{height:56px;border-radius:10px;border:1px solid var(--line);background:linear-gradient(#1a262c,#0e161a);font-family:var(--mono);font-size:24px;box-shadow:0 3px 0 #02070a}
.kp-keys button:active{transform:translateY(2px);box-shadow:none}
.kp-keys .go{color:var(--ok);border-color:rgba(92,240,160,.5)}
.kp-keys .del{color:var(--amber)}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.match .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.chip{padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--void);font-size:16px;line-height:1.5;text-align:center;transition:all .2s}
.chip:hover{border-color:var(--fluid-dim)}
.chip.sel{border-color:var(--amber);background:rgba(255,181,58,.12);box-shadow:0 0 0 1px var(--amber)}
.chip.ok{border-color:var(--ok);background:rgba(92,240,160,.1);color:var(--ok);pointer-events:none}
.chip.bad{border-color:var(--alarm);animation:shake .35s}

/* sort */
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bucket{min-height:110px;border:1px dashed var(--fluid-dim);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:rgba(63,224,197,.03);text-align:center}
.bucket h4{margin:0;font-family:var(--display);color:var(--fluid);font-size:18px}
.bucket .in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bucket .in .chip{font-size:13px;padding:4px 9px}
.bucket.armed{border-style:solid;border-color:var(--amber);background:rgba(255,181,58,.06)}
.bucket.bad{border-color:var(--alarm);animation:shake .35s}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px;padding:10px;border-radius:12px;background:rgba(0,0,0,.3)}
.tube{display:inline-flex;align-items:center;gap:6px}
.tube::before{content:"";width:8px;height:20px;border-radius:0 0 5px 5px;border:1px solid var(--fluid);border-top:none;background:linear-gradient(transparent 40%,var(--fluid) 40%)}

/* order */
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:rtl}
.slot{min-width:64px;height:48px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;font-family:var(--mono);color:var(--fluid);font-size:20px}
.slot.fill{border-style:solid;border-color:var(--fluid);background:rgba(63,224,197,.08)}
.order-pool{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.order-pool .chip{font-family:var(--mono);font-size:22px;min-width:76px}
.order-pool .chip.used{opacity:.2;pointer-events:none}
.order-lbl{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;max-width:420px;margin-inline:auto;width:100%}

/* grid (periodic map) */
.spec{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;padding:10px;border:1px solid var(--line);border-radius:10px;background:#020405}
.spec .f{font-size:20px}
.spec small{color:var(--mute)}
.ptable-wrap{overflow-x:auto;padding-bottom:4px}
.ptable{display:grid;grid-template-columns:14px repeat(18,minmax(0,1fr));gap:2px;direction:ltr;max-width:620px;margin-inline:auto}
.ptable .lbl{font-family:var(--mono);font-size:9px;color:var(--mute);display:grid;place-items:center}
.ptable .c{aspect-ratio:1;border-radius:3px;border:1px solid var(--line);background:rgba(63,224,197,.05);padding:0;font-family:var(--mono);font-size:clamp(8px,2.2vw,12px);min-width:0;overflow:hidden;color:var(--ok);display:grid;place-items:center}
.ptable .c:hover{background:rgba(255,181,58,.25);border-color:var(--amber)}
.ptable .c.hit{background:rgba(92,240,160,.25);border-color:var(--ok);pointer-events:none;font-weight:700}
.ptable .c.miss{background:rgba(255,59,71,.5);border-color:var(--alarm)}
.ptable .e{aspect-ratio:1}
.axis{display:flex;justify-content:space-between;color:var(--mute);font-size:12px}

/* levers */
.lev{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 1fr;gap:8px 10px;align-items:center}
.lev .h{color:var(--mute);font-size:13px;text-align:center;line-height:1.4}
.lev .p{font-weight:700;font-size:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:8px 4px;border:none;background:var(--void);color:var(--mute);font-size:14px;font-weight:600}
.seg button.on[data-v="up"]{background:rgba(92,240,160,.15);color:var(--ok)}
.seg button.on[data-v="down"]{background:rgba(255,181,58,.15);color:var(--amber)}
@media (max-width:520px){.lev{grid-template-columns:1fr 1fr}.lev .p{grid-column:1/-1;margin-top:6px}.lev .h.first{display:none}}

/* doors */
.doors{position:relative;height:200px;border-radius:12px;overflow:hidden;background:radial-gradient(circle,#fff8e0,#ffcf6b 30%,#5a3a00 70%);}
.doors i{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,#1a252b 0 14px,#121b20 14px 28px);border:2px solid #2e4048;transition:transform 1.6s cubic-bezier(.7,0,.3,1)}
.doors i:first-child{right:0}.doors i:last-child{left:0}
.doors i::after{content:"";position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--alarm);box-shadow:0 0 12px var(--alarm)}
.doors i:first-child::after{left:10px}.doors i:last-child::after{right:10px}
.doors.open i:first-child{transform:translateX(102%)}.doors.open i:last-child{transform:translateX(-102%)}
.doors.open i::after{background:var(--ok);box-shadow:0 0 12px var(--ok)}

/* certificate */
.cert{text-align:center;border:2px solid var(--fluid);border-radius:14px;padding:28px 18px;background:radial-gradient(circle at 50% 0,rgba(63,224,197,.15),transparent 60%)}
.cert .who{font-family:var(--display);font-size:clamp(30px,8vw,48px);color:#fff}
.stars{font-size:40px;letter-spacing:8px;color:var(--amber);text-shadow:0 0 16px rgba(255,181,58,.6)}
.stars .off{color:#2a3a40;text-shadow:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stats div{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--void)}
.stats b{display:block;font-family:var(--mono);font-size:24px;color:var(--fluid);font-variant-numeric:tabular-nums;direction:ltr}
.stats small{color:var(--mute)}
.room-meta{display:flex;gap:10px;flex-wrap:wrap}
.idcard{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:18px;background:repeating-linear-gradient(135deg,rgba(63,224,197,.04) 0 10px,transparent 10px 20px),var(--void)}
.id-head{display:flex;justify-content:space-between;align-items:center}
.id-photo{width:46px;height:56px;border-radius:6px;border:1px dashed var(--fluid-dim);background:radial-gradient(circle at 50% 38%,var(--fluid-dim) 0 9px,transparent 10px),radial-gradient(ellipse at 50% 100%,var(--fluid-dim) 0 17px,transparent 18px)}
.idcard label{font-weight:900;font-size:20px;color:var(--fluid)}
.idcard input.name{max-width:none;font-size:22px;padding:14px 16px;border-color:var(--fluid-dim)}
.id-err{color:var(--alarm);font-weight:700}
.cert-shot{display:grid;place-items:center;min-height:200px}
.cert-shot img{width:100%;max-width:460px;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 0 1px var(--line);-webkit-touch-callout:default}
.save-msg{color:var(--mute);font-size:14px;text-align:center}
.pill{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--mute)}
.pill.r{border-color:rgba(255,59,71,.5);color:var(--alarm)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="emergency" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="flash" id="flash" aria-hidden="true"></div>
<div class="eyes" id="eyes" aria-hidden="true"><i></i><i></i></div>

<div id="app" dir="rtl" lang="ar">
  <header class="hud" id="hud" hidden>
    <div class="timer" id="timer">35:00</div>
    <div class="wing"><b id="wingName">—</b><small id="wingSub">—</small></div>
    <div class="contam"><small>نسبة التلوث</small><div class="bar"><span id="contam"></span></div></div>
    <button class="icon-btn" id="muteBtn" aria-label="كتم الصوت" title="الصوت">
      <svg viewBox="0 0 24 24" id="muteIcon"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
  </header>
  <main id="stage" aria-live="polite"></main>
</div>

<script>
/* ============ إعدادات ============ */
const CFG = { TIME: 35*60, BIG: 15, SMALL: 5, HINT: 30 };

const f = s => `<span class="f">${s}</span>`;

/* ============ المحتوى (من الدروس 2-1 و 2-2 و 2-3 فقط، بدون فقرات الإضاءات) ============ */
const ROOMS = [
{
  name:'غرفة الإيقاظ', sub:'الجناح A · الحاضنة 07',

const A = { ctx:null, master:null, rev:null, muted:false, boxOn:false, boxT:null, bi:0 };
function impulse(sec=3.4, decay=2.4){
  const r=A.ctx.sampleRate, len=Math.floor(r*sec), b=A.ctx.createBuffer(2,len,r);
  for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); }
  return b;
}
function audioInit(){
  if(A.ctx){ if(A.ctx.state==='suspended') A.ctx.resume(); return; }
  try{
    A.ctx=new (window.AudioContext||window.webkitAudioContext)();
    A.master=A.ctx.createGain(); A.master.gain.value=A.muted?0:.6; A.master.connect(A.ctx.destination);
    A.rev=A.ctx.createConvolver(); A.rev.buffer=impulse(); const wet=A.ctx.createGain(); wet.gain.value=.6; A.rev.connect(wet); wet.connect(A.master);
    // طنين المنشأة: نغمات منخفضة متنافرة تتنفس ببطء
    const lp=A.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=160;
    const g=A.ctx.createGain(); g.gain.value=.07; lp.connect(g); route(g,.35);
    [55,55.7,58.3,82.4].forEach(fq=>{const o=A.ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=fq; o.connect(lp); o.start();});
    const lfo=A.ctx.createOscillator(), lg=A.ctx.createGain(); lfo.frequency.value=.07; lg.gain.value=70; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  }catch(e){ A.ctx=null; }
}
function route(node, wet=.25){ node.connect(A.master); if(wet>0){ const g=A.ctx.createGain(); g.gain.value=wet; node.connect(g); g.connect(A.rev); } }
function env(g,t,vol,att,dur){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+att); g.gain.exponentialRampToValueAtTime(.0001,t+dur); }
function tone(fq, dur=.15, type='sine', vol=.2, to=null, delay=0, wet=.2, att=.005){
  if(!A.ctx) return; const t=A.ctx.currentTime+delay;
  const o=A.ctx.createOscillator(), g=A.ctx.createGain(); o.type=type; o.frequency.setValueAtTime(fq,t);
  if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  env(g,t,vol,att,dur); o.connect(g); route(g,wet); o.start(t); o.stop(t+dur+.05);
  return o;
}
function noise(dur=.4, freq=1000, vol=.2, type='bandpass', to=null, delay=0, wet=.2, att=.005, q=1){
  if(!A.ctx) return; const t=A.ctx.currentTime+delay;
  const b=A.ctx.createBuffer(1,Math.floor(A.ctx.sampleRate*dur),A.ctx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const s=A.ctx.createBufferSource(); s.buffer=b; const fl=A.ctx.createBiquadFilter(); fl.type=type; fl.Q.value=q; fl.frequency.setValueAtTime(freq,t);
  if(to) fl.frequency.exponentialRampToValueAtTime(to,t+dur);
  const g=A.ctx.createGain(); env(g,t,vol,att,dur); s.connect(fl); fl.connect(g); route(g,wet); s.start(t);
}
function distort(k=60){ const n=1024,c=new Float32Array(n); for(let i=0;i<n;i++){const x=i*2/n-1; c[i]=(3+k)*x*20*Math.PI/180/(Math.PI+k*Math.abs(x));} const w=A.ctx.createWaveShaper(); w.curve=c; return w; }

/* ============ HUD والمؤقت ============ */
function hud(){
  $('timer').firstChild ? $('timer').childNodes[0].nodeValue = mmss(S.time) : $('timer').textContent = mmss(S.time);
  const r=ROOMS[S.room]; $('wingName').textContent=r.name; $('wingSub').textContent=`${r.sub} · ${S.room+1}/${ROOMS.length}`;
  $('contam').style.width = Math.min(100, S.mistakes*5)+'%';
  document.body.classList.toggle('critical', S.time<=180);
}
let timerId=null;
function startTimer(){
  clearInterval(timerId);
  timerId=setInterval(()=>{
    if(!S.running || S.paused) return;
    S.time=Math.max(0,S.time-1); hud();
    if(S.time<=180){ const step = S.time<=60 ? 1 : 2; if(S.time%step===0) sfx.beat(); }
    if(S.time===300 || S.time===60){ sfx.alarm(); flicker(); }
    if(S.time<=0) lose();
  },1000);
}
function penalty(sec){
  if(sec<=0) return;
  S.time=Math.max(0,S.time-sec); hud();
  const p=document.createElement('span'); p.className='pen'; p.textContent='−'+sec; $('timer').appendChild(p); setTimeout(()=>p.remove(),1200);
  if(S.time<=0) lose();
}

/* ============ أداة الكتابة الآلية ============ */
function typeText(el, text, done){
  let i=0; el.innerHTML='<span></span><i class="cur"></i>'; const s=el.firstChild;
  if(reduced){ s.textContent=text; done&&done(); return ()=>{}; }
  const id=setInterval(()=>{ s.textContent=text.slice(0,++i); if(i%2===0) sfx.type(); if(i>=text.length){clearInterval(id); done&&done();} },28);
  return ()=>{ clearInterval(id); s.textContent=text; done&&done(); };
}

    };
    el.querySelectorAll('.kp-keys button').forEach(b=>b.onclick=()=>press(b.dataset.d));
    S.keyHandler=e=>{ const map={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'}; const k=map[e.key]||e.key;
      if(/^[0-9]$/.test(k)) press(k); else if(e.key==='Backspace') press('del'); else if(e.key==='Enter') press('go'); };
    addEventListener('keydown',S.keyHandler);
  },
  match(p,el){
    const L=p.pairs.map((x,i)=>({t:x[0],i})), R=shuffle(p.pairs.map((x,i)=>({t:x[1],i})));
    el.innerHTML=`<div class="match"><div class="col">${L.map(x=>`<button class="chip" data-s="L" data-i="${x.i}">${x.t}</button>`).join('')}</div>
      <div class="col">${R.map(x=>`<button class="chip" data-s="R" data-i="${x.i}">${x.t}</button>`).join('')}</div></div>`;
    let sel=null, left=p.pairs.length;
    el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      if(!sel || sel.dataset.s===b.dataset.s){ if(sel) sel.classList.remove('sel'); sel=b; b.classList.add('sel'); sfx.tick(); return; }
      const a=sel; sel=null; a.classList.remove('sel');
      if(a.dataset.i===b.dataset.i){ a.classList.add('ok'); b.classList.add('ok'); sfx.tick(); if(--left===0) correct(); }
      else { [a,b].forEach(x=>{x.classList.add('bad'); setTimeout(()=>x.classList.remove('bad'),400);}); wrong(true); }
    });
  },
  sort(p,el){
    el.innerHTML=`<div class="buckets">${p.buckets.map((b,i)=>`<div class="bucket" data-b="${i}" role="button" tabindex="0"><h4>${b}</h4><div class="in"></div></div>`).join('')}</div>
      <div class="pool">${shuffle(p.items.map((x,i)=>i)).map(i=>`<button class="chip ${p.tubes?'tube':''}" data-i="${i}">${p.tubes?f(p.items[i][0]):p.items[i][0]}</button>`).join('')}</div>`;
    let sel=null, left=p.items.length;
    const buckets=el.querySelectorAll('.bucket');
    el.querySelectorAll('.pool .chip').forEach(c=>c.onclick=()=>{ if(sel) sel.classList.remove('sel'); sel=c; c.classList.add('sel'); buckets.forEach(b=>b.classList.add('armed')); sfx.tick(); });
    const drop=b=>{
      if(!sel) return; const it=p.items[+sel.dataset.i];
      if(it[1]===+b.dataset.b){ sel.classList.remove('sel'); sel.classList.add('ok'); b.querySelector('.in').appendChild(sel); sel=null; buckets.forEach(x=>x.classList.remove('armed')); sfx.tick(); if(--left===0) correct(); }
      else { b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),400); wrong(true); }
    };
    buckets.forEach(b=>{ b.onclick=()=>drop(b); b.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();drop(b);} }; });
  },
  order(p,el){
    const n=p.items.length; let k=0;
    el.innerHTML=`<div class="order-lbl"><span>${p.labels[0]}</span><span>${p.labels[1]}</span></div>
      <div class="slots">${'<div class="slot"></div>'.repeat(n)}</div>
      <div class="order-pool">${shuffle(p.items.map((t,i)=>i)).map(i=>`<button class="chip" data-i="${i}">${p.items[i]}</button>`).join('')}</div>`;
    const slots=el.querySelectorAll('.slot'), chips=el.querySelectorAll('.order-pool .chip');
    chips.forEach(c=>c.onclick=()=>{
      if(+c.dataset.i===k){ slots[k].textContent=p.items[k]; slots[k].classList.add('fill'); c.classList.add('used'); sfx.tick(); if(++k===n) correct(); }
      else { k=0; slots.forEach(s=>{s.textContent='';s.classList.remove('fill');}); chips.forEach(x=>x.classList.remove('used')); c.classList.add('bad'); setTimeout(()=>c.classList.remove('bad'),400); wrong(true); }
    });
  },
  grid(p,el){
    const valid=(per,g)=> per===1 ? (g===1||g===18) : per<=3 ? (g<=2||g>=13) : true;
    let t=0;
    let html=`<div class="spec" id="spec"></div><div class="ptable-wrap"><div class="ptable"><span class="lbl"></span>`;
    for(let g=1;g<=18;g++) html+=`<span class="lbl">${g}</span>`;
    for(let per=1;per<=7;per++){ html+=`<span class="lbl">${per}</span>`;
      for(let g=1;g<=18;g++) html+= valid(per,g)?`<button class="c" data-p="${per}" data-g="${g}" aria-label="الدورة ${per} المجموعة ${g}"></button>`:`<span class="e"></span>`; }
    html+=`</div></div><div class="axis"><span>الأرقام في الأعلى: المجموعات</span><span>الأرقام على الجانب: الدورات</span></div>`;
    el.innerHTML=html;
    const spec=()=>{ $('spec').innerHTML=`<small>العيّنة ${t+1} من ${p.targets.length}</small><span class="f">${p.targets[t].cfg}</span><small>أين تقع؟</small>`; };
    spec();
    el.querySelectorAll('.c').forEach(c=>c.onclick=()=>{
      const T=p.targets[t];
      if(+c.dataset.p===T.p && +c.dataset.g===T.g){ c.classList.add('hit'); c.textContent=T.sym; sfx.tick(); if(++t===p.targets.length) correct(); else spec(); }
      else { c.classList.add('miss'); setTimeout(()=>c.classList.remove('miss'),450); wrong(true); }
    });
  },
  levers(p,el){
    const st=p.rows.map(()=>[null,null]);
    let html=`<div class="lev"><span class="h first"></span><span class="h">عبر الدورة<br>(من اليسار إلى اليمين)</span><span class="h">خلال المجموعة<br>(من أعلى إلى أسفل)</span>`;
    p.rows.forEach((r,i)=>{ html+=`<span class="p">${r[0]}</span>`; [0,1].forEach(j=>html+=`<div class="seg" data-r="${i}" data-c="${j}"><button data-v="up">↑ يزداد</button><button data-v="down">↓ يقل</button></div>`); });
    html+=`</div><div class="row" style="justify-content:center;margin-top:8px"><button class="btn danger" id="fire">شغّلي البوابة</button></div>`;
    el.innerHTML=html;
    el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ const s=b.parentNode; s.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); st[+s.dataset.r][+s.dataset.c]=b.dataset.v; sfx.tick(); });
    $('fire').onclick=()=>{
      if(st.some(r=>r.includes(null))){ $('fb').innerHTML='<span class="bad">اضبطي كل المفاتيح أولًا.</span>'; return; }
      let ok=0; p.rows.forEach((r,i)=>{ if(st[i][0]===r[1]) ok++; if(st[i][1]===r[2]) ok++; });
      if(ok===p.rows.length*2) correct();
      else { wrong(false); $('fb').innerHTML=`<span class="bad">البوابة لم تستجب… ${ok} من ${p.rows.length*2} مفاتيح صحيحة.</span>`; }
    };
  }
};

/* ============ تشغيل ============ */
showIntro();
</script>

<title>مختبر الروابط الأيونية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Poppins:wght@600;700;800&display=swap">
<style>
/* Layout: a lab bench. The story sits in a banner over the bench; each station is a drag-and-drop board with balls for electrons. The classroom board sits beside the bench on wide screens and under it on phones. */
:root{
  --bg:#eef6fc; --panel:#ffffff; --ink:#122a48; --muted:#56708f; --line:#cfe0ef; --soft:#e4f0fb;
  --e:#f2a20c; --e2:#ffd45c; --c1:#0f9d8e; --c2:#6c4fe0; --c3:#e8335f;
  --ok:#17955a; --bad:#dc4330; --ion:#2a6fd6;
  --display:"Cairo",Tahoma,Arial,sans-serif; --latin:"Poppins","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1727; --panel:#15263d; --ink:#e8f1fb; --muted:#9cb3cd; --line:#2a4262; --soft:#1b3250;
  --e:#ffc04d; --e2:#ffe38a; --c1:#3ccbb9; --c2:#a18cff; --c3:#ff6b8a; --ok:#4fd08a; --bad:#ff7a66; --ion:#6aa8ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1727; --panel:#15263d; --ink:#e8f1fb; --muted:#9cb3cd; --line:#2a4262; --soft:#1b3250;
  --e:#ffc04d; --e2:#ffe38a; --c1:#3ccbb9; --c2:#a18cff; --c3:#ff6b8a; --ok:#4fd08a; --bad:#ff7a66; --ion:#6aa8ff; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-weight:700;direction:rtl;font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto;padding-block:14px 36px;display:grid;gap:14px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:clamp(28px,5vw,40px);font-weight:900;margin:0;line-height:1.15}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 16px;min-width:96px;text-align:center}
.stat b{display:block;font-family:var(--latin);font-size:26px;font-weight:800;color:var(--e)}
.stat span{font-size:15px;color:var(--muted)}
.stations{display:flex;gap:10px;flex-wrap:wrap}
.tab{font:inherit;font-size:17px;font-weight:800;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:10px 16px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tab i{font-style:normal;width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;background:var(--c);color:#fff;font-size:15px}
.tab[aria-selected="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel))}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:20px;min-width:0}
.story{border-radius:22px;padding:16px 18px;background:color-mix(in srgb,var(--c) 12%,var(--panel));border:2px solid color-mix(in srgb,var(--c) 45%,var(--line));line-height:1.9;font-size:18px;font-weight:700}
.story b{color:var(--c)}
.stage-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.stage-h h2{margin:0;font-size:24px;font-weight:900}
.chip{font-family:var(--latin);background:var(--soft);border-radius:999px;padding:6px 14px;font-size:16px;font-weight:800;white-space:nowrap}
.task{font-size:19px;font-weight:800;margin:8px 0 12px;line-height:1.7}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:var(--latin)}
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:640px){.bench{grid-template-columns:1fr}}
.panel{background:var(--soft);border-radius:20px;padding:12px;min-width:0}
.pool{min-height:86px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;border:2px dashed var(--c);border-radius:16px;padding:10px;background:var(--panel)}
.label{font-size:15px;color:var(--muted);margin:0 0 6px;font-weight:700}
.ball{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;cursor:grab;touch-action:none;user-select:none;
  background:radial-gradient(circle at 34% 30%,#fff,var(--e2) 35%,var(--e) 70%,#9a6200);box-shadow:0 4px 10px rgba(0,0,0,.25),inset 0 -4px 6px rgba(0,0,0,.15);
  font-family:var(--latin);font-weight:800;font-size:15px;color:#4a3000;transition:transform .15s}
.ball:hover{transform:scale(1.08)}
.ball.small{width:22px;height:22px;font-size:0;cursor:grab}
.ball.ion{background:radial-gradient(circle at 34% 30%,#fff,#9bd0ff 40%,#2a6fd6 80%);color:#fff}
.zone{min-height:72px;border-radius:16px;border:2px solid var(--line);background:var(--panel);padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;transition:border-color .2s,background .2s;min-width:0}
.zone.over{border-color:var(--ion);background:color-mix(in srgb,var(--ion) 12%,var(--panel))}
.zone.full{opacity:.8}
.zone .zl{width:100%;text-align:center;font-family:var(--latin);font-size:14px;color:var(--muted);font-weight:800}
.shells{display:grid;gap:10px}
.shell{display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:center}
.shell .k{font-family:var(--latin);font-weight:800;color:var(--muted);font-size:15px;text-align:center}
.atom{position:relative;width:240px;height:240px;margin:0 auto}
.atom .nuc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#fff,var(--c) 60%,color-mix(in srgb,var(--c) 60%,#000));color:#fff;font-family:var(--latin);font-weight:800;font-size:20px;text-shadow:0 2px 4px rgba(0,0,0,.3);z-index:2}
.atom .ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.atom .eldot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--e);box-shadow:0 0 6px var(--e2);transform:translate(-50%,-50%)}
.sidebtns{position:relative;width:240px;height:240px;margin:0 auto}
.sidebtns .nuc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 60%,color-mix(in srgb,var(--c) 60%,#000));color:#fff;font-family:var(--latin);font-weight:800;font-size:20px}
.side{position:absolute;min-width:90px;min-height:54px;border-radius:14px;border:2px dashed var(--c);background:var(--panel);display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;padding:6px}
.side.r{right:0;top:50%;transform:translateY(-50%)}.side.l{left:0;top:50%;transform:translateY(-50%)}
.side.t{top:0;left:50%;transform:translateX(-50%)}.side.b{bottom:0;left:50%;transform:translateX(-50%)}
.side.over{border-style:solid;border-color:var(--ion)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{font:inherit;font-size:18px;font-weight:900;border:0;border-radius:16px;padding:12px 20px;cursor:pointer;color:#fff;background:var(--c,var(--c1));box-shadow:0 5px 0 color-mix(in srgb,var(--c,var(--c1)) 60%,#000)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none;border:2px solid var(--line)}
.btn:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid var(--ion);outline-offset:2px}
.fb{border-radius:16px;padding:12px 14px;font-size:17px;line-height:1.8;display:none;margin-top:10px}
.fb.show{display:block}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,var(--panel));border:2px solid var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 12%,var(--panel));border:2px solid var(--bad)}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-top:6px}
.opt{font:inherit;font-size:20px;font-weight:800;color:var(--ink);background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;min-height:58px}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--panel))}
.opt.bad{border-color:var(--bad)}
.opt:disabled{cursor:default}
.tok{display:inline-flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:3px solid var(--c);border-radius:18px;padding:10px 14px;cursor:grab;touch-action:none;user-select:none;font-family:var(--latin);font-weight:800;font-size:24px;min-width:130px}
.tok small{font-family:var(--display);font-size:14px;color:var(--muted);font-weight:700}
.bin{min-height:120px;border-radius:18px;border:3px dashed var(--c);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:8px;min-width:0}
.bin.over{border-style:solid;background:color-mix(in srgb,var(--ion) 12%,var(--panel))}
.bin h4{margin:0;font-size:18px;font-weight:900;color:var(--c)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{min-height:120px;border-radius:18px;border:3px dashed var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px}
.slot.over{border-color:var(--ion);border-style:solid}
.slot .n{font-family:var(--latin);font-weight:800;color:var(--muted);font-size:14px}
.ionrow{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}
.ionbox{border-radius:18px;padding:12px 16px;text-align:center;font-family:var(--latin);font-weight:800;font-size:28px;background:var(--panel);border:3px solid var(--line);min-width:150px}
.ionbox small{display:block;font-family:var(--display);font-size:14px;color:var(--muted);font-weight:700}
.dropwrap{display:none}
.end{display:grid;gap:12px;justify-items:center;text-align:center;padding:10px}
.stars{font-size:48px;letter-spacing:6px;color:var(--e)}
.board h3{margin:0 0 10px;font-size:20px;font-weight:900}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:12px;background:var(--soft);margin-bottom:8px;font-size:17px}
.row.me{outline:2px solid var(--ion)}
.row b{font-family:var(--latin)}
.hint{color:var(--muted);font-size:15px;font-weight:600;margin:6px 0 0;line-height:1.7}
.sig{font-family:var(--latin);font-weight:700;font-size:14px;direction:ltr;text-align:left}
.foot{text-align:center;color:var(--muted);font-size:15px}
.name{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
input.nm{font:inherit;font-size:17px;font-weight:700;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);color:var(--ink);min-width:0;flex:1}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pp .45s}
@keyframes pp{0%{transform:scale(.85)}60%{transform:scale(1.05)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <h1>مختبر الروابط الأيونية</h1>
    <div class="stats">
      <div class="stat"><b id="sPts">0</b><span>النقاط</span></div>
      <div class="stat"><b id="sStars">0</b><span>النجوم</span></div>
    </div>
  </div>
  <div class="stations" id="tabs" role="tablist"></div>

  <div class="grid">
    <main class="card" id="main" aria-live="polite"></main>
    <aside class="card board">
      <h3>لوحة الفصل</h3>
      <div id="peers"><p class="hint">الوضع الفردي. إذا فتحت الصفحة من نفس الرابط مع زميلاتك على أجهزتهن، تظهر نقاطكن هنا مباشرة.</p></div>
      <p class="hint" id="roomNote"></p>
      <div class="name">
        <input class="nm" id="nm" maxlength="24" placeholder="اسمك في اللوحة">
        <button class="btn" id="saveName" style="padding:8px 12px;font-size:16px">حفظ</button>
      </div>
      <p class="sig" style="margin-top:14px">Eng.7IKAYA</p>
    </aside>
  </div>
  <p class="foot">اسحبي الكرات بالماوس أو بالإصبع، وأفلتيها في المكان الصحيح.</p>
</div>

<script>
// ---------- chemistry data (from the lesson) ----------
const EL = {
  H:{z:1,e:2.1,cfg:[1]}, Li:{z:3,e:1.0,cfg:[2,1]}, Be:{z:4,e:1.5,cfg:[2,2]}, B:{z:5,e:2.0,cfg:[2,3]},
  C:{z:6,e:2.5,cfg:[2,4]}, N:{z:7,e:3.0,cfg:[2,5]}, O:{z:8,e:3.5,cfg:[2,6]}, F:{z:9,e:4.0,cfg:[2,7]},
  Na:{z:11,e:0.9,cfg:[2,8,1]}, Mg:{z:12,e:1.2,cfg:[2,8,2]}, Al:{z:13,e:1.5,cfg:[2,8,3]},
  S:{z:16,e:2.5,cfg:[2,8,6]}, Cl:{z:17,e:3.0,cfg:[2,8,7]}, K:{z:19,e:0.8,cfg:[2,8,8,1]}, Ca:{z:20,e:1.0,cfg:[2,8,8,2]}
};
const NAME = {H:'الهيدروجين',B:'البورون',C:'الكربون',Li:'الليثيوم',Be:'البيريليوم',N:'النيتروجين',O:'الأكسجين',F:'الفلور',Na:'الصوديوم',Mg:'المغنيسيوم',Al:'الألومنيوم',S:'الكبريت',Cl:'الكلور',K:'البوتاسيوم',Ca:'الكالسيوم'};
const CAT = {Li:'ليثيوم',Be:'بيريليوم',Na:'صوديوم',Mg:'مغنيسيوم',Al:'ألومنيوم',K:'بوتاسيوم',Ca:'كالسيوم'};
const AN = {N:'نيتريد',O:'أكسيد',F:'فلوريد',S:'كبريتيد',Cl:'كلوريد'};
const valence = s => EL[s].cfg[EL[s].cfg.length-1];
const ionCharge = s => { const v = valence(s); return v <= 3 ? v : -(8 - v); };
const isMetal = s => ionCharge(s) > 0;
const gcd = (a,b) => b ? gcd(b, a % b) : a;
const formula = (cat, an) => { const a = ionCharge(cat), b = -ionCharge(an), g = gcd(a,b); return cat + (b/g > 1 ? b/g : '') + an + (a/g > 1 ? a/g : ''); };
const fHTML = f => f.replace(/(\d)/g,'<sub>$1</sub>');
const LTR = s => `<span class="ltr">${s}</span>`;
const chg = q => (q > 0 ? '+' : '−') + (Math.abs(q) === 1 ? '' : Math.abs(q));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const uniq = a => [...new Set(a)];
const CAPS = [2,8,8,2]; const SHELLS = ['K','L','M','N'];

// ---------- stories and station data ----------
const STORY = {
  1:{title:'بناء الذرة', color:'var(--c1)', text:'أنتِ مهندسة في <b>مدينة الاستقرار</b>. كل ذرة مبنى من أدوار اسمها (K, L, M, N). الدور الأول يتسع لإلكترونين فقط، والبقية لثمانية. ابني الذرة بإلكتروناتها، ثم اكشفي <b>إلكترونات التكافؤ</b> (الموجودة في الدور الأخير) وارسميها كنقاط حول الرمز.'},
  2:{title:'الصيغة والانتقال', color:'var(--c2)', text:'في المختبر، <b>الفلز يتخلص من إلكترونات</b> ليصبح كاتيوناً، و<b>اللافلز يستقبلها</b> ليصبح أنيوناً. انقلي الإلكترونات بينهما حتى يصل كل عنصر إلى الاستقرار، ثم اكتبي <b>صيغة المركب</b> واسمه.'},
  3:{title:'ميزان الخواص', color:'var(--c3)', text:'المركبات الأيونية <b>صلبة</b>، وتوصل الكهرباء عند <b>الانصهار</b> أو <b>الذوبان</b>. ضعي كل رابطة على الميزان، واحسبي فرق السالبية الكهربائية، ثم رتّبي المركبات حسب <b>قوة خاصيتها الأيونية</b>.'}
};
const PAIRS2 = [['Na','Cl'],['Na','F'],['K','Cl'],['K','F'],['Li','F'],['Li','Cl'],['Mg','O'],['Ca','O'],['Mg','S'],['Ca','S']];
const PAIRS3 = [['Na','Cl'],['Mg','O'],['K','F'],['Li','F'],['Ca','O'],['Al','O'],['N','Cl'],['O','H'],['C','O'],['H','Cl'],['S','O'],['Mg','Cl'],['B','F'],['N','H'],['C','H'],['Li','O']];
const ELS1 = ['Li','Be','N','O','F','Na','Mg','Al','S','Cl','K','Ca'];

// ---------- state ----------
const S = { name:'', pts:0, stars:0, best:{1:0,2:0,3:0} };
try { Object.assign(S, JSON.parse(localStorage.getItem('ionicGame2') || '{}')); } catch {}
const save = () => { try { localStorage.setItem('ionicGame2', JSON.stringify(S)); } catch {} };
const $ = id => document.getElementById(id);
const main = $('main');
let station = 1, lv = null, room = null;
function refresh(){ $('sPts').textContent = S.pts; $('sStars').textContent = S.stars; }
function announce(){ if (room) { try { room.presence({ name: S.name || 'طالبة', total: S.pts }); } catch {} } }
function award(n){ S.pts += n; save(); refresh(); announce(); }

// ---------- drag and drop (mouse, pen and touch) ----------
function makeDrag(el, payload){
  el.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    const g = el.cloneNode(true);
    Object.assign(g.style, {position:'fixed', pointerEvents:'none', zIndex:999, margin:0, opacity:.95, transform:'scale(1.12)',
      left:(e.clientX - el.offsetWidth/2)+'px', top:(e.clientY - el.offsetHeight/2)+'px', width:el.offsetWidth+'px'});
    document.body.appendChild(g);
    el.style.opacity = .3;
    const move = ev => { g.style.left = (ev.clientX - el.offsetWidth/2)+'px'; g.style.top = (ev.clientY - el.offsetHeight/2)+'px';
      document.querySelectorAll('[data-zone].over').forEach(z => z.classList.remove('over'));
      const z = hitZone(ev.clientX, ev.clientY); if (z) z.classList.add('over'); };
    const up = ev => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      g.remove(); el.style.opacity = '';
      document.querySelectorAll('[data-zone].over').forEach(z => z.classList.remove('over'));
      const z = hitZone(ev.clientX, ev.clientY);
      if (z && lv && lv.onDrop) lv.onDrop(z.dataset.zone, payload);
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  });
}
function hitZone(x, y){ const t = document.elementFromPoint(x, y); return t ? t.closest('[data-zone]') : null; }
function shake(el){ if (!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function feedback(ok, html){ const f = $('fb'); if (!f) return; f.className = 'fb show ' + (ok ? 'ok' : 'bad'); f.innerHTML = html; }

// ---------- station 1: build an atom, then draw valence dots ----------
let DECK = {};
function newL1(){
  const s = DECK[1][lv_idx];
  return { st:1, s, stage:'build', placed:[0,0,0,0], target:EL[s].cfg, mistakes:0, pool:EL[s].z, sidesPlaced:{r:0,l:0,t:0,b:0}, v:valence(s), dotsPool:valence(s), attempt:0, got:0 };
}
function pick(a){ return a[Math.random()*a.length|0]; }
function renderL1(){
  const l = lv;
  const cnt = l.placed.reduce((a,b)=>a+b,0);
  const poolN = EL[l.s].z - cnt;
  if (l.stage === 'build') {
    main.innerHTML = `${head(1,`المحطة الأولى · ${l.idx+1} / 5`, `الذرة ${NAME[l.s]}`)}
      <div class="stage-h"><h2>المرحلة أ: ابني الذرة</h2><span class="chip">الإلكترونات: ${cnt} / ${EL[l.s].z}</span></div>
      <p class="task">اسحبي الإلكترونات من المخزن إلى الدور الصحيح. الدور الأول يتسع لإلكترونين، والباقي لثمانية.</p>
      <div class="bench">
        <div class="panel">
          <p class="label">النواة</p>
          <div class="atom" id="atomv">${atomSVG(l.s, l.placed)}</div>
        </div>
        <div class="panel">
          <p class="label">الأدوار (K, L, M, N)</p>
          <div class="shells">${SHELLS.map((n,i)=>`<div class="shell"><div class="k">${n}<br>${CAPS[i]}</div>

}
function sidePos(sd){ return ({r:'right:0;top:50%;transform:translateY(-50%)', l:'left:0;top:50%;transform:translateY(-50%)', t:'top:0;left:50%;transform:translateX(-50%)', b:'bottom:0;left:50%;transform:translateX(-50%)'})[sd]; }
function balls(n, cls, max){ let h=''; for (let i=0;i<n;i++) h += `<span class="${cls}" data-ball="1"></span>`; return h; }
function atomSVG(sym, placed){
  // rings sized by shell; electrons drawn on each ring by count
  const rings = placed.map((n,i)=> n>0 ? i : -1).filter(i=>i>=0);
  let h = `<div class="nuc" style="--c:var(--c1)">${sym}</div>`;
  const R = [48, 74, 100, 118];
  SHELLS.forEach((nm,i)=>{ if (i>3) return; const r = R[i]; h += `<div class="ring" style="width:${r*2}px;height:${r*2}px;opacity:${placed[i]||i===0?1:.35}"></div>`;
    for (let k=0;k<placed[i];k++){ const a = -Math.PI/2 + k*2*Math.PI/Math.max(placed[i],1);
      h += `<div class="eldot" style="left:${120+r*Math.cos(a)}px;top:${120+r*Math.sin(a)}px"></div>`; } });
  return h.replace(/<div class="nuc" style="--c:var\(--c1\)">/, '<div class="nuc" style="--c:var(--c1)">');
}
function wireDrops(stage){
  const l = lv;

    main.querySelectorAll('[data-zone^="shell"]').forEach(z => z.querySelectorAll('[data-ball]').forEach(b => makeDrag(b, {from: z.dataset.zone})));
    main.querySelectorAll('[data-zone="pool"] [data-ball]').forEach(b => makeDrag(b, {from:'pool'}));
    l.onDrop = (zone, p) => {
      if (zone === 'pool' && p.from !== 'pool') { const i = +p.from.slice(5); if (l.placed[i] > 0) l.placed[i]--; }
      else if (zone.startsWith('shell') && p.from === 'pool') { const i = +zone.slice(5); const left = EL[l.s].z - l.placed.reduce((a,b)=>a+b,0);
        if (left > 0 && l.placed[i] < CAPS[i]) l.placed[i]++; else shake(main.querySelector(`[data-zone="${zone}"]`)); }
      else if (zone.startsWith('shell') && p.from.startsWith('shell')) { const from = +p.from.slice(5), to = +zone.slice(5);
        if (from !== to && l.placed[to] < CAPS[to] && l.placed[from] > 0) { l.placed[from]--; l.placed[to]++; } }
      renderL1();
    };
  } else {
    main.querySelectorAll('[data-zone^="side-"] [data-ball]').forEach(b => makeDrag(b, {from: b.parentElement.dataset.zone}));
    main.querySelectorAll('[data-zone="pool2"] [data-ball]').forEach(b => makeDrag(b, {from:'pool2'}));
    l.onDrop = (zone, p) => {
      const total = () => Object.values(l.sidesPlaced).reduce((a,b)=>a+b,0);
      if (zone.startsWith('side-') && p.from === 'pool2') { const sd = zone.slice(5); if (total() < l.v && l.sidesPlaced[sd] < 2) l.sidesPlaced[sd]++; else shake(main.querySelector(`[data-zone="${zone}"]`)); }
      else if (zone === 'pool2' && p.from.startsWith('side-')) { const sd = p.from.slice(5); if (l.sidesPlaced[sd] > 0) l.sidesPlaced[sd]--; }
      else if (zone.startsWith('side-') && p.from.startsWith('side-')) { const a = p.from.slice(5), b = zone.slice(5);
        if (a !== b && l.sidesPlaced[b] < 2 && l.sidesPlaced[a] > 0) { l.sidesPlaced[a]--; l.sidesPlaced[b]++; } }
      renderL1();
    };
  }
}
function checkBuild(){

// ---------- shared page pieces ----------
function head(n, step, title){
  const s = STORY[n];
  return `<div class="story" style="--c:${s.color}"><b>${s.title}</b><br>${s.text}</div>
    <div class="stage-h"><span class="chip">${step}</span><span class="chip">${title}</span></div>`;
}
let lv_idx = 0;
function pickLevel(n, idx){
  if (idx >= 5) return endStation(n);
  lv_idx = idx;
  if (idx === 0) DECK[n] = makeDeck(n);
  lv = n===1 ? newL1() : n===2 ? newL2() : newL3();
  lv.idx = idx;
  if (n===1) renderL1(); else if (n===2) renderL2(); else renderL3();
  main.scrollIntoView({behavior:'smooth', block:'start'});
}
function makeDeck(n){
  // five different levels per station, so nothing repeats inside a station
  if (n === 1) return shuffle(ELS1).slice(0,5);
  if (n === 2) return shuffle(PAIRS2).slice(0,5);
  // each level: three compounds whose differences are all different, so the ranking has one answer
  const levels = []; const seen = new Set();
  for (let tries = 0; levels.length < 5 && tries < 500; tries++) {
    const trio = []; const ds = new Set();
    for (const [x,y] of shuffle(PAIRS3)) { const d = +Math.abs(EL[x].e - EL[y].e).toFixed(2); if (!ds.has(d)) { ds.add(d); trio.push([x,y]); } if (trio.length === 3) break; }
    if (trio.length < 3) continue;
    const key = trio.map(t => t.join('')).sort().join('|');
    if (!seen.has(key)) { seen.add(key); levels.push(trio); }
  }
  return levels;
}
function endStation(n){
  const earned = S.best[n];
  S.best[n] = Math.max(S.best[n]||0, 1);
  S.stars += 1; save(); refresh(); announce();
  main.innerHTML = `<div class="end">
    <h2 style="margin:0;font-size:28px">أكملتِ ${STORY[n].title}</h2>
    <div class="stars">★★★</div>
    <p class="hint" style="font-size:18px">${n===1?'الآن تعرفين كيف تبنين الذرة وتكشفين إلكترونات التكافؤ.':n===2?'الآن تعرفين كيف ينتقل الإلكترون لتتكون الأيونات، ثم تكتبين الصيغة.':'الآن تعرفين الخواص الأيونية وترتيبها.'}</p>
    <div class="btns" style="justify-content:center">
      <button class="btn" id="again">العب المحطة من جديد</button>
      ${n<3?`<button class="btn ghost" id="next">المحطة التالية ←</button>`:''}
    </div></div>`;
  $('again').onclick = () => pickLevel(n, 0);
  if ($('next')) $('next').onclick = () => pickLevel(n+1, 0);
}
function setStation(n){
  station = n;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', +t.dataset.n === n));
  pickLevel(n, 0);
}
function buildTabs(){
  $('tabs').innerHTML = [1,2,3].map(n=>`<button class="tab" role="tab" data-n="${n}" style="--c:${STORY[n].color}"><i>${n}</i>${STORY[n].title}</button>`).join('');
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => setStation(+t.dataset.n));
}

// ---------- classroom board ----------
function renderPeers(list){
  const rows = (list||[]).map(p => `<div class="row${p.me?' me':''}"><span>${esc(p.name||'طالبة')}</span><b>${p.total||0}</b></div>`).join('');
  $('peers').innerHTML = rows || '<p class="hint">لا توجد زميلات متصلات الآن.</p>';
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    room = await claude.use('room');
    if (!room) { $('roomNote').textContent = 'الوضع الفردي: لا توجد لوحة مباشرة في هذا العرض.'; return; }
    $('roomNote').textContent = 'اللوحة مباشرة: تظهر نقاط زميلاتك أثناء اللعب.';
    room.onPeers(list => renderPeers(list.map(p => ({...p, me: !!p.you || !!p.me, name: (p.presence && p.presence.name) || p.name, total: (p.presence && p.presence.total) || 0}))));
    announce();
  } catch { room = null; }
})();

$('nm').value = S.name || '';
$('saveName').onclick = () => { S.name = ($('nm').value || '').trim().slice(0,24) || S.name; save(); announce(); };
buildTabs(); refresh(); setStation(1);
</script>
